[package]
name = "renzora_navmesh_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_navmesh: the NavMesh inspector entries, native panel UI, spawn preset, and bake-to-disk workflow. Declared as an Editor-scope plugin in this manifest and linked only by the editor bundle."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
renzora_log_api = { path = "../../api/renzora_log_api" }
bevy = { workspace = true }
renzora_navmesh = { path = ".." }
renzora_ember = { path = "../../renzora_ember" }
renzora_ui = { path = "../../renzora_ui" }
vleue_navigator = { path = "../../../vendor/vleue_navigator", features = ["debug-with-gizmos"] }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "NavMeshEditorPlugin"
scope = "Editor"
