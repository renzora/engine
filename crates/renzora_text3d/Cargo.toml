[package]
name = "renzora_text3d"
version = "0.1.0"
edition = "2021"
description = "3D text distribution plugin — renders a string as per-glyph quad meshes sampled from Bevy's font atlas, positioned in world space. Foundation for the mesh-based world-space UI."

# Distribution plugin: cdylib shipped as .dll/.so/.dylib in plugins/.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
dlopen = []                 # FFI exports gate — expansion site only
editor = ["renzora/editor"] # registers the inspector + Add-Entity preset

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
renzora_macros = { path = "../renzora_macros" }
# Shared SDF glyph-mesh machinery (coverage→SDF, strip packing, the SDF material,
# the standalone text-mesh builder) — an rlib the world-space UI emitter links too.
renzora_text_mesh = { path = "../renzora_text_mesh" }
# Mesh mode: read glyph outlines from the font (ttf-parser) and triangulate the
# fill, with holes, via lyon — real 3D letter geometry, optionally extruded.
ttf-parser = "0.25"
lyon_tessellation = "1.0"

[lints]
workspace = true
