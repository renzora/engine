[package]
name = "renzora_update"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_shell_api = { path = "../api/renzora_shell_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_lang_api = { path = "../api/renzora_lang_api" }
bevy = { workspace = true }
renzora_platform_api = { path = "../api/renzora_platform_api" }
renzora_ember = { path = "../renzora_ember" }
serde = { version = "1", features = ["derive"] }

# Native-only, for the same reason `renzora_export` splits them out: a browser
# tab has no filesystem to install into and no process to spawn, so the whole
# update path is compiled out on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
renzora_net_api = { path = "../api/renzora_net_api" }
# The splash dashboard's page registry, for the Updates page. The dependency runs
# THIS way on purpose: `renzora_splash` is linked into the runtime, so a splash
# that depended on this crate would drag `rfd`, `zip` and the release client into
# the shipped game binary. See `splash_page`.
renzora_splash = { path = "../renzora_splash" }
# The "Install to ▸ Browse…" folder picker. Same direct `rfd` call every other
# editor panel that needs a native dialog makes (the exporter, the importer, the
# hub).
rfd = "0.15"
serde_json = "1"
sha2 = "0.10"

# Only the non-macOS extraction path uses it: macOS unpacks its `.app` with
# `ditto` to keep the code signature intact (see `install::unwrap_download`), so
# shipping `zip` into the Mac build would be a dead dependency.
[target.'cfg(not(target_os = "macos"))'.dependencies]
zip = "9.0.5"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "UpdatePlugin"
scope = "Editor"
