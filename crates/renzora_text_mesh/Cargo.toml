[package]
name = "renzora_text_mesh"
version = "0.1.0"
edition = "2021"
description = "Shared SDF glyph-mesh machinery: Bevy coverage atlas → signed distance field, strip packing, the SDF text material, and a standalone text-mesh builder. Linked (as a plain rlib) by renzora_text3d and the world-space UI mesh emitter."

# Plain rlib (default crate-type): statically linked into whatever links it, so
# it introduces NO second `bevy_dylib` — safe to share across the plugin↔host
# boundary, and its `SdfTextMaterial` gets one stable `TypeId` in both.

[dependencies]
bevy = { workspace = true }

[lints]
workspace = true
