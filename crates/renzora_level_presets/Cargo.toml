[package]
name = "renzora_level_presets"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_editor_api = { path = "../api/renzora_editor_api" }
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_lang_api = { path = "../api/renzora_lang_api" }
renzora_ember = { path = "../renzora_ember" }
# Toasts only — used once, to point an integrated-GPU user at the Graphics
# Quality tier (see `graphics_quality::suggest_low_tier_on_integrated_gpu`).
# A single-purpose dependency, taken only for that one call.
renzora_ui = { path = "../renzora_ui" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora_world_api = { path = "../api/renzora_world_api" }
renzora_render_api = { path = "../api/renzora_render_api" }
renzora_solari_api = { path = "../api/renzora_solari_api" }
renzora_lighting = { path = "../renzora_lighting" }
# Effects bundled into the "World Environment" spawn preset. Most use
# the EffectRouting pattern; SSR is included disabled (forward renderer,
# no DeferredPrepass).
renzora_bloom_effect = { path = "../renzora_bloom_effect" }
renzora_atmosphere = { path = "../renzora_atmosphere" }
renzora_environment_map = { path = "../renzora_environment_map" }
renzora_tonemapping = { path = "../renzora_tonemapping" }
renzora_ssr = { path = "../renzora_ssr" }
renzora_ssil = { path = "../renzora_ssil" }
renzora_antialiasing = { path = "../renzora_antialiasing" }
# Only the effect crates whose types this crate names. Vignette, SSAO, depth of
# field, motion blur and both fogs are intentionally NOT depended on: each
# declares its own plugin, so the generator already puts it in the plugin
# list, and the runtime links each behind an optional feature an export can
# strip. A plain dependency here would add nothing but a second path to the
# crate, one that kept it in a game that had stripped it. Users add them via
# the inspector's "Add Component" overlay.
renzora_terrain = { path = "../renzora_terrain" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "LevelPresetsPlugin"
scope = "Editor"
