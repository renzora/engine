[package]
name = "renzora_grid"
version = "0.1.0"
edition = "2021"


[dependencies]
bevy = { workspace = true }
# `grid` for `InfiniteGrid`/`InfiniteGridSettings` — this crate renders them but
# does not define them, so a plugin can spawn a grid without linking this crate.
renzora = { path = "../renzora", default-features = false, features = ["editor", "grid"] }

[lints]
workspace = true
