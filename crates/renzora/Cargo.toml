[package]
name = "renzora"
version = "0.1.0"
edition = "2021"
description = "Renzora — types, events, and contracts shared across the engine."

# rlib. `renzora` was a dylib so the host and every dlopen'd distribution
# plugin linked one compiled copy of these contracts — one global plugin
# registry, one `TypeId` per boundary-crossing type. Nothing is dlopen'd against
# Bevy any more (the editor is a binary, third-party extensions are C-ABI
# plugins that link no Bevy), so there is no second consumer to share with.
[lib]
crate-type = ["rlib"]

[features]
default = []
# Compile the project's Rust scripts INTO the binary instead of loading each as
# a dylib. Changes only what `script!` emits: without it the entry point is
# `#[no_mangle]` so a dylib exports one findable symbol; with it the attribute is
# dropped so many scripts can be linked into one binary without fifty definitions
# of `renzora_script_update` colliding.
#
# Set by the lean exporter on its throwaway workspace copy, never in the dev
# tree. Cargo compiles `renzora` once per build and unifies features across it,
# which is exactly what makes one flag here apply to every script in the build.
static_scripts = []
# Enables the editor CONTRACT (Operation Merge fold): the thin, boundary-
# crossing editor types — `EditorSelection`, the inspector/spawn/toolbar/
# shortcut registries, `AppEditorExt`, the field macros, `Inspectable`/
# `post_process` derives — that the binary AND the editor bundle both need to
# share one `TypeId` across the dylib boundary. Implies `postprocess` because
# `AppEditorExt::add_post_process` uses the post-process framework. Runtime /
# server / mobile builds leave this OFF so they carry no editor surface area.
editor = ["postprocess", "dep:renzora_macros"]
# Pulls in the post-process framework module (`renzora::postprocess`):
# `PostProcessPlugin<T>`, `PostProcessEffect`, the unified render node and
# the shared `PostProcessRegistry`. Enabled (transitively) by the
# `renzora_postprocess` shim crate and by the editor/runtime desktop hosts.
# Off by default so mobile/wasm/server builds keep the lean contracts-only
# base — they never link the render-graph surface.
postprocess = []
# Within the post-process framework, gates the ordering anchors that reference
# bevy_anti_alias (TAA/FXAA/SMAA) — those live in bevy's `3d` meta, dropped by a
# 2D lean export. `tonemapping`/`Core3d` survive (bevy_core_pipeline). ON in every
# desktop/editor build (forwarded by renzora_runtime/renzora_engine `render_3d`).
render_3d = []
# Gates ONLY the TAA/FXAA/SMAA ordering anchors in `postprocess.rs`, which import
# `bevy::anti_alias`. Split out of `render_3d` because `bevy_anti_alias` is no
# longer welded into bevy's `3d` meta — the root manifest now names it directly,
# so the exporter's Anti-aliasing capability can drop it while the rest of the 3D
# pipeline stays. Without this split, unticking Anti-aliasing broke the build:
# `render_3d` was still on, so these imports survived a stripped `bevy_anti_alias`.
# Losing the anchors only loosens ordering — the phases still run, and ordering
# against a system that isn't in the schedule is a no-op anyway.
antialiasing = ["render_3d"]
# Note on the `dlopen` mechanism: distribution plugins (cdylib + dlopen)
# need the FFI exports `plugin_create`, `plugin_scope`, `plugin_bevy_hash`
# from `renzora::add!`. The macro gates those exports behind
# `cfg(feature = "dlopen")`. Crucially, `cfg(feature = ...)` in a macro
# body resolves against the *calling* crate's features at expansion site,
# not against this crate's. So each distribution plugin must declare its
# own `dlopen = []` feature (and turn it on by default) — adding `features
# = ["dlopen"]` to the renzora dep does nothing on its own.

[dependencies]
# `renzora` is the king of the engine — every other crate depends on it,
# nothing depends back. The dep list stays at bevy + serialization only so
# adding a new feature crate can never introduce a cycle, and bumping any
# feature crate never forces a renzora rebuild (or an ABI break for
# plugins that don't use that crate).
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ron = "0.8"
# NOT a real dependency — a transitive-feature fix. naga is already pulled in by
# `bevy_render` → `wgpu` → `naga 29`. On Bevy 0.19, wgpu-core does NOT enable
# naga's own `termcolor` feature, but `codespan-reporting` ends up with ITS
# `termcolor` feature on (its default). naga's error code then takes the
# `not(termcolor)` branch (a `String` diagnostic buffer) and hands it to
# codespan's `term::emit`, which — with codespan/termcolor ON — demands
# `&mut dyn WriteColor`; `String` isn't `WriteColor`, so naga fails to compile.
# Forcing naga's `termcolor` feature here (via cargo feature unification, since
# `renzora` is the universal dependency) aligns the two: naga then uses
# `NoColor<Vec<u8>>`, which IS `WriteColor`. No cycle risk — naga is a leaf
# render dep, not a `renzora_*` crate. Remove if a future wgpu enables it.
# `wgsl-in` is the real one: `wgsl.rs` parses and validates self-contained
# shaders here so no other crate re-rolls it.
naga = { version = "29", features = ["termcolor", "wgsl-in"] }
# Editor-contract derive/attribute macros (`Inspectable`, `post_process`),
# re-exported from core under the `editor` feature. Proc-macro crate with no
# runtime weight and no cycle (it depends only on syn/quote, never on renzora).
renzora_macros = { path = "../renzora_macros", optional = true }

[lints]
workspace = true
