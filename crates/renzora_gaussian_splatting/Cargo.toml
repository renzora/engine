[package]
name = "renzora_gaussian_splatting"
version = "0.1.0"
edition = "2021"
description = "3D Gaussian splatting. Wraps the vendored bevy_gaussian_splatting renderer (.ply / .gcloud clouds) and resolves the serializable renzora::GaussianSplat contract component into live cloud handles."

# In-workspace plugin: an `rlib` declared with `renzora::add!`, which the build
# generator wires into the committed plugin list and the linker pulls straight
# into the binary.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
editor = ["renzora/editor"]

[dependencies]
bevy = { workspace = true }
# The vendored gaussian-splatting renderer this plugin exposes to the runtime.
# Default features only (stable-rust set, see the vendored Cargo.toml) — no
# viewer/tooling extras.
bevy_gaussian_splatting = { path = "../bevy_gaussian_splatting" }
renzora = { path = "../renzora" }

# .sog bundle decoding (src/sog.rs): stored/deflate zip + lossless-WebP
# property images + meta.json.
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
