[package]
name = "renzora_debugger"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_ember = { path = "../renzora_ember" }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor", "diagnostics"] }
# Reached by the Render Toggles debug panel to flip AutoExposureSettings.
memory-stats = "1"

[lints]
workspace = true
