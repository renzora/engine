[package]
name = "renzora_lang"
version = "0.1.0"
edition = "2021"

[features]
# No backend features any more. `tr()` is declared, not written — the crate
# names the function and every language plugin builds it — so this compiles
# identically whether the game is scripted in Lua, Wren or nothing at all.
default = []
# The script functions this crate declares (its `ScriptExtension`). Purely
# declarative — no interpreter is linked either way — but the declaration itself
# needs the scripting crate, so a game exported without scripting drops it.
# Deliberately NOT in `default`: `renzora_runtime` owns the switch and forwards
# it, so the whole engine agrees on one answer.
scripting = ["dep:renzora_scripting"]

[dependencies]
bevy = { workspace = true }
# Contract dylib: the global translation table + `t()` live here, so the plugin
# only *populates* it. No other `renzora_*` dep is needed for the core feature.
renzora = { path = "../renzora" }
# Only for the `ScriptExtension` trait, which is now pure declaration.
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }

[lints]
workspace = true
