[package]
name = "renzora_auto_exposure"
version = "0.1.0"
edition = "2021"
description = "Auto exposure: Bevy's histogram metering, driven by the camera's Auto Exposure settings, with a keep-dark compensation curve."

# No `editor` feature: lean runtime crate. The Auto Exposure inspector entry is
# in the nested renzora_auto_exposure_editor crate
# (crates/renzora_auto_exposure/editor), linked only by the editor bundle.

[dependencies]
renzora_scene_api = { path = "../api/renzora_scene_api" }
bevy = { workspace = true }
renzora_render_api = { path = "../api/renzora_render_api" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "AutoExposurePlugin"
