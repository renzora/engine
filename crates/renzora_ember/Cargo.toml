[package]
name = "renzora_ember"
version = "0.1.0"
edition = "2021"
description = "Renzora's unified bevy_ui UI framework — markup (HUI), widgets, docking, and particle UI (cinder) — shared by the editor and exported games."

[features]
# `game_ui` gates the in-game `markup` module (the `.html` UI runtime). It's ON
# by default so the editor/dev build is unchanged, but the lean exporter drops it
# for a game with no markup UI — stripping `renzora_game_ui` (~3.8 MiB) AND the
# `bevy_hui` parser (~1.9 MiB), both of which are used ONLY by `markup`. The
# widget library, docking, theming and the foundational `cursor_icon`/`icons`
# helpers stay regardless (every widget needs them). `renzora_runtime` deps this
# crate with `default-features = false` and forwards its own `game_ui` feature.
default = ["game_ui", "render_3d", "editor_tools", "all_widgets"]
# Also pulls scripting: every `renzora_scripting` use in this crate sits inside
# `markup`/`game_ui` (data binding, input fields, the reflection queue behind
# widgets), so a game with no markup UI needs neither.
game_ui = ["dep:bevy_hui", "dep:uuid", "dep:renzora_scripting"]
# World-space UI: `game_ui::world_panel` (a template rendered onto a quad in the
# 3D scene) and `game_ui::world_ui_mesh` (the same template emitted as 3D glyph
# and rect geometry). Both are `Mesh3d` + `StandardMaterial`, i.e. `bevy_pbr`,
# and one of them also wants `renzora_text_mesh`'s `SdfTextMaterial`, so a lean
# export that turns 3D rendering off strips the very thing they are built out
# of. ON by default; `renzora_runtime` forwards its own `render_3d` here, and the
# exporter strips that for a 2D game. Nothing else in this crate is 3D, which is
# why the gate is these two modules rather than the UI layer.
render_3d = ["renzora_text_mesh/render_3d"]
# Desktop conveniences that only the EDITOR's widgets use: the system clipboard
# (`arboard`, for the code editor / text input / console Copy) and local + remote
# image decoding (`image`, for file-browser thumbnails and markdown `![](url)`).
#
# Split out because both are non-optional dependencies that shipped in every
# exported game with UI — `image` in particular is a whole second decoder stack
# beside bevy's, and drags `moxcms` behind it. A game's markup UI loads textures
# through bevy's asset pipeline and has no code editor, so it needs neither.
#
# Each call site already had a wasm no-op twin, so switching this off takes the
# same path the browser build has always taken: copy silently fails, paste
# yields `None`, an image request resolves to its placeholder.
#
# Also every widget below, and the editor chrome's theme shaders (installed only
# under this feature): the editor uses all of them.
editor_tools = ["dep:arboard", "dep:image", "all_widgets"]

# ── The heavy widgets ─────────────────────────────────────────────────────────
#
# Each of these draws with its own `UiMaterial`, and in Bevy every UI material is
# a whole render pipeline: about 150 to 600 KiB of code per widget, where a plain
# widget (button, slider, checkbox) is tens of KiB. Each feature gates only the
# widget's plugin and the markup that builds it; the module still compiles, so
# nothing that names its types breaks, and the linker drops what nothing calls.
# A markup tag for a widget left out shows a placeholder saying so.
#
# ON by default (`all_widgets`). `renzora_runtime` forwards one `ui_<name>`
# feature per widget, which the lean exporter keeps exactly when the project
# uses that widget (see `renzora_export::capabilities`).
all_widgets = [
    "node_graph", "color_picker", "curve_editor", "gradient_editor", "gauge",
    "chart", "waveform", "code_editor", "timeline", "canvas",
    "shape_circle", "shape_arc", "shape_radial_progress", "shape_line",
    "shape_triangle", "shape_polygon", "shape_rectangle", "shape_wedge", "shape_tri3",
]
node_graph = []
# The HSV picker (`hsv_picker`); the plain `color_picker` is sliders and stays.
color_picker = []
curve_editor = []
gradient_editor = []
# The gauge's arc material, which the knob and markup's `vector="gauge"` (arc,
# ring, speedometer) draw with too.
gauge = []
# Line and bar charts, and markup's `vector="line"` / `vector="bars"`.
chart = []
# The waveform, the audio player built on it, and markup's `vector="waveform"`.
waveform = []
code_editor = []
timeline = []
# Script drawing: a markup node with `canvas`, drawn by a script's `on_draw`.
# It renders with five of the shapes below.
canvas = ["shape_arc", "shape_circle", "shape_line", "shape_rectangle", "shape_tri3"]
# The game UI's SDF shapes, one material each.
shape_circle = []
shape_arc = []
shape_radial_progress = []
shape_line = []
shape_triangle = []
shape_polygon = []
shape_rectangle = []
shape_wedge = []
shape_tri3 = []

[dependencies]
renzora_shell_api = { path = "../api/renzora_shell_api" }
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_lang_api = { path = "../api/renzora_lang_api" }
renzora_log_api = { path = "../api/renzora_log_api" }
# The theme file format, so a game can apply a theme the same way the editor
# does: ember owns the palette a theme maps into (see `theme::palette_from_theme`).
renzora_theme = { path = "../renzora_theme" }
bevy = { workspace = true }
# Theme serialization: the per-widget Theme loads from project themes/*.toml
# (runtime-safe — the exported game uses the same Theme).
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
# The world-space UI mesh emitter's glyph geometry. Its own crate because it is
# the one part of the contract that needs `bevy::text`; a lean export with the UI
# capability off strips that, and drops ember, so nothing pulls this in there.
renzora_text_mesh = { path = "../shared/renzora_text_mesh" }
# A markup edit is one undoable change.
# Window resizing helpers.
renzora_platform_api = { path = "../api/renzora_platform_api" }
# The script canvas, UI callbacks and the markup's script bridge.
renzora_scripting_api = { path = "../api/renzora_scripting_api" }
# Theme shaders, built through `shader_source` like every other shader. The
# shader layer and not the material one: ember has ~60 crates above it, and the
# material layer sits on the render layer, so linking it here made every render
# setting edit rebuild the editor.
renzora_shader_api = { path = "../api/renzora_shader_api" }
# Markup runtime (folded in from the former renzora_hui crate): the vendored
# bevy_hui parser, the game-UI canvas primitives, and the scripting bridge.
# Both are used only by the `markup` module → gated behind `game_ui`.
bevy_hui = { path = "../../vendor/bevy_hui", optional = true }
# Stable ids for the world-UI panel picking pointers. Same crate bevy_picking
# uses for `PointerId::Custom`, so the versions unify. Optional + tied to
# `game_ui` because only the world-panel module needs it.
uuid = { version = "1", optional = true }
# `default-features = false`: ember uses only core scripting types — the lean
# exporter strips http via `renzora_runtime`'s forwarding,
# which only works if no other lean-closure crate forces the defaults back on.
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }
# Send+Sync channel for the markdown widget's image downloads (background
# thread → per-frame poll), same as renzora_hub's thumbnail cache.
crossbeam-channel = "0.5"

# System clipboard for the code editor's cut/copy/paste. Native-only: arboard
# has no wasm backend (the browser clipboard is async + gesture-gated), so the
# editor's clipboard path no-ops on wasm. Optional under `editor_tools`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", optional = true }
# `Request` for the web image widget. The vocabulary crate, not `renzora_net`
# (the frame pump), so an edit to the pump does not rebuild ember's dependents.
renzora_net_api = { path = "../api/renzora_net_api" }
# Markdown image downloads (`![alt](url)`) and the file browser's thumbnail
# decode: fetch + decode on a background thread, register as bevy `Image`
# assets. wasm builds no-op both. Optional under `editor_tools` — this is a
# SECOND image-decoding stack on top of bevy_image's, and it brought `moxcms`
# with it into every shipped game.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }

# The window handle of a floating dock window, for the Win32 calls that follow
# its native-frame title-bar drags (`dock::os_frame`).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
# Same version as bevy_hui's — the template-parse test destructures
# `nom::Err` to format parse failures with file/line context.
nom = "7.1.3"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "EmberRuntimePlugin"
# Before the game UI and markup, which read the interaction state and widget
# plugins it installs.
priority = -10
[[package.metadata.renzora.plugin]]
type = "game_ui::GameUiPlugin"
[[package.metadata.renzora.plugin]]
type = "markup::MarkupPlugin"
