# Vendored fork of bevy_hui. Bevy 0.20 port changes:
#   - a `<button>` inserts `FocusPolicy::Block` + `Interaction` directly, the two
#     things the deprecated (and now unnameable) `bevy_ui::Button` required, so
#     hover/press styling and bindings keep working unchanged.
#   - border radii are written through `.into()`: `BorderRadius` corners are
#     `CornerRadius` (elliptical) in 0.20.
[package]
name = "bevy_hui"
authors = ["Lorenz Mielke"]
version = "0.6.0"
edition = "2021"
description = "pseudo Html templating ui crate for the bevy-engine (vendored fork)."
keywords = ["bevy", "ui", "xml", "html", "dsl"]
repository = "https://github.com/Lommix/bevy_hui"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["game-development"]
publish = false

[dependencies]
bevy = { workspace = true }
bevy_picking = { workspace = true, optional = true }
thiserror = "1.0.63"
nom = "7.1.3"
owo-colors = "4.1.0"

[features]
picking = ["dep:bevy_picking"]
default = []

[dev-dependencies]
test-case = "3.3.1"
