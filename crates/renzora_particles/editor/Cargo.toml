[package]
name = "renzora_particles_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_particles: the .vfx effect editor (ember node graph, live preview, emitter settings, template gallery), the Particle System Add Entity preset and its inspector. Declared as an Editor-scope plugin in this manifest and linked only by the editor bundle."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
renzora_shell_api = { path = "../../api/renzora_shell_api" }
renzora_viewport_api = { path = "../../api/renzora_viewport_api" }
renzora_scene_api = { path = "../../api/renzora_scene_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
renzora_log_api = { path = "../../api/renzora_log_api" }
bevy = { workspace = true }
# Particle templates in the create-file menu, and the convert asset actions.
renzora_material_api = { path = "../../api/renzora_material_api" }
renzora_shader_api = { path = "../../api/renzora_shader_api" }
renzora_particles = { path = ".." }
# The viewport gizmo: the overlay gizmo group and the selection it follows.
renzora_gizmo = { path = "../../renzora_gizmo" }
renzora_editor_framework = { path = "../../renzora_editor_framework" }
# The effect editor's panels: the node graph view, inline editors, menus.
renzora_ember = { path = "../../renzora_ember" }
# Edits go on the document's own undo stack, as the material editor's do.
renzora_undo = { path = "../../renzora_undo" }
# The inspector drawer reuses its asset drop slot.
renzora_inspector = { path = "../../renzora_inspector" }
ron = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The texture slot's Browse button.
rfd = "0.15"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "ParticlesEditorPlugin"
scope = "Editor"
