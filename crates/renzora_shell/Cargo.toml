[package]
name = "renzora_shell"
version = "0.1.0"
edition = "2021"
description = "bevy_ui-native editor shell (dock host + chrome). The egui → bevy_ui/HUI migration target for the editor layout."

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor"] }
# Where an install keeps its plugins, which is not always beside the executable:
# inside a macOS `.app` the bundled ones are sealed by the code signature and
# anything installed has to go to Application Support instead. This crate carries
# no dependencies of its own, so the answer is shared rather than copied.
renzora_native_build = { path = "../renzora_native_build" }
# The bevy_ui UI framework. The dock model lives here; the reconciler +
# interactions migrate over next.
renzora_ember = { path = "../renzora_ember" }
# Editor settings + undo/redo hooks + project handlers for the top-bar menus.
renzora_editor_framework = { path = "../renzora_editor_framework" }
# Persist the per-workspace dock layout to ~/.renzora/layout.json across sessions.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Document-tab + workspace-layout model (DocumentTabState etc.), shared with the
# egui editor so both render the same open documents.
renzora_ui = { path = "../renzora_ui" }
# Phosphor icon system (`Icon` component + `apply_icons`) — same icons the egui
# editor uses, rendered into bevy_ui. HuiPlugin runs the resolver globally.
# Theme source: maps the active ThemeManager theme into ember's runtime palette.
renzora_theme = { path = "../renzora_theme" }
# Viewport toolbar (header): the shell hosts it as a full-width strip directly
# below the document-tab bar instead of nesting it inside the viewport panel.
renzora_viewport = { path = "../renzora_viewport" }

[lints]
workspace = true

# Native file picker for "File → Install Plugin…". rfd's web backend has no
# synchronous `FileDialog`, and there is nothing to install on the web anyway —
# `plugin_install::open_install_dialog` says so there instead of picking a file.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

# The Fullscreen API, for the title bar's web-only fullscreen toggle — the one
# window state a page is allowed to change.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
