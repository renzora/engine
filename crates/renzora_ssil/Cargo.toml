[package]
name = "renzora_ssil"
version = "0.1.0"
edition = "2021"
description = "Screen-space indirect lighting: light bounced between nearby surfaces, gathered from the lit frame."

# No `editor` feature: lean runtime crate. The inspector lives in the nested
# renzora_ssil_editor crate (crates/renzora_ssil/editor).

[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora = { path = "../renzora", default-features = false, features = ["postprocess"] }

[lints]
workspace = true
