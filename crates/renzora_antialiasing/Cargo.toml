[package]
name = "renzora_antialiasing"
version = "0.1.0"
edition = "2021"

# No `editor` feature: lean runtime crate. The inspector moved to the nested
# renzora_antialiasing_editor crate (crates/renzora_antialiasing/editor).

[features]
# The DLSS method (Bevy's DLSS Super Resolution). Set by the runtime's own
# `dlss` feature, which needs the DLSS SDK to build; without it the method is
# still listed, and the inspector says this build has no DLSS.
dlss = ["bevy/dlss"]

[dependencies]
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora_solari_api = { path = "../api/renzora_solari_api" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "AntiAliasingPlugin"
