[package]
name = "renzora_network"
version = "0.1.0"
edition = "2021"

[features]
default = []
editor = []

[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
renzora_network_api = { path = "../api/renzora_network_api" }
renzora_scripting_api = { path = "../api/renzora_scripting_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
# `SceneEntityId` (matching scene entities across peers) and `SceneInstance`
# (instancing a `NetworkPrefab`).
renzora_scene_api = { path = "../api/renzora_scene_api" }

# Native only: wasm has no UDP sockets. bincode is the wire format.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bincode = { version = "2", features = ["serde"] }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "NetworkPlugin"
