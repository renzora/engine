[package]
name = "renzora_command_palette"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_editor_framework = { path = "../renzora_editor_framework" }
renzora_ember = { path = "../renzora_ember" }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor"] }
# The palette is local-only now. Its remote tabs (docs / forum / users / feed /
# courses / marketplace) queried renzora.com through the auth API client and went
# with the social removal, taking `renzora_auth` and the worker-thread channel
# with them.

[lints]
workspace = true
