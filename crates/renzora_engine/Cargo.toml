[package]
name = "renzora_engine"
version = "0.1.0"
edition = "2021"

# No `editor` feature: this crate is compiled lean. Its editor-only code moved
# to the nested `renzora_engine_editor` crate (crates/renzora_engine/editor),
# installed only by the editor bundle. Editor-vs-game is decided at runtime via
# `renzora::EditorSession`.

[features]
# Optional subsystems this core crate would otherwise drag into EVERY build —
# including the lean game export — even when a game never uses them. They're ON
# by default so the editor/dev/server build is byte-for-byte unchanged; the lean
# exporter drops one by depending on this crate with `default-features = false`
# (via `renzora_runtime`, which forwards only the kept subsystems). `audio` just
# re-exports the crate (see lib.rs); `animation` gates the scene-save deny of
# `AnimatorReadState` (see scene_io.rs). See `renzora_export::capabilities`.
default = ["audio", "animation", "terrain", "physics", "render_3d", "shader_graph", "gltf", "render_2d", "crash_dialog", "scripting", "ui"]
# bevy_ui. This crate's only use is denying the two UI camera-target components
# on scene save (`scene_io.rs`, via `DenyUiCameraTargets`); without bevy_ui those
# components don't exist, so there is nothing to deny. Off is what lets a game
# with no UI drop bevy_ui, bevy_text and the parley/swash text-shaping stack.
ui = []
# Scripting. This crate needs it for exactly two systems — the VFS script-file
# reader and the asset-progress mirror — both of which become empty systems when
# it's off, so the `Startup`/`Update` chains around them keep their ordering.
scripting = ["dep:renzora_scripting"]
# The native crash message box (`crash.rs::show_crash_dialog`). Its call site is
# already gated on `is_editor_process()`, so a shipped game can never reach it —
# yet `rfd` (a full native file-dialog stack: GTK/COM shell bindings) and
# `arboard` linked into every export regardless. Off = the panic hook still
# captures, scrubs and writes `crash.log`; it just doesn't pop a window.
crash_dialog = ["dep:rfd", "dep:arboard"]
# The 3D rendering pipeline: bevy_pbr (StandardMaterial/Mesh3d, deferred-vs-forward
# renderer, contact shadows, deferred prepass) + the renzora_shader graph-material
# system. Off = a 2D-only export (sprites + UI). Gates the scene-save 3D-material
# denies (scene_io.rs) and the render-mode/contact-shadow setup (lib.rs). NOTE: a
# full 2D build also needs the bevy `3d` meta-feature dropped at the root manifest
# + bevy_light handling — see plan (2D MODE).
render_3d = ["renzora/render_3d", "renzora_plugin/render_3d"]
# The node-graph material system (`renzora_shader`). Split out of `render_3d`
# because it's a large slice of it (~1 MiB of code) that a game using only
# StandardMaterial never touches. Gates the `GraphMaterial`/`MaterialResolved`
# scene-save denies. Implies `render_3d` — graph materials are bevy_pbr materials.
shader_graph = ["dep:renzora_shader", "render_3d"]
# The 2D sprite scene systems (scene_io.rs: SpriteImagePath image binding,
# SpriteCustomSize mirror, SpriteSheet frame cropping). Off = a 3D-only export
# with no sprite game-code. Mirror of `render_3d` in the other direction. NOTE:
# this cannot yet drop bevy's `2d` meta-feature at the root manifest — the
# window-blit present path (`renzora_runtime::viewport_stretch`) renders the
# offscreen viewport image with a bevy `Sprite` in EVERY export, 3D included.
# Until that blit is reworked, `render_2d` strips only our own sprite systems.
render_2d = []
# glTF model loading (`bevy::gltf::Gltf`). Gates the LOD-variant probe
# (`mesh_lod.rs`) and the `MeshInstanceData` rehydrate path (`scene_io.rs`) —
# both exist only to load `.glb`/`.gltf` models, so a scene built from engine
# primitives needs neither. Implies `render_3d`: bevy's `bevy_gltf` requires
# `bevy_pbr`, so the two can't be stripped independently.
gltf = ["render_3d"]
audio = ["dep:renzora_audio"]
animation = ["dep:renzora_animation"]
# `terrain` only gates the scene-save deny of `TerrainCheckerboardMaterial`
# (scene_io.rs) — the sole renzora_terrain use in this crate.
terrain = ["dep:renzora_terrain"]
# `physics` gates the avian deny blocks in scene_io.rs (the only avian use — the
# `pub use renzora_physics` re-export below is the only renzora_physics use). The
# string-based `type_name.starts_with("avian3d::"/"avian2d::")` filters need no
# avian dep.
physics = ["dep:renzora_physics", "dep:avian3d", "dep:avian2d"]

[dependencies]
renzora_macros = { path = "../renzora_macros" }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
renzora_physics = { path = "../renzora_physics", optional = true }
renzora_rmip = { path = "../renzora_rmip" }
renzora_lighting = { path = "../renzora_lighting" }
renzora_shader = { path = "../renzora_shader", optional = true }
renzora_terrain = { path = "../renzora_terrain", optional = true }
renzora_network = { path = "../renzora_network" }
renzora_bsn = { path = "../renzora_bsn" }
# For `plugin_scene_bridge`: mirrors the C-ABI plugin host's component schemas
# into `renzora_bsn`'s plain-data registry, so the scene format can serialize
# types it has no Rust definition for without depending on the plugin system
# itself. Same direction `renzora_inspector` and `renzora_postprocess` already
# take; no cycle, since `renzora_plugin[host]` depends only on bevy + libloading.
renzora_plugin = { path = "../renzora_plugin", features = ["host"] }
renzora_rpak = { path = "../renzora_rpak" }
renzora_audio = { path = "../renzora_audio", optional = true }
# `default-features = false`: engine uses only core scripting types; backends/
# blueprint/http are forwarded from `renzora_runtime` (see its features). Keeping
# defaults here would pin them on for every lean export.
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }
renzora_animation = { path = "../renzora_animation", default-features = false, optional = true }
futures-lite = "2"
ron = "0.8"
serde = "1"
thiserror = "2"
toml = "0.8"
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "default-collider", "parry-f32"], optional = true }
avian2d = { version = "0.7", default-features = false, features = ["2d", "f32", "default-collider", "parry-f32"], optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"

# A wall clock the web actually has. `std::time::SystemTime` is unimplemented on
# wasm32-unknown-unknown and panics on first use, which would make the crash
# reporter's own timestamp the second crash. Bevy pulls this same crate for
# `bevy::platform::time::Instant`, so it costs nothing new — but it re-exports
# only `Instant`, hence the direct dep for `SystemTime`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[lints]
workspace = true
