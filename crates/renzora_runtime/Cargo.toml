[package]
name = "renzora_runtime"
version = "0.1.0"
edition = "2021"
description = "Shared engine library for the Renzora binary — the runtime foundation. The editor is the separate `renzora_editor` bundle dll loaded at startup, never this crate."


[features]
# Every subsystem is ON by default, so the editor/dev build and the normal
# `runtime` build are byte-for-byte unchanged. The lean exporter shrinks a game
# by removing the subsystems it doesn't use from `default` — but only in its
# DISPOSABLE copy of this manifest, never the dev source (see
# `renzora_export::build` / `capabilities`). Core foundation crates
# (engine/scripting/input/physics/globals/ember/lighting/postprocess/…) are not
# optional: they're referenced directly and must always be present.
default = ["crash_dialog", "shader_graph", "tonemapping_luts", "scripting", "ui", "gltf", "navmesh", "terrain", "water", "audio", "particles", "animation", "blueprint", "game_ui", "bloom", "ssao", "ssr", "dof", "motion_blur", "distance_fog", "volumetric_fog", "lens_distortion", "oit", "antialiasing", "atmosphere", "environment_map", "skybox", "solari", "localization", "script_http", "physics_3d", "physics_2d", "render_3d", "render_2d", "tilemap", "sprite_anim", "lumen", "cloth", "gaussian_splatting", "ragdoll", "parkour", "light2d", "forward_decal", "gizmos", "networking", "editor_tools"]
# The native crash message box. Forwarded rather than inherited: this crate deps
# `renzora_engine` with `default-features = false`, so without an explicit switch
# the dialog would vanish from the editor too — and the whole point is to drop it
# for a *shipped game*, where its call site (`is_editor_process()`) can never be
# reached anyway. Off takes `rfd` and `arboard` out of the binary; the panic hook
# still writes `crash.log`.
crash_dialog = ["renzora_engine/crash_dialog"]
# Ember's desktop conveniences: the system clipboard (`arboard`) and the second
# image-decoding stack (`image` + `moxcms`) behind file-browser thumbnails and
# markdown `![](url)`. Only the editor's own widgets use either, but both were
# non-optional dependencies of `renzora_ember`, so they shipped in every exported
# game that kept the UI. Paired with the exporter's "Editor/dev conveniences"
# capability, which is off by default — the same toggle that drops `rfd` and the
# crash dialog. `?/` so it never drags the UI layer in on its own.
editor_tools = ["renzora_ember?/editor_tools", "renzora_ember_dylib?/editor_tools"]
# OpenXR/VR boot mode (`add_xr_rendering`, activated by launching with --vr).
# NOT in default: the binary (`renzora_app`) opts in for desktop builds via its
# own default `xr` feature, so wasm/mobile lanes and the lean exporter never
# pull the OpenXR stack unless explicitly asked.
xr = ["dep:renzora_xr"]
# Link the shared contract image. Forwarded from `renzora_app`'s
# `dynamic_linking` (in ITS default set) and landing here rather than there
# because both binaries depend on this crate and only one of them has a feature
# table — see the root manifest.
#
# NOT in this crate's `default`: the lean exporter builds with
# `--no-default-features --features runtime`, and a static single binary must not
# import a dylib. Leaving it out here means "static" needs no extra step — the
# feature simply never arrives.
#
# It also arms the native-plugin loader. Those link the shared images, so loading
# one into a statically linked host is memory corruption with no diagnostic —
# gating both on one switch is what makes that combination unreachable rather
# than merely discouraged. It is also why the C-ABI mechanism stays: a lean
# export has no shared images for a native plugin to link against.
dynamic_linking = [
    "dep:renzora_dylib",
    # The UI half of the same idea. A native plugin that draws a panel links
    # `renzora_ember`, and ember keeps the theme palette, the stylesheet, the UI
    # font scale and the viewport-toolbar lists in process-global statics — so a
    # privately linked copy gives the plugin its own theme and its own toolbar
    # nobody reads. See `crates/renzora_ember_dylib/src/lib.rs`.
    #
    # Pulled here rather than from `ui` (which is what makes `renzora_ember`
    # optional) because cargo cannot express "this dep, only when two features
    # are both on". That is harmless in practice: `dynamic_linking` is only ever
    # enabled for a full editor/dev build, where `ui` is on via `default`. The
    # `extern crate` in `src/lib.rs` still requires both, so a hand-built
    # `--no-default-features --features runtime,dynamic_linking` compiles rather
    # than failing to resolve.
    "dep:renzora_ember_dylib",
    "renzora_native_plugin/dynamic_linking",
    "renzora_rust_script/dynamic_linking",
]
# The static counterpart: Rust scripts compiled into the binary rather than
# loaded as dylibs. Set only by the lean exporter — see `static_scripts` in the
# root manifest. Forwarded, because the crate that consumes the generated table
# is `renzora_rust_script`.
static_scripts = ["renzora_rust_script/static_scripts"]
# Throwaway PROFILING build. The binary (`renzora_app`) enables `bevy/trace` +
# `bevy/trace_tracy` alongside this; that alone gives per-system + render-node CPU
# zones and the Tracy layer/frame-mark, but Bevy only emits GPU-pass zones when a
# `RenderDiagnosticsPlugin` is present to create the Tracy GPU context — so this
# feature is the switch that adds it in `add_default_rendering`. NOT in default:
# it's paired with an ABI-moving Bevy feature set (CLAUDE.md §3) and only ever
# built explicitly for profiling.
profiling = []
# The 3D rendering pipeline (bevy_pbr + renzora_shader). Off = a 2D-only export
# (sprites + UI; bevy_light/atmosphere survive — they don't depend on bevy_pbr).
# Forwards `renzora_engine/render_3d`; the root bevy `3d` meta-feature is dropped
# separately by the exporter's render_3d capability.
#
# Ember is forwarded to BOTH the rlib dep and the shared image, for the same
# reason `game_ui` is: forwarding to one only would leave cargo resolving two
# ember units with different feature sets, and the shared image would be built
# from the wrong one. `?/` because both are optional (they arrive with `ui`) —
# this feature must not drag the whole UI layer into a headless 3D build.
render_3d = [
    "renzora_engine/render_3d",
    "renzora/render_3d",
    "renzora_postprocess/render_3d",
    "renzora_ember?/render_3d",
    "renzora_ember_dylib?/render_3d",
    "dep:renzora_wind",
]
# The node-graph material system. Its own capability: ~1 MiB that a game using
# only StandardMaterial never touches. Auto-detected from `.material` assets.
shader_graph = ["dep:renzora_shader", "renzora_engine/shader_graph", "render_3d"]
# The 2D sprite scene systems (image binding, size persistence, sprite-sheet
# frame cropping). Off = a 3D-only export with no sprite game-code. Bevy's `2d`
# meta-feature is NOT strippable yet — the window-blit present path
# (viewport_stretch.rs in THIS crate) draws with a bevy `Sprite` in every
# export — so this only gates renzora_engine's sprite systems for now.
render_2d = ["renzora_engine/render_2d"]
# Bevy's LUT-based tone curves. Paired with the root `bevy/tonemapping_luts`
# feature by the exporter; `renzora_tonemapping` swaps in `AcesFitted` when this
# is off, because Bevy renders magenta rather than falling back.
tonemapping_luts = ["renzora_tonemapping/tonemapping_luts"]
# glTF model loading. Forwarded to `renzora_engine` (which owns the LOD probe and
# the mesh-instance rehydrate path) and paired with the root `bevy/bevy_gltf`
# feature by the exporter, so the loader and the code that drives it strip
# together. Auto-detected from `.gltf`/`.glb` files in the project.
gltf = ["renzora_engine/gltf", "render_3d"]
# avian physics. The shared half: the physics crate itself, plus every crate that
# touches avian — the engine scene-save denies, water buoyancy, and the navmesh
# collider-obstacle updater (the `?` enables those only when that subsystem is
# also kept). Not selectable on its own; `physics_3d` / `physics_2d` turn it on,
# so removing both from `default` strips physics entirely.
physics = [
    "dep:renzora_physics",
    "renzora_engine/physics",
    "renzora_water?/physics",
    "renzora_navmesh?/physics",
]
# One feature per avian crate, so a game ships only the dimension it uses. The
# two are separate crates with their own parry (parry3d ≈ 4.5 MiB, parry2d less),
# and no game needs both — a 3D title carries no 2D solver and vice versa. The
# editor keeps both, since a project can hold scenes of either kind.
physics_3d = ["physics", "renzora_physics/avian3d"]
physics_2d = ["physics", "renzora_physics/avian2d"]
# Scripting backends/capabilities, forwarded to `renzora_scripting` (which every
# lean-closure crate now deps `default-features = false`, so these are the sole
# switches). `lua` is NOT in `default` — it rides the binary's `runtime` feature
# so it survives `--no-default-features` (every game is at least Lua-scriptable);
# `rhai`/`blueprint`/`script_http` are in `default` so the lean export strips
# them unless a capability keeps them (Rhai-less desktop, no-blueprint, no-http).
script_http = ["scripting", "renzora_scripting?/script_http"]
# The scripting layer itself — the single switch for the whole engine. Every
# crate that declares script functions keeps its `ScriptExtension` out of
# `default` and is forwarded from here (the `?` means "only if that subsystem is
# also kept"), so scripting can never be half-present: either the host, the
# hooks and all the domain vocabularies are built, or none of them are. The
# interpreters are C-ABI plugins and are unaffected either way.
scripting = [
    "dep:renzora_scripting",
    "renzora_engine/scripting",
    "renzora_animation?/scripting",
    "renzora_physics?/scripting",
    "renzora_navmesh?/scripting",
    "renzora_ragdoll?/scripting",
    "renzora_parkour?/scripting",
    "renzora_lang?/scripting",
]
# Code gate for the runtime's `bevy::solari` GPU ray-tracing probe. Paired with
# the root `bevy/bevy_solari` feature by the exporter's Solari capability — both
# are stripped together, so this stays consistent with whether Solari is built.
solari = ["dep:renzora_solari"]
lumen = ["dep:renzora_lumen"]
cloth = ["dep:renzora_cloth"]
gaussian_splatting = ["dep:renzora_gaussian_splatting"]
ragdoll = ["dep:renzora_ragdoll"]
# Traversal character controller (vault/mantle/hang/ladder/wall-run/swing). It
# is a 3D feature and asks `renzora_physics` for the avian3d backend itself, so
# keeping it in a 2D-only export would drag avian3d back in — a 2D game drops
# this instead.
parkour = ["dep:renzora_parkour"]
light2d = ["dep:renzora_light2d"]
# Multiplayer: the UDP transport, replication and RPC, plus the dedicated/host
# server startup in `src/server.rs`. Forwards `renzora_engine/networking`, which
# is only there to keep replication bookkeeping out of saved scenes. A
# single-player game strips the lot, and `--server` on such a build boots as an
# ordinary client with a warning rather than silently pretending.
networking = ["dep:renzora_network", "renzora_engine/networking", "dep:toml"]
# Code that draws with a `Gizmos` param. Paired with the exporter's Debug-gizmos
# capability, which strips bevy's `bevy_gizmos` — every crate that draws one has
# to disappear at the same moment or the build fails on a missing type. `?/` so
# this never pulls an optional subsystem in on its own.
gizmos = ["renzora_light2d?/gizmos"]
forward_decal = ["dep:renzora_forward_decal"]
navmesh = ["dep:renzora_navmesh"]
particles = ["dep:renzora_hanabi"]
# 2D tilemap runtime (chunked quad-mesh renderer). Content is 2D, so a pure-3D
# game strips it; a 2D game keeps it. Editor always builds it.
tilemap = ["dep:renzora_tilemap"]
# 2D named-sprite animation (AnimatedSprite clips: idle/walk/run). Runtime
# playback + the sprite scripting API; content is 2D, so a pure-3D game strips
# it. Editor always builds it. Backends forwarded via `lua`/`rhai` above.
sprite_anim = ["dep:renzora_sprite_anim"]
# `renzora_navmesh?/terrain`: enable navmesh's terrain-obstacle support only when
# navmesh is ALSO kept (the `?` won't pull navmesh in just for terrain).
terrain = ["dep:renzora_terrain", "renzora_engine/terrain", "renzora_navmesh?/terrain"]
water = ["dep:renzora_water"]
audio = ["dep:renzora_audio", "renzora_engine/audio"]
animation = ["dep:renzora_animation", "renzora_engine/animation"]
blueprint = ["scripting", "dep:renzora_blueprint", "renzora_scripting?/blueprint"]
# Pulls `scripting`: ember's markup runtime binds `.html` fields to script
# values, so game UI without the scripting layer wouldn't compile. Pulls `ui` for
# the obvious reason — markup renders through bevy_ui.
#
# Forwarded to the shared image as well as the rlib. Both edges are needed: they
# are two dependency entries on the same crate, and enabling the feature on only
# one would leave cargo resolving ember with a union that does not match what the
# dylib was built from.
game_ui = ["ui", "scripting", "renzora_ember/game_ui", "renzora_ember_dylib?/game_ui"]
# The UI layer: `renzora_ember` (the widget/theme framework) and, through the
# exporter, bevy_ui + bevy_text + bevy_ui_render + bevy_ui_widgets. Dropping it
# takes the whole text-shaping stack (parley, swash, harfrust, fontique, skrifa,
# read-fonts) with it, since `bevy_text` is what pulls those and `bevy_ui`
# requires `bevy_text`. Only for a game that draws no UI and no text at all —
# `game_ui` turns it back on.
ui = ["dep:renzora_ember", "renzora_engine/ui"]
# Translation packs — see the dependency comment.
localization = ["dep:renzora_lang"]
# Post-process effects, one feature per crate. These were a single `postfx`
# bundle, which meant a game wanting only bloom still shipped SSR, DoF, OIT and
# eight others — an aggregate feature cannot be partially stripped, since
# whatever remains in `default` re-enables every member. The framework
# (`renzora_postprocess`) and tonemapping stay core.
bloom = ["dep:renzora_bloom_effect"]
ssao = ["dep:renzora_ssao"]
ssr = ["dep:renzora_ssr"]
dof = ["dep:renzora_dof"]
motion_blur = ["dep:renzora_motion_blur"]
distance_fog = ["dep:renzora_distance_fog"]
volumetric_fog = ["dep:renzora_volumetric_fog"]
lens_distortion = ["dep:renzora_lens_distortion"]
oit = ["dep:renzora_oit"]
antialiasing = ["dep:renzora_antialiasing", "renzora/antialiasing"]
# Sky / environment visuals, likewise one per crate rather than one `sky` bundle.
atmosphere = ["dep:renzora_atmosphere"]
environment_map = ["dep:renzora_environment_map"]
skybox = ["dep:renzora_skybox"]

[dependencies]
# Former dlopen'd distribution plugins, now statically linked.
#
# They shipped as cdylibs loaded from `plugins/` and sharing the host's
# `bevy_dylib`. With Bevy statically linked that is impossible: each would link
# its own copy of Bevy and therefore its own `World` type, so the loader could
# only reject them. Linking them in is the alternative that preserves the
# feature.
#
# Optional + in `default`, so behaviour is unchanged for a dev build while the
# lean exporter can still drop any of them per game (see
# `renzora_export::capabilities`) — which is what keeps a shipped title from
# carrying Lumen or gaussian splatting it never uses.
renzora_lumen = { path = "../renzora_lumen", optional = true }
renzora_cloth = { path = "../renzora_cloth", optional = true }
renzora_solari = { path = "../renzora_solari", optional = true }
renzora_gaussian_splatting = { path = "../renzora_gaussian_splatting", optional = true }
renzora_ragdoll = { path = "../renzora_ragdoll", optional = true }
renzora_parkour = { path = "../renzora_parkour", optional = true }
renzora_light2d = { path = "../renzora_light2d", optional = true }
renzora_forward_decal = { path = "../renzora_forward_decal", optional = true }
# Moved out of the generated block below and made strippable, per the procedure
# in `xtask/src/sync.rs`: wind sways meshes through a `StandardMaterial`
# extension, so it is bevy_pbr all the way down and cannot compile at all in a 2D
# export. Being optional under `render_3d` is also what makes the generator emit
# the matching `#[cfg(feature = "render_3d")]` in `plugins.rs`.
renzora_wind = { path = "../renzora_wind", optional = true }

bevy = { workspace = true }
# Used by the runtime startup system to set the primary window's icon from
# the rpak. Bevy 0.18 doesn't expose a public window-icon API, so we drop
# down to winit's `set_window_icon` via the `WinitWindows` resource.
# Version must match the one bevy_winit 0.18 depends on (0.30).
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Startup-only: probe the GPU adapter to decide whether to request Solari's
# ray-tracing wgpu features (see `raytracing_supported`). Must match bevy's wgpu
# (29.x) so the `Features` bitflags are the same type across the call. Backends
# come from bevy's own wgpu feature set via cargo feature unification, so we keep
# our dependency feature-light.
wgpu = { version = "29", default-features = false }

# Core
# `default-features = false` so the lean export can strip the optional subsystems
# `renzora_engine` would otherwise hard-pull (audio, animation) — the `audio` /
# `animation` features below forward to it. Normal builds keep them via `default`.
renzora_engine = { path = "../renzora_engine", default-features = false }
renzora = { path = "../renzora", default-features = false }
# The same contract crate again, as one shared dylib. Nothing calls into it —
# `renzora_dylib` re-exports `renzora` and is linked purely so the compiled code
# lives in ONE image. Without it every plugin embeds a private copy of the four
# process-global statics in the contract crate (the translation table, the
# Problems and Console buffers, the asset loader), and each one then fails
# silently: `t()` returns raw keys, logs and warnings land in buffers nobody
# drains, asset reads find no loader. See `crates/renzora_dylib/src/lib.rs`.
renzora_dylib = { path = "../renzora_dylib", optional = true }
# And ember as one shared dylib, for the same reason one layer up: a native
# plugin that registers a panel links ember, and ember's theme palette,
# stylesheet, UI font scale and viewport-toolbar lists are process-global
# statics. A privately linked copy leaves the plugin's panel painted in the
# default palette while the editor around it is on the user's theme, and its
# toolbar contributions pushed into a list nothing reads — silently, in both
# cases. See `crates/renzora_ember_dylib/src/lib.rs`.
renzora_ember_dylib = { path = "../renzora_ember_dylib", default-features = false, optional = true }
# `default-features = false`: the backends + blueprint + script_http are switched
# on via this crate's matching features (above), so the lean export can drop them.
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }
# Loads the embedded + external `languages/*.toml` packs into the shared
# translation table. Optional: the packs are `include_str!`'d, so this is ~2.4 MiB
# of TOML compiled into the binary, and `renzora::lang::t()` lives in the contract
# crate and falls back to the key's English text when no pack is loaded. A game
# shipping in one language pays for twenty otherwise.
renzora_lang = { path = "../renzora_lang", optional = true }
renzora_blueprint = { path = "../renzora_blueprint", optional = true }
renzora_input = { path = "../renzora_input" }
# OpenXR/VR boot mode — desktop only, behind the `xr` feature (see [features]).
renzora_xr = { path = "../renzora_xr", optional = true }
renzora_physics = { path = "../renzora_physics", optional = true }
renzora_terrain = { path = "../renzora_terrain", optional = true }
renzora_lighting = { path = "../renzora_lighting" }
renzora_water = { path = "../renzora_water", optional = true }
renzora_animation = { path = "../renzora_animation", optional = true }
# `default-features = false` so the lean export can strip ember's `game_ui`
# markup module (+ its `renzora_game_ui`/`bevy_hui` deps); the `game_ui` feature
# below forwards `renzora_ember/game_ui`. Normal builds keep it via `default`.
renzora_ember = { path = "../renzora_ember", default-features = false, optional = true }
renzora_hanabi = { path = "../renzora_hanabi", optional = true }
# Optional under `networking`. It was non-optional because the binary's
# `--server`/`--host` path reached it through `renzora_runtime::renzora_network`
# and there was nowhere to put the `#[cfg]`; `src/server.rs` is that somewhere
# now, so a single-player game no longer compiles the whole UDP stack.
renzora_network = { path = "../renzora_network", optional = true }
renzora_audio = { path = "../renzora_audio", optional = true }
# Optional under `render_3d`: the runtime only keepalive-links it so the shader
# plugin's inventory entry registers. A 2D export drops it with bevy_pbr.
renzora_shader = { path = "../renzora_shader", optional = true }
renzora_navmesh = { path = "../renzora_navmesh", optional = true }
renzora_tilemap = { path = "../renzora_tilemap", optional = true }
renzora_sprite_anim = { path = "../renzora_sprite_anim", optional = true }

# Postprocess framework + vital effects
renzora_postprocess = { path = "../renzora_postprocess" }
# `default-features = false` is load-bearing: this crate's `tonemapping_luts`
# feature FORWARDS to it, and `renzora_tonemapping`'s own `default` enables it.
# Without this, the dependency edge turned the feature back on even after the
# exporter stripped it from `default` here — so the LUT-substitution code was
# compiled out while bevy's tables were gone, which is exactly the magenta screen
# the substitution exists to prevent. The editor deps it WITH defaults, so it
# keeps the real LUT curves.
renzora_tonemapping = { path = "../renzora_tonemapping", default-features = false }
renzora_bloom_effect = { path = "../renzora_bloom_effect", optional = true }
renzora_antialiasing = { path = "../renzora_antialiasing", optional = true }
renzora_ssao = { path = "../renzora_ssao", optional = true }
renzora_ssr = { path = "../renzora_ssr", optional = true }
renzora_lens_distortion = { path = "../renzora_lens_distortion", optional = true }
renzora_oit = { path = "../renzora_oit", optional = true }
renzora_dof = { path = "../renzora_dof", optional = true }
renzora_motion_blur = { path = "../renzora_motion_blur", optional = true }
renzora_distance_fog = { path = "../renzora_distance_fog", optional = true }
renzora_volumetric_fog = { path = "../renzora_volumetric_fog", optional = true }

# Environment
renzora_atmosphere = { path = "../renzora_atmosphere", optional = true }
renzora_environment_map = { path = "../renzora_environment_map", optional = true }
renzora_skybox = { path = "../renzora_skybox", optional = true }

# ── generated by `cargo renzora sync` — declared plugin crates ──
# Discovered from their `renzora::add!` lines. Plain, non-optional
# entries: a new plugin is always compiled and always installed. To let
# the lean exporter strip one, move its line out of this block, mark it
# `optional = true`, and put it in a feature — the generator will leave
# it alone and read the gate back from there.
#
# Delete a plugin with `cargo renzora remove <crate>`, not by hand: an
# entry here pointing at a directory that no longer exists stops cargo
# loading the workspace, including to run the generator that would fix
# it. If you hit that, delete the offending line below.
renzora_native_plugin = { path = "../renzora_native_plugin" }
renzora_net = { path = "../renzora_net" }
renzora_rust_script = { path = "../renzora_rust_script" }
# ── end generated ──

# Loading the editor image beside the executable — see `src/editor_image.rs`.
# Target-scoped because wasm has no dynamic linking at all: there the editor is
# compiled into its own bundle and installed by a direct call, so pulling
# libloading in would be a dependency that cannot work on that target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
# `server.rs` reads `project.toml`'s `[network]` section. Optional under
# `networking`, which is also the only thing that compiles that module — a
# single-player export drops the parser with the stack it was parsing for.
toml = { version = "0.8", optional = true }

[lints]
workspace = true
