[package]
name = "renzora_asset_registry"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
renzora_splash = { path = "../renzora_splash" }

[dev-dependencies]
# The walk is filesystem behaviour — skipping `.git`/`target`, normalizing
# separators, reading mtime — so the tests build real directory trees rather
# than mocking `read_dir`.
tempfile = "3"

[lints]
workspace = true

# The index is built from webfs's cached listings on the web — `std::fs` there
# fails, which showed up as "indexed 0 assets".
[target.'cfg(target_arch = "wasm32")'.dependencies]
renzora_webfs = { path = "../renzora_webfs" }
