[package]
name = "renzora_scripting_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_scripting: the ScriptComponent inspector entry (renzora editor contract + Phosphor icon). The native drawer lives in renzora_inspector. Declared as an Editor-scope plugin in this manifest and linked only by the editor bundle."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
bevy = { workspace = true }
renzora_platform_api = { path = "../../api/renzora_platform_api" }
renzora_scripting = { path = ".." }
# The Rust install prompt is a `confirm_dialog`.
renzora_ember = { path = "../../renzora_ember" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "ScriptingEditorPlugin"
scope = "Editor"
