[package]
name = "renzora_scripting"
version = "0.1.0"
edition = "2021"

[features]
# Both ON by default so the editor/dev build is unchanged. The lean exporter
# strips what a game doesn't use, by depending on this crate with
# `default-features = false` (every lean-closure dependent does) and forwarding
# the kept ones from `renzora_runtime`. `blueprint` pulls the visual-scripting
# compiler (~0.2 MiB); `script_http` pulls `renzora_net` — no longer the TLS
# stack (~1 MiB) for the `http_get`/`http_post` script verbs.
#
# There is no `lua` feature any more: the interpreter is `plugins/lua`, so which
# language a game can be scripted in is decided by which plugin is present, not
# by how the engine was compiled.
default = ["blueprint", "script_http"]
blueprint = ["dep:renzora_blueprint"]
script_http = ["dep:renzora_net"]

# No `editor` feature: lean runtime crate. The ScriptComponent inspector entry
# moved to the nested renzora_scripting_editor crate (crates/renzora_scripting/editor).

[dependencies]
# Engine side of the C ABI's HTTP surface (`plugin_bridge`). The client already
# lives here, so a plugin request takes the same path a script's does.
renzora_plugin = { path = "../renzora_plugin", features = ["host", "http", "script"] }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
# Visual-scripting compiler. Used by `plugin_backend` to turn a `.blueprint`/
# `.bp` graph into Lua before the source reaches the language plugin — it links
# Bevy, so it cannot cross the boundary itself. Optional: stripped for games
# that ship no blueprints.
renzora_blueprint = { path = "../renzora_blueprint", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# `renzora_net` powers `http_get`/`http_post` from scripts (a blocking call on a
# background thread; native only — a wasm fetch path can come later). Optional
# (`script_http`): a game with no script HTTP drops the whole TLS stack.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
renzora_net = { path = "../renzora_net", optional = true }

[lints]
workspace = true
