[package]
name = "renzora_scripting"
version = "0.1.0"
edition = "2021"

[features]
# ON by default so the editor/dev build is unchanged. The lean exporter
# strips what a game doesn't use, by depending on this crate with
# `default-features = false` (every lean-closure dependent does) and forwarding
# the kept ones from `renzora_runtime`. `script_http` pulls `renzora_net_api` (the request
# vocabulary, not a client) for the `http_get`/`http_post` script verbs.
#
# There is no `lua` feature any more: the interpreter is `plugins/lua`, so which
# language a game can be scripted in is decided by which plugin is present, not
# by how the engine was compiled.
default = ["script_http"]
script_http = ["dep:renzora_net_api"]

# No `editor` feature: lean runtime crate. The ScriptComponent inspector entry
# moved to the nested renzora_scripting_editor crate (crates/renzora_scripting/editor).

[dependencies]
renzora_shell_api = { path = "../api/renzora_shell_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_log_api = { path = "../api/renzora_log_api" }
bevy = { workspace = true }
renzora = { path = "../shared/renzora", default-features = false }
# `diagnostics` for the script perf tables, which live in the contract so the
# debug panels reading them can be a native plugin. This crate populates them;
# enabling the feature here is what keeps them out of a build that does not
# carry this crate at all.
renzora_diagnostics_api = { path = "../api/renzora_diagnostics_api", features = ["diagnostics"] }
# The vocabulary this crate's scripting system speaks and re-exports.
renzora_scripting_api = { path = "../api/renzora_scripting_api" }
renzora_physics_api = { path = "../api/renzora_physics_api" }
# The transform writes scripts queue, which animation drains too.
renzora_animation_api = { path = "../api/renzora_animation_api" }
# The plugin bus, which `bus_bridge` joins to script events.
renzora_bus_api = { path = "../api/renzora_bus_api" }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# `renzora_net_api` describes the requests `http_get`/`http_post` make from
# scripts (a blocking call on a background thread; native only, a wasm fetch
# path can come later). The vocabulary crate, not `renzora_net`: that one is
# the frame pump, which the runtime adds, and linking it here put every crate
# above scripting under it. Optional (`script_http`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
renzora_net_api = { path = "../api/renzora_net_api", optional = true }

[lints]
workspace = true
