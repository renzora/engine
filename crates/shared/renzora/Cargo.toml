[package]
name = "renzora"
version = "0.1.0"
edition = "2021"
description = "Renzora — types, events, and contracts shared across the engine."

# rlib. The one compiled copy every consumer shares is `renzora_dylib`, which
# depends on this crate for that side effect alone; a dylib here as well would
# be a second image with a second set of the process-global statics.
[lib]
crate-type = ["rlib"]

[features]
default = []
# The subject features this crate used to carry (`text_mesh`, `audio`,
# `diagnostics`, `static_scripts`, `grid`, `postprocess`, `render_3d`,
# `antialiasing`, `static_plugins`) moved with their subjects into the crates of
# the contract hierarchy; `renzora_sdk` still offers each name to plugins.
# Re-exports the editor CONTRACT (`renzora_editor_api`): `EditorSelection`,
# the inspector/spawn/toolbar/shortcut registries, `AppEditorExt`, the field
# macros and the `Inspectable` derive, at the root paths plugins use. Runtime /
# server / mobile builds leave this OFF so they carry no editor surface area.
editor = ["dep:renzora_editor_api"]
[dependencies]
# `renzora` is the king of the engine — every other crate depends on it,
# nothing depends back. The dep list stays at bevy + serialization only so
# adding a new feature crate can never introduce a cycle, and bumping any
# feature crate never forces a renzora rebuild (which would restamp every
# installed plugin and rebuild the lot).
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
# The console, re-exported as `renzora::console_log`. A contract layer below
# this crate, so depending on it here is no cycle.
renzora_log_api = { path = "../../api/renzora_log_api" }
renzora_lang_api = { path = "../../api/renzora_lang_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
renzora_scene_api = { path = "../../api/renzora_scene_api" }
renzora_viewport_api = { path = "../../api/renzora_viewport_api" }
renzora_crash_api = { path = "../../api/renzora_crash_api" }
renzora_shell_api = { path = "../../api/renzora_shell_api" }
# `Request::json` / `Response::json`. Came across with `net`; every caller was
# already hand-rolling the same encode/decode a line later.
serde_json = "1"
toml = "0.8"
# NOT a real dependency — a transitive-feature fix. naga is already pulled in by
# `bevy_render` → `wgpu` → `naga 29`. On Bevy 0.19, wgpu-core does NOT enable
# naga's own `termcolor` feature, but `codespan-reporting` ends up with ITS
# `termcolor` feature on (its default). naga's error code then takes the
# `not(termcolor)` branch (a `String` diagnostic buffer) and hands it to
# codespan's `term::emit`, which — with codespan/termcolor ON — demands
# `&mut dyn WriteColor`; `String` isn't `WriteColor`, so naga fails to compile.
# Forcing naga's `termcolor` feature here (via cargo feature unification, since
# `renzora` is the universal dependency) aligns the two: naga then uses
# `NoColor<Vec<u8>>`, which IS `WriteColor`. No cycle risk — naga is a leaf
# render dep, not a `renzora_*` crate. Remove if a future wgpu enables it.
# Kept here as a pure pin even though `wgsl.rs` (the real user) moved to
# `renzora_material_api`: this crate is in every build, that one is not.
naga = { version = "30", features = ["termcolor"] }
# NOT real dependencies either: feature pins, like `naga` above. Avian
# (`renzora_avian_physics`) needs `approx` on these two Bevy math crates, and
# nothing else in the engine asks for it. Left to avian, the physics crate
# decides how Bevy itself is compiled: leaving it out of a build
# flips the feature off, every Bevy crate above them gets a new build hash, and
# the next build recompiles about 1150 crates (and restamps every installed
# plugin) for the sake of one crate. Pinned here, Bevy
# compiles the same with or without it.
bevy_curve = { path = "../../../bevy/crates/bevy_curve", default-features = false, features = ["approx"] }
bevy_shape = { path = "../../../bevy/crates/bevy_shape", default-features = false, features = ["approx"] }
# The companion's vocabulary: job arguments and the project file rules,
# re-exported as `job_args` and from `project_files`. Its own crate so the
# standalone companion can link it without Bevy. A leaf on serde alone, so it
# cannot introduce a cycle.
renzora_companion_proto = { path = "../../renzora_companion_proto" }
# The editor contract, re-exported under the `editor` feature.
renzora_editor_api = { path = "../../api/renzora_editor_api", optional = true }

[lints]
workspace = true

# The browser's wall clock. std's `SystemTime::now` panics on wasm, and a fresh
# `SceneEntityId` needs something that differs between sessions: the hasher
# seed std mixes in is a constant there. Already in every web build through
# `bevy_platform`, so this adds no crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1.1", default-features = false }