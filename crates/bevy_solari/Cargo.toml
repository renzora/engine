# Vendored bevy_solari 0.20.0, the crates.io release, swapped in for Bevy's own
# copy by the root manifest's `[patch.crates-io]`. The version must stay the one
# `bevy_internal` asks for, or the patch silently stops applying.
#
# Every change from upstream is marked `RENZORA PATCH` in the source. Re-apply
# them on a re-vendor (a Bevy upgrade):
#
#   * src/scene/bindings.wesl + src/realtime/gbuffer_utils.wesl: perceptual
#     roughness floored at 0.089, as bevy_pbr floors it for raster. At 0,
#     mirror-smooth pixels rendered black. The floor is above the delta-mirror
#     threshold, so mirrors are shaded as a sharp GGX lobe, as raster does.
#   * src/realtime/restir.wesl + src/realtime/no_restir.wesl: a visible
#     emissive surface is added after exposure, matching bevy_pbr's default, so
#     emissive looks (and blooms) the same with Solari on as off.
#   * src/realtime/gbuffer_utils.wesl: `gpixel_resolve` lifts a G-buffer
#     surface two pixel footprints along its normal, so rays from a virtual
#     geometry surface (drawn up to a pixel off the traced full detail) do not
#     start underneath the traced surface and shadow themselves black.
#   * A built-in denoiser (`SolariLighting::denoise`): new files
#     realtime/denoise.wesl, denoise_utils.wesl, denoise_input.wesl and
#     denoise.rs; the lighting split it reads (initial_path.wesl,
#     restir.wesl, no_restir.wesl, scene/brdf.wesl `specular_brdf_share`);
#     its textures (prepare.rs), bindings (bindings.wesl, node.rs) and
#     dispatch (node.rs). Compiled offline by renzora_solari/tests/shaders.rs;
#     its quality measured on a GPU by renzora_solari/tests/denoise_quality.rs.
#   * Diagnostics (`SolariDebug`): new files realtime/debug.wesl,
#     debug_layout.wesl and debug.rs; a per-thread ray count in
#     scene/bindings.wesl `trace_ray` and scene/sampling.wesl
#     `trace_visibility`, flushed at the end of each tracing pass (restir.wesl,
#     no_restir.wesl, world_cache_update.wesl); the counter buffer and
#     `debug_flags` (bindings.wesl, prepare.rs), and the dispatch (node.rs,
#     extract.rs, mod.rs). Measured on a GPU by renzora_solari's GPU tests.
#   * src/realtime/prepare.rs `sync_dlss_rr_textures`: DLSS Ray
#     Reconstruction's guide textures follow DLSS on and off every frame.
#     Upstream left them on the view after DLSS was switched off at the same
#     size, which read as "DLSS is denoising" and put the raw image on screen.
#   * See-through surfaces (glass, a clear-coat shell): per-instance ray masks
#     (scene/binder/instances.rs `masks`, setup_tlas_instances.wesl, tlas.rs,
#     mod.rs), with every existing ray tracing the opaque mask only
#     (bindings.wesl `trace_ray_masked`); a blended material's alpha and blend
#     mode and clear coat in `GpuMaterial` (scene/binder/assets.rs,
#     bindings.wesl); and a pass
#     that lights the nearest see-through surface after the denoiser, new file
#     realtime/transparent.wesl (node.rs, mod.rs). Checked on a GPU by
#     renzora_solari's `glass_reflects_the_scene`.
#
# The manifest below is the normalized one cargo publishes; its dependencies are
# exact crates.io versions, so it builds as-is.

[package]
edition = "2024"
name = "bevy_solari"
version = "0.20.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides raytraced lighting for Bevy Engine"
homepage = "https://bevy.org"
readme = "README.md"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/bevy"

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies.bevy_render]
path = "../bevy_render"

[package.metadata.wgsl-analyzer.dependencies.bevy_pbr]
path = "../bevy_pbr"

[package.metadata.wgsl-analyzer.dependencies.bevy_core_pipeline]
path = "../bevy_core_pipeline"

[package.metadata.wgsl-analyzer.dependencies.constants]
path = "../../constants"

[features]
dlss = ["bevy_anti_alias/dlss"]
force_disable_dlss = ["bevy_anti_alias/force_disable_dlss"]

[lib]
name = "bevy_solari"
path = "src/lib.rs"

[dependencies.bevy_anti_alias]
version = "0.20.0"

[dependencies.bevy_app]
version = "0.20.0"

[dependencies.bevy_asset]
version = "0.20.0"

[dependencies.bevy_camera]
version = "0.20.0"

[dependencies.bevy_color]
version = "0.20.0"

[dependencies.bevy_core_pipeline]
version = "0.20.0"

[dependencies.bevy_derive]
version = "0.20.0"

[dependencies.bevy_diagnostic]
version = "0.20.0"

[dependencies.bevy_ecs]
version = "0.20.0"

[dependencies.bevy_image]
version = "0.20.0"

[dependencies.bevy_light]
version = "0.20.0"

[dependencies.bevy_material]
# RENZORA PATCH: `AlphaMode`, for the see-through pass's materials.
version = "0.20.0"

[dependencies.bevy_math]
version = "0.20.0"

[dependencies.bevy_mesh]
version = "0.20.0"

[dependencies.bevy_pbr]
version = "0.20.0"
features = ["dfg_lut"]

[dependencies.bevy_platform]
version = "0.20.0"
features = ["std"]
default-features = false

[dependencies.bevy_reflect]
version = "0.20.0"

[dependencies.bevy_render]
version = "0.20.0"

[dependencies.bevy_shader]
version = "0.20.0"

[dependencies.bevy_transform]
version = "0.20.0"

[dependencies.bevy_utils]
version = "0.20.0"

[dependencies.bytemuck]
version = "1"

[dependencies.derive_more]
version = "2"
features = ["from"]
default-features = false

[dependencies.tracing]
version = "0.1"
features = ["std"]
default-features = false

[dependencies.wgpu]
version = "30"
default-features = false

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(docsrs_dep)"]
