[package]
name = "renzora_terrain"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_log_api = { path = "../api/renzora_log_api" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
# A chunk's heights are saved as a deflated 16-bit heightmap in base64
# (`data::packed_heights`): text floats made a 2 km terrain 180 MB.
base64 = "0.22"
flate2 = "1"
# `render_3d`: the ray tracer's stand-in material contract (`TracedStandIn`),
# which is how terrain reaches Solari (see `surface`).
renzora_render_api = { path = "../api/renzora_render_api", features = ["render_3d"] }
renzora_material_api = { path = "../api/renzora_material_api" }
renzora_shader_api = { path = "../api/renzora_shader_api" }
renzora_platform_api = { path = "../api/renzora_platform_api" }
renzora_physics_api = { path = "../api/renzora_physics_api" }
renzora_world_api = { path = "../api/renzora_world_api" }
# `default-features = false`: terrain only tags chunks with the avian-free
# collider DATA types (`PhysicsBodyData`/`CollisionShapeData`) — it never needs
# a physics engine. Whichever physics plugin is installed simulates it; a
# no-physics export keeps the data and simulates nothing.
renzora_physics = { path = "../renzora_physics", default-features = false }
# Grass blades are uploaded straight into an instance-stepped vertex buffer, so
# `GrassInstance` has to be `Pod` for `RawBufferVec` to accept it.
bytemuck = { version = "1", features = ["derive"] }
# The cluster file type a chunk drawn as virtual geometry reads (`clusters`).
# Format and loader only: the builder is the `bake` feature, which only the
# editor turns on, so a game compiles no meshoptimizer.
renzora_rvg = { path = "../renzora_rvg" }
# A terrain is textured by a node-graph material (`landscape`): it builds its
# own instance of the shared `GraphMaterial` and reads the material's layer
# names off the graph. No cycle: the material crate knows nothing of terrain.
renzora_shader = { path = "../renzora_shader" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "TerrainPlugin"
[[package.metadata.renzora.plugin]]
type = "foliage::FoliagePlugin"
