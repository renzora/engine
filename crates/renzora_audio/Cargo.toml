[package]
name = "renzora_audio"
version = "0.1.0"
edition = "2021"

[features]
# A PCM decoder, for drawing a waveform rather than playing one. OFF by default:
# playback decoding lives in the audio backend plugin, and a shipped game should
# carry no decoders at all. Only the editor-side crates that draw pictures of
# audio files (`renzora_hub`) turn it on, and it is stripped from exports.
decode = ["dep:symphonia"]

[dependencies]
renzora_crash_api = { path = "../api/renzora_crash_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
# `AudioLink` and the handle types: this crate drives the boundary but does not
# define it, so a plugin can play a sound without linking here.
renzora_audio_api = { path = "../api/renzora_audio_api" }
renzora_scripting_api = { path = "../api/renzora_scripting_api" }
serde = { version = "1", features = ["derive"] }
# The audio boundary. `host` for the resource the plugin loader fills in when a
# backend registers; `audio` for the request/reply vocabulary both sides compile.
cfg-if = "1"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "mp3", "flac"], optional = true }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "AudioPlugin"
