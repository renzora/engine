[package]
name = "renzora_import_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_shell_api = { path = "../api/renzora_shell_api" }
renzora_platform_api = { path = "../api/renzora_platform_api" }
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
# Reading back a model the companion converted.
serde_json = "1"
renzora_ember = { path = "../renzora_ember" }
renzora_import = { path = "../renzora_import" }
renzora_editor_framework = { path = "../renzora_editor_framework" }
# For the preview's ground grid only. The plugin itself is added once by
# `renzora_grid::GridPlugin`; this crate just spawns an entity on its own layer,
# the way the marketplace model viewer does.
renzora_grid = { path = "../renzora_grid" }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "ImportPlugin"
scope = "Editor"
