[package]
name = "renzora_postprocess"
version = "0.1.0"
edition = "2021"
description = "Post-process effects written as shader files: a .wesl declares its own sliders, and a PostEffects component runs an ordered list of them on a camera."

# The render phases every pass slots into (`RenderComposition`) are the
# framework in `renzora::postprocess`, in the contract crate so a plugin can add
# its own pass. This crate is the effects that run in one of them.
#
# Depending on this crate is also what switches that framework on: hosts list
# it partly for the `renzora/postprocess` feature below.
[lib]
crate-type = ["rlib"]

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["postprocess"] }
# Reads an effect's settings struct (field types and byte offsets) and checks its
# bindings before wgpu sees them. The version wgpu itself uses, so the layout it
# reports is the one the GPU gets.
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
renzora_test_harness = { path = "../renzora_test_harness" }

[lints]
workspace = true
