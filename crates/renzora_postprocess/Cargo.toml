[package]
name = "renzora_postprocess"
version = "0.1.0"
edition = "2021"

# Thin re-export shim. The framework itself now lives in `renzora`
# (module `renzora::postprocess`, behind its `postprocess` feature) so it
# ships inside `renzora.dll` rather than a separate dylib. This crate is a
# zero-symbol `rlib` that just re-exports that module, keeping every existing
# `renzora_postprocess::…` path (effect plugins + the `post_process` macro)
# compiling unchanged. Because the real types belong to `renzora`, all
# plugins still share one `PostProcessRegistry` / one `TypeId` via `renzora.dll`.
[lib]
crate-type = ["rlib"]

[features]
# The plugin custom-material pipeline (`plugin_material`), which implements
# bevy's `Material` trait and so needs `bevy_pbr`. Off for a 2D-only export;
# `add_plugin_material` becomes a no-op. Forwarded from `renzora_runtime`.
render_3d = []

[dependencies]
renzora = { path = "../renzora", default-features = false, features = ["postprocess"] }
bevy = { workspace = true }
# The render half of the C-ABI plugin system lives here, not in renzora_plugin:
# that crate must stay publishable, and a published crate cannot have path deps.
renzora_plugin = { path = "../renzora_plugin", features = ["host"] }
# Used ONLY to validate a plugin's shader before handing it to wgpu. Without
# this, a layout mismatch in third-party WGSL is an unrecoverable GPU panic
# rather than an error message.
naga = { version = "27", features = ["wgsl-in"] }

[lints]
workspace = true
