[package]
name = "renzora_profiler"
version = "0.1.0"
edition = "2021"
description = "Turns the recorder's span events into per-frame profiles (spans per thread, GPU pass times, counters) for the companion's profiler. In every build; does nothing until recording is switched on."

[dependencies]
# `debug` keeps system names: without it Bevy 0.20 calls every system
# "<Enable the debug feature to see the name>", and a profile of those is
# useless. `renzora_runtime` asks for it too (for the schedule shuffle), so this
# changes nothing in the engine; it keeps the names when the profiler is built
# on its own, in its tests or a lean export.
bevy = { workspace = true, features = ["debug"] }
renzora = { path = "../renzora", default-features = false }
# Probe reports travel as JSON (see `wire::GamePacket::ProbeReport`).
serde_json = "1"

[lints]
workspace = true
