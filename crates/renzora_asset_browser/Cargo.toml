[package]
name = "renzora_asset_browser"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_ember = { path = "../renzora_ember" }
renzora_editor_framework = { path = "../renzora_editor_framework" }
# For `starter_rust`: the crate that runs scripts owns what a new one looks
# like, so this and the Hierarchy's Create menu write the same file.
renzora_scripting = { path = "../renzora_scripting" }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# `image` powers the persistent thumbnail downscale + PNG encode below.
# `bmp` and `tga` cover the source formats `ThumbnailCache` accepts that
# aren't handled by the default `image` set; HDR is read via Bevy's
# loader so it's already in-memory by the time we cache it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }

[lints]
workspace = true

# The web's `std::fs::read_dir`: listings come out of the picked directory
# handle instead. See `read_entries` in native.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
renzora_webfs = { path = "../renzora_webfs" }
