[package]
name = "renzora_asset_browser"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_shell_api = { path = "../api/renzora_shell_api" }
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_lang_api = { path = "../api/renzora_lang_api" }
renzora_log_api = { path = "../api/renzora_log_api" }
renzora_ember = { path = "../renzora_ember" }
renzora_editor_framework = { path = "../renzora_editor_framework" }
# For `starter_rust`: the crate that runs scripts owns what a new one looks
# like, so this and the Hierarchy's Create menu write the same file.
renzora_scripting = { path = "../renzora_scripting" }
bevy = { workspace = true }
# The create-file menu and the right-click asset actions plugins register.
renzora_platform_api = { path = "../api/renzora_platform_api" }
# `image` powers the persistent thumbnail downscale + PNG encode below.
# `bmp` and `tga` cover the source formats `ThumbnailCache` accepts that
# aren't handled by the default `image` set; HDR is read via Bevy's
# loader so it's already in-memory by the time we cache it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }
# `.rmip` thumbnails: reads only a texture's small mip levels for its tile.
renzora_rmip = { path = "../renzora_rmip" }

[lints]
workspace = true

# The web's `std::fs::read_dir`: listings come out of the picked directory
# handle instead. See `read_entries` in native.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
renzora_webfs = { path = "../renzora_webfs" }

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "AssetBrowserPlugin"
scope = "Editor"
