[package]
name = "renzora_shader_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_lang_api = { path = "../api/renzora_lang_api" }
bevy = { workspace = true }
renzora_shader = { path = "../renzora_shader" }
# bevy_ui-native panel content (the egui → bevy_ui migration).
renzora_ember = { path = "../renzora_ember" }
# WGSL hot-reload (`hot_reload.rs`). Declared here rather than on
# `renzora_shader` behind a feature: cargo unifies features across a
# `cargo build --workspace`, which is how the editor lane builds, so a feature
# there would pull these into the runtime binary too.
crossbeam-channel = "0.5"
notify-debouncer-full = "0.7"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "ShaderEditorPlugin"
scope = "Editor"
