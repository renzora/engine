[package]
name = "renzora_tilemap_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_tilemap: the Tilemap palette panel (click-on-atlas tile picker), the paint/erase tool, tileset drag-drop, and the Tilemap entity preset. Declared as an Editor-scope plugin in this manifest and linked only by the editor bundle."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
renzora_shell_api = { path = "../../api/renzora_shell_api" }
renzora_viewport_api = { path = "../../api/renzora_viewport_api" }
renzora_scene_api = { path = "../../api/renzora_scene_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
bevy = { workspace = true }
renzora_tilemap = { path = ".." }
# Data types only (no avian): stamping an object inserts the palette-authored
# CollisionShapeData on the spawned entity.
renzora_physics = { path = "../../renzora_physics", default-features = false }
renzora_undo = { path = "../../renzora_undo" }
renzora_ember = { path = "../../renzora_ember" }
renzora_ui = { path = "../../renzora_ui" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "TilemapEditorPlugin"
scope = "Editor"
