[package]
name = "renzora_tilemap"
version = "0.1.0"
edition = "2021"
description = "2D tilemap runtime: a chunked quad-mesh renderer driven by a reflectable TilemapLayer component."

[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora = { path = "../renzora", default-features = false }
# Data types only (this crate names no physics engine): the collider builder
# tags merged tile rectangles with CollisionShapeData/Physics2d and whichever 2D
# backend is selected turns them into real colliders, the same pattern
# renzora_terrain uses for chunk colliders.
renzora_physics = { path = "../renzora_physics", default-features = false }

[dev-dependencies]
renzora_test_harness = { path = "../renzora_test_harness" }

[lints]
workspace = true
