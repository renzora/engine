[package]
name = "renzora_wind_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only inspector sections for renzora_wind: the Wind section of WorldEnvironment, plus the per-mesh Wind Sway component. Registered via renzora::add!(.., Editor) and linked only by the editor bundle."

[dependencies]
bevy = { workspace = true }
renzora = { path = "../../renzora", default-features = false, features = ["editor"] }
renzora_wind = { path = ".." }

[lints]
workspace = true
