[package]
name = "renzora_forward_decal"
version = "0.1.0"
edition = "2021"
description = "Forward decals — the runtime half. The inspector lives in the nested `editor/` subcrate (renzora_forward_decal_editor), linked only by the editor binary, so a shipped game carries no editor code."

[lib]
crate-type = ["rlib"]

# No `editor` feature. It had one, gating the inspector — but the dependency it
# gated was NOT optional, so `renzora_editor_framework` (and through it
# renzora_ui and renzora_theme) compiled into every game export regardless. A
# feature could not have fixed that on its own either: cargo unifies features
# across a `--workspace` build, so the editor binary asking for it would switch
# it on for the runtime binary too. Splitting the crate is what actually
# separates them.
[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora = { path = "../renzora", default-features = false }

[lints]
workspace = true
