[package]
name = "renzora_forward_decal_editor"
version = "0.1.0"
edition = "2021"
description = "Editor companion to renzora_forward_decal: the Forward Decal inspector entry. Editor scope, so it links only into the editor binary."

[dependencies]
bevy = { workspace = true }
renzora_editor_framework = { path = "../../renzora_editor_framework" }
renzora_forward_decal = { path = ".." }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "DecalEditorPlugin"
scope = "Editor"
