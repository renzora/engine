[package]
name = "renzora_inspector"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_theme = { path = "../renzora_theme" }
renzora_ember = { path = "../renzora_ember" }
renzora_scripting = { path = "../renzora_scripting", default-features = false }
renzora_ui = { path = "../renzora_ui" }
renzora_editor_framework = { path = "../renzora_editor_framework" }
renzora_undo = { path = "../renzora_undo" }
renzora_camera = { path = "../renzora_camera" }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor"] }

# Plugin components have no Rust type and no `TypeRegistration`, so the
# reflection-driven inspector cannot see them. Their schemas come from the plugin
# host instead. Dependency points this way on purpose — `renzora_plugin` must
# stay publishable, so it never depends on engine crates.
renzora_plugin = { path = "../renzora_plugin", features = ["host"] }
# Plugin panels are described in BSN and spawned by the same parser scenes use.
renzora_bsn = { path = "../renzora_bsn" }

[lints]
workspace = true
