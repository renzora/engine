[package]
name = "renzora_sprite_anim_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_sprite_anim: the Sprite Anim panel — a frame picker that bridges into the property timeline. Drop sheets onto a 2D sprite, pick cells, and Create Clip writes an .anim (SpriteSheet.frame + SpriteImages.active tracks) onto the entity's AnimatorComponent, so the clip is a first-class timeline clip. Declared as an Editor-scope plugin in this manifest."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
renzora_shell_api = { path = "../../api/renzora_shell_api" }
renzora_scene_api = { path = "../../api/renzora_scene_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
bevy = { workspace = true }
renzora_animation_api = { path = "../../api/renzora_animation_api" }
renzora_animation = { path = "../../renzora_animation", default-features = false }
renzora_animation_editor = { path = "../../renzora_animation_editor" }
renzora_ember = { path = "../../renzora_ember" }
renzora_ui = { path = "../../renzora_ui" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "SpriteAnimEditorPlugin"
scope = "Editor"
