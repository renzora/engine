[package]
name = "renzora_sprite_anim"
version = "0.1.0"
edition = "2021"
description = "2D sprite animation runtime: binds Sprite.image from the multi-sheet SpriteImages component (the keyframeable sheet-switch). Clip playback is the ordinary renzora_animation property path."

[dependencies]
renzora_scene_api = { path = "../api/renzora_scene_api" }
bevy = { workspace = true }
renzora_animation_api = { path = "../api/renzora_animation_api" }

[dev-dependencies]
renzora_test_harness = { path = "../renzora_test_harness" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "SpriteImagesPlugin"
