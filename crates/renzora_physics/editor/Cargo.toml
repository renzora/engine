[package]
name = "renzora_physics_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only half of renzora_physics: the Physics Body + Collision Shape inspector entries, their native (ember) drawers (body type/mass/damping/locks, shape params, Edit-collider toggle, Stamp/Strip mesh-collider actions), the Edit-Collider tool, entity presets, the collider stamp queue + drain system, and the auto-collider-on-spawn observer. Declared as an Editor-scope plugin in this manifest and linked only by the editor bundle."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
renzora_scene_api = { path = "../../api/renzora_scene_api" }
renzora_log_api = { path = "../../api/renzora_log_api" }
bevy = { workspace = true }
renzora_physics_api = { path = "../../api/renzora_physics_api" }
renzora_physics = { path = ".." }
renzora_ember = { path = "../../renzora_ember" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "PhysicsEditorPlugin"
scope = "Editor"
