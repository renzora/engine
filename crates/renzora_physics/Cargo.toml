[package]
name = "renzora_physics"
version = "0.1.0"
edition = "2021"

[features]
# No default backend. Both are named after the crate they pull, and the caller
# picks — `renzora_runtime` maps them to `physics_3d` / `physics_2d` so the lean
# exporter can drop either. A 3D-only game carries no parry2d, and vice versa.
default = []
# The script functions this crate declares (its `ScriptExtension`). Purely
# declarative — no interpreter is linked either way — but the declaration itself
# needs the scripting crate, so a game exported without scripting drops it.
# Deliberately NOT in `default`: `renzora_runtime` owns the switch and forwards
# it, so the whole engine agrees on one answer.
scripting = ["dep:renzora_scripting"]
# Forwarded rather than owned. The backends live in `renzora::physics` now, so
# picking a dimension here has to reach through: a `dep:avian3d` on this crate
# would compile a SECOND avian and leave the engine with two `Collider` types.
avian3d = ["renzora/avian3d"]
avian2d = ["renzora/avian2d"]

[dependencies]
# Engine side of the C ABI's physics surface (`plugin_bridge`). `physics` is the
# Bevy-free vocabulary the same definitions compile into every plugin from.
renzora_plugin = { path = "../renzora_plugin", features = ["host", "physics"] }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
# The whole subsystem lives here now: the authored data, the read-state mirrors,
# the spatial bridge, both avian backends and `PhysicsPlugin` itself. This crate
# keeps only the `ScriptExtension` that cannot move (it is defined over
# `renzora_scripting`, which depends on `renzora`, so moving it would close a
# cycle) and re-exports everything else from its old path.
renzora = { path = "../renzora", default-features = false, features = ["physics"] }
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }

# No `avian3d` / `avian2d` entries. They moved to `renzora` with the backends,
# and a second declaration here would compile a second avian: two `Collider`
# types, two `RigidBody`s, and a solver reading components nothing else writes.
# The `avian3d` / `avian2d` features above forward to `renzora`'s instead.

# Tests only: system/param names in ECS validation errors, so a failing
# headless physics test says WHICH resource is missing.
[dev-dependencies]
bevy = { workspace = true, features = ["debug"] }

[lints]
workspace = true
