[package]
name = "renzora_cloth"
version = "0.1.0"
edition = "2021"
description = "Cloth physics (verlet). Wraps the vendored bevy_silk engine."

# In-workspace plugin: an `rlib` whose plugin is declared in this manifest, which the build
# generator wires into the committed plugin list and the linker pulls straight
# into the binary.
[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
# The vendored verlet cloth engine this plugin exposes to the runtime.
bevy_silk = { path = "../../vendor/bevy_silk" }
renzora_world_api = { path = "../api/renzora_world_api" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "ClothPlugin"
