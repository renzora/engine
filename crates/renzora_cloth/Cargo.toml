[package]
name = "renzora_cloth"
version = "0.1.0"
edition = "2021"
description = "Cloth physics (verlet). Wraps the vendored bevy_silk engine."

# In-workspace plugin: an `rlib` declared with `renzora::add!`, which the build
# generator wires into the committed plugin list and the linker pulls straight
# into the binary.
[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]
bevy = { workspace = true }
# The vendored verlet cloth engine this plugin exposes to the runtime.
bevy_silk = { path = "../bevy_silk" }
renzora = { path = "../renzora", default-features = false }

[lints]
workspace = true
