[package]
name = "renzora_scene_api"
version = "0.1.0"
edition = "2021"
description = "The scene vocabulary: shared components and entity tags, entity ids, the shape registry, render resolution and the project byte loader. Plugins see it at `renzora::SceneCamera`, `renzora::HideInHierarchy`, ..."

# A contract layer, moved out of `renzora::core`. Its reflected types keep their
# old `renzora::core::..` type paths (see the crate docs): saved scenes name
# components by type path.
[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1.1", default-features = false }

[lints]
workspace = true
