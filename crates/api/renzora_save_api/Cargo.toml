[package]
name = "renzora_save_api"
version = "0.1.0"
edition = "2021"
description = "Saved games: the process-wide working set of named values and the slots it is written to; plugins and scripts see it as `renzora::save`"

# A contract subject layer above `renzora_scripting_api`: a saved value is a
# `ScriptValue`. Holds process-global state, so it stays reachable from
# `renzora_sdk`, which is how `renzora_dylib` embeds one copy.
[dependencies]
bevy = { workspace = true }
renzora_scripting_api = { path = "../renzora_scripting_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
