[package]
name = "renzora_platform_api"
version = "0.1.0"
edition = "2021"
description = "What the engine knows about the machine and the install it runs from: its version, the plugins on disk and their updates, the Rust toolchain, child processes, sign-in state, DLSS's libraries, world streaming and window resizing"

# A contract layer. It needs the Console, project and scene layers, and not
# `renzora` itself. Plugins reach every module at the path it always had
# (`renzora::version`, `renzora::PluginUpdates`, `renzora::CompanionJobs`, ...)
# through `renzora_sdk`.
[features]
default = []
# A lean export compiles native plugins INTO the binary, and `plugin!` emits
# `#[no_mangle] renzora_native_plugin_ctor`: fifty of those in one binary do not
# link. With this on, `plugin!` emits nothing: the type is all the generated
# aggregator needs, since it calls `add_plugins` directly rather than looking a
# symbol up. The lean exporter's generated `renzora_static_plugins` turns it on.
static_plugins = []

[dependencies]
renzora_scene_api = { path = "../renzora_scene_api" }
renzora_project_api = { path = "../renzora_project_api" }
renzora_log_api = { path = "../renzora_log_api" }
bevy = { workspace = true }
# `companion` serializes job arguments.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `project_index` re-exports the project walk from here, which the standalone
# companion links without Bevy.
renzora_companion_proto = { path = "../../renzora_companion_proto" }

# Native-only: a browser tab has no install directory to find.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Where an install keeps its plugins. Not always beside the executable: inside a
# macOS `.app` the bundled ones are sealed by the code signature and anything
# installed goes to Application Support, so the answer is shared with the loader
# rather than reconstructed here. Carries no dependencies of its own.
renzora_native_build = { path = "../../renzora_native_build" }

# `app_link`: registering `renzora://` in the per-user registry, and letting the
# editor already running take the foreground when a link is forwarded to it.
# Already in the lockfile through winit and others, so nothing new is fetched.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
