[package]
name = "renzora_solari"
version = "0.1.0"
edition = "2021"
description = "Solari hardware-raytraced global illumination. Wraps Bevy's experimental bevy_solari (SolariPlugins) behind Renzora's effect routing + inspector, gated on GPU ray-tracing support."

# In-workspace plugin: an `rlib` declared with `renzora::add!`. It stays inert
# without GPU ray-tracing support, which `GpuRaytracing` reports. That flag and
# the settings type (`SolariGi`) live in the shared `renzora` contract, so no
# host or editor crate should depend on this one directly.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
# Compiles the Solari inspector entry.
editor = ["renzora/editor"]

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora" }

[lints]
workspace = true
