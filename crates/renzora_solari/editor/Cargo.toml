[package]
name = "renzora_solari_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only inspector for renzora_solari. Registered via renzora::add!(.., Editor) and linked only by the editor bundle."

[dependencies]
bevy = { workspace = true }
renzora = { path = "../../renzora", default-features = false, features = ["editor"] }
# The Ray Tracing panel (panel.rs).
renzora_ember = { path = "../../renzora_ember" }

[lints]
workspace = true
