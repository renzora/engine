[package]
name = "renzora_shader"
version = "0.1.0"
edition = "2021"

[features]
editor = []

[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "glsl-in"] }
uuid = { version = "1", features = ["v4"] }
# `diagnostics` for the material perf tables, which live in the contract crate so the
# debug panels reading them can be a native plugin. This crate populates
# them; enabling the feature here is what keeps them out of a build that
# does not carry this crate at all.
renzora = { path = "../renzora", default-features = false, features = ["diagnostics", "render_3d"] }
# The compiler Bevy 0.20 builds every shader with. Same version and features as
# `bevy_shader` links, so the validator accepts exactly what the pipeline will.
wesl = { version = "0.6", features = ["naga-ext"] }
thiserror = "2"

[dev-dependencies]
# An App is how you get at `Assets<Shader>`, which is where bevy_pbr keeps the
# sources the validator composes against.
renzora_test_harness = { path = "../renzora_test_harness" }
# Tests exercise the Problems-panel validator, which is `editor`-gated; a self
# dev-dependency turns the feature on for test builds without enabling it for
# downstream (shipped-game) builds.
renzora_shader = { path = ".", features = ["editor"] }

[lints]
workspace = true
