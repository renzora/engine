[package]
name = "renzora_terrain_graph"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
renzora = { path = "../renzora", default-features = false }
# The noise functions, erosion and heightmap decoding the nodes are built on,
# and the chunk types a build writes into. Shared rather than copied, so the
# Noise node and the old Generate tool can never drift apart.
renzora_terrain = { path = "../renzora_terrain" }

[lints]
workspace = true
