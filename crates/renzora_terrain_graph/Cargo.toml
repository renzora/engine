[package]
name = "renzora_terrain_graph"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A graph build is one undoable edit.
renzora_shell_api = { path = "../api/renzora_shell_api" }
# The noise functions, erosion and heightmap decoding the nodes are built on,
# and the chunk types a build writes into. Shared rather than copied, so the
# Noise node and the old Generate tool can never drift apart.
renzora_terrain = { path = "../renzora_terrain" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "TerrainGraphPlugin"
