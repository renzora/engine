[package]
name = "renzora_lumen"
version = "0.1.0"
edition = "2021"
description = "Lumen-inspired global illumination. Bundles its renzora_rt ScreenSpace backend."

# In-workspace plugin: an `rlib` declared with `renzora::add!`, which the build
# generator wires into the committed plugin list. The GI settings types live in
# the shared `renzora` contract, so no host or editor crate should depend on
# this one directly; consumers read the contract types instead.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
# Compiles the Lumen + RT inspectors and the debugger diagnostics producer.
editor = ["renzora/editor"]

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora" }
# Lumen's ScreenSpace backend, linked as a library into this plugin dll.
renzora_rt = { path = "../renzora_rt" }
renzora_shader = { path = "../renzora_shader" }
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.5", features = ["derive"] }

[lints]
workspace = true
