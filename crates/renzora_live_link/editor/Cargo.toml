[package]
name = "renzora_live_link_editor"
version = "0.1.0"
edition = "2021"
description = "Live link, editor side: mirrors the game Play is running into the editor, sends edits to it, and puts the scene back when it stops. Installed only by the editor bundle."

[dependencies]
renzora_scene_api = { path = "../../api/renzora_scene_api" }
renzora_project_api = { path = "../../api/renzora_project_api" }
renzora_log_api = { path = "../../api/renzora_log_api" }
bevy = { workspace = true }
# Snapshots, for putting back entities the game despawned.
renzora_engine = { path = "../../renzora_engine" }
renzora_live_link = { path = ".." }
serde_json = "1"

[dev-dependencies]
ron = "0.8"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "LiveLinkEditorPlugin"
scope = "Editor"
