[package]
name = "renzora_system_monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor"] }

[lints]
workspace = true

# Host hardware probing — native only. A browser tab cannot read CPU model,
# total/used RAM or NVIDIA GPU counters, and `nvml-wrapper-sys` does not even
# compile for wasm (it `dlopen`s the driver through `libloading`, which has no
# web implementation). The plugin keeps its FPS/frame-time and GPU-name readouts
# on the web, since both come from Bevy rather than the OS.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sysinfo = "0.35"
nvml-wrapper = "0.10"
