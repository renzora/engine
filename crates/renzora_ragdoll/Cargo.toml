[package]
name = "renzora_ragdoll"
version = "0.1.0"
edition = "2021"
description = "Skeletal ragdoll physics. Auto-builds rigid bodies + joints from a GLTF skeleton through the physics API and toggles bones between animated and physically-simulated."

# In-workspace plugin: an `rlib` declared with `renzora::add!`, same model as
# `renzora_cloth`.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
# The script functions this crate declares (its `ScriptExtension`). Purely
# declarative — no interpreter is linked either way — but the declaration itself
# needs the scripting crate, so a game exported without scripting drops it.
# Deliberately NOT in `default`: `renzora_runtime` owns the switch and forwards
# it, so the whole engine agrees on one answer.
scripting = ["dep:renzora_scripting"]
# Forwards to `renzora/editor` so `Ragdoll` registers into the Inspector's
# "Add Component" list. Off in lean exports — the dev/editor build keeps it
# on by default (see docs/r1-alpha8/editor-dev/inspector-fields.md).
editor = ["renzora/editor"]

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
renzora_macros = { path = "../renzora_macros" }
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }
# Bone discovery walks the same AnimatorState/AnimationCommandQueue the
# skeletal animation system uses, so pausing/resuming playback when a ragdoll
# toggles on/off goes through the existing command queue instead of reaching
# into bevy's AnimationPlayer directly.
renzora_animation = { path = "../renzora_animation", default-features = false }
# No physics engine: bones and joints are `renzora::physics` data, simulated by
# whichever backend the project selects.

# Lua types referenced in the RagdollScriptExtension trait impl.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[lints]
workspace = true
