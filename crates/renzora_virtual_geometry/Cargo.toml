[package]
name = "renzora_virtual_geometry"
version = "0.1.0"
edition = "2021"
description = "Virtual geometry: clustered meshes with per-cluster LOD, culled and rasterized on the GPU, shaded by each material's own Bevy shader."

[dependencies]
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_log_api = { path = "../api/renzora_log_api" }
bevy = { workspace = true }
# `render_3d` for the 3D-only contract types it reads (`SolariShadedTransparent`).
# Without it the crate built only when another crate in the same build turned
# the feature on.
renzora_render_api = { path = "../api/renzora_render_api", features = ["render_3d"] }
# Marks its stage of a project load on the load timeline.
renzora_diagnostics_api = { path = "../api/renzora_diagnostics_api" }
renzora_rvg = { path = "../renzora_rvg" }
# Plain-old-data GPU structs. Already in the lockfile through Bevy.
bytemuck = { version = "1", features = ["derive"] }
# Hands out space in the page pool (`render/pool.rs`). The allocator Bevy's
# mesh and skin buffers use, so already in the lockfile.
offset-allocator = "0.2"

[dev-dependencies]
# The GPU tests build their test meshes with the real builder, and load
# models stored as `.rvg` through the real model loader.
renzora_rvg = { path = "../renzora_rvg", features = ["bake", "model"] }
serde_json = "1"
# The GPU tests build their shaders the way the engine does.
renzora_shader_api = { path = "../api/renzora_shader_api" }
# And render a real compiled node-graph material, which is registered for
# virtual geometry by the runtime rather than by this crate.
renzora_shader = { path = "../renzora_shader", features = ["editor"] }
# And trace a model with Solari, through Renzora's own plugin, the way the
# editor does: what Solari traces for a converted mesh is decided between the
# two crates.
renzora_solari = { path = "../renzora_solari" }
# The Solari settings and diagnostics those tests set and read.
renzora_solari_api = { path = "../api/renzora_solari_api" }
# Which of those can run here: CI's GPU job has a software Vulkan with no ray
# tracing, so the Solari tests ask the adapter before they build an app.
wgpu = { version = "30", default-features = false }
# A headless app whose shader libraries the terrain shader test compiles
# against, and the validator it compiles with (`editor`).
renzora_test_harness = { path = "../renzora_test_harness" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "VirtualGeometryPlugin"
