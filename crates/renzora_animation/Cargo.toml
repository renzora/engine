[package]
name = "renzora_animation"
version = "0.1.0"
edition = "2021"

[features]
default = []
# The script functions this crate declares (its `ScriptExtension`). Purely
# declarative — no interpreter is linked either way — but the declaration itself
# needs the scripting crate, so a game exported without scripting drops it.
# Deliberately NOT in `default`: `renzora_runtime` owns the switch and forwards
# it, so the whole engine agrees on one answer.
scripting = ["dep:renzora_scripting"]
# Morph-target tracks play through Bevy's `WeightsCurve`, which exists only
# with Bevy's `morph_animation`. Off in a lean export that strips blend shapes;
# `renzora_runtime` owns the switch, like `scripting` above.
morph = []

[dependencies]
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
renzora_scripting_api = { path = "../api/renzora_scripting_api" }
renzora_animation_api = { path = "../api/renzora_animation_api" }
renzora_scripting = { path = "../renzora_scripting", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "AnimationPlugin"
