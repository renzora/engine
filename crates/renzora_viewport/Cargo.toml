[package]
name = "renzora_viewport"
version = "0.1.0"
edition = "2021"


[dependencies]
renzora_shell_api = { path = "../api/renzora_shell_api" }
renzora_viewport_api = { path = "../api/renzora_viewport_api" }
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
renzora_lang_api = { path = "../api/renzora_lang_api" }
renzora_log_api = { path = "../api/renzora_log_api" }
renzora_undo = { path = "../renzora_undo" }
renzora_theme = { path = "../renzora_theme" }
renzora_ember = { path = "../renzora_ember" }
renzora_editor_framework = { path = "../renzora_editor_framework" }
bevy = { workspace = true }
renzora = { path = "../shared/renzora", default-features = false, features = ["editor"] }
# Marks load stages on the load timeline, and profiles Play.
renzora_diagnostics_api = { path = "../api/renzora_diagnostics_api" }
renzora_platform_api = { path = "../api/renzora_platform_api" }
renzora_world_api = { path = "../api/renzora_world_api" }
renzora_render_api = { path = "../api/renzora_render_api" }
renzora_material_api = { path = "../api/renzora_material_api" }
# Data types only (no avian): the 2D overlay draws the collider-edit chrome
# from `CollisionShapeData` + `ColliderEditMode` (the interaction half lives
# in renzora_gizmo::collider_edit_2d — the two crates don't link).
renzora_physics = { path = "../renzora_physics", default-features = false }
renzora_ui = { path = "../renzora_ui" }
renzora_animation = { path = "../renzora_animation" }
# Only `ParticleSystem`, for dropping an effect onto the viewport.
renzora_particles = { path = "../renzora_particles" }
renzora_shader = { path = "../renzora_shader" }
renzora_terrain = { path = "../renzora_terrain" }
renzora_engine = { path = "../renzora_engine" }
renzora_import = { path = "../renzora_import" }
renzora_ember_editor = { path = "../renzora_ember/editor" }
serde_json = "1"
# Reading the legacy `[editor].viewport` table straight out of a project.toml
# during migration — see `persistence::legacy_viewport_prefs`.
toml = "0.8"
bytemuck = { version = "1.5", features = ["derive"] }
# The editor's own window handle, which the embedded game's window is parented
# to; see `game_panel`. Same version Bevy's window types use.
raw-window-handle = "0.6"

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "ViewportPlugin"
scope = "Editor"
