[package]
name = "renzora_motion_blur_editor"
version = "0.1.0"
edition = "2021"
description = "Editor-only inspector for renzora_motion_blur. Declared as an Editor-scope plugin in this manifest and linked only by the editor bundle."

[dependencies]
renzora_editor_api = { path = "../../api/renzora_editor_api" }
bevy = { workspace = true }
renzora_motion_blur = { path = ".." }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "MotionBlurEditorPlugin"
scope = "Editor"
