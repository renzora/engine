[package]
name = "renzora_pool_water_editor"
version = "0.1.0"
edition = "2021"
description = "Editor companion to renzora_pool_water: the Pool Water inspector entry. Editor scope, so it links only into the editor binary."

[dependencies]
bevy = { workspace = true }
renzora = { path = "../../renzora", default-features = false, features = ["editor"] }
renzora_editor_framework = { path = "../../renzora_editor_framework" }
renzora_pool_water = { path = ".." }

[lints]
workspace = true
