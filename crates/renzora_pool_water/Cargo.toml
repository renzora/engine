[package]
name = "renzora_pool_water"
version = "0.1.0"
edition = "2021"
description = "Pool water — the runtime half. The inspector lives in the nested `editor/` subcrate (renzora_pool_water_editor), linked only by the editor binary."

[lib]
crate-type = ["rlib"]

# No `editor` feature — see `renzora_forward_decal`'s manifest for why one could
# not have kept the editor framework out of a shipped game.
[dependencies]
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora = { path = "../renzora", default-features = false }

[lints]
workspace = true
