[package]
name = "renzora_ai_chat"
version = "0.1.0"
edition = "2021"

# Distribution plugin: ships as a standalone .dll/.so/.dylib that
# dynamic_plugin_loader picks up from the engine's plugins/ directory at
# startup. Adds an "AI Chat" panel that streams from a local Ollama
# server — delete the dylib and the editor carries no AI code at all.
[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
renzora_ember = { path = "../renzora_ember" }
# Blocking HTTP on a worker thread (same client the auth/hub crates use).
renzora_net = { path = "../renzora_net" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

# Native folder picker for the docs-folder setting.
#
# rfd's web backend offers only `AsyncFileDialog`, and no folder picking at all
# — the browser equivalent is `showDirectoryPicker()`, which is async and a
# different API shape. `docs_browse_click` no-ops on wasm until the web build
# grows a directory-handle path.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
