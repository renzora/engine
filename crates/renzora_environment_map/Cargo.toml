[package]
name = "renzora_environment_map"
version = "0.1.0"
edition = "2021"
description = "Image-based lighting (IBL) component — controls sky-derived environment map intensity on cameras. Independent of the atmosphere effect; can be added/removed via inspector."

# No `editor` feature: lean runtime crate. The inspector moved to the nested
# renzora_environment_map_editor crate (crates/renzora_environment_map/editor).

[dependencies]
renzora_scene_api = { path = "../api/renzora_scene_api" }
renzora_project_api = { path = "../api/renzora_project_api" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
# Marks its stage of a project load on the load timeline.
renzora_diagnostics_api = { path = "../api/renzora_diagnostics_api" }
# For `sun_horizon_factor` — sky-derived IBL fades with the sun so the
# scene goes properly dark at night (no residual atmospheric ambient).
renzora_lighting = { path = "../renzora_lighting" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "EnvironmentMapPlugin"
