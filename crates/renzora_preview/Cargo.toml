[package]
name = "renzora_preview"
version = "0.1.0"
edition = "2021"
description = "Marketplace asset preview harness — compiles to WASM for live browser previews"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
bevy = { workspace = true }

# Engine crates
renzora_shader = { path = "../renzora_shader" }
renzora_particles = { path = "../renzora_particles" }

# WASM bridge
wasm-bindgen = "0.2.108"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# WASM support: getrandom needs JS backend on wasm32 targets. One handle per
# getrandom major in the graph — this crate reaches 0.4 through `rand` 0.10 via
# bevy_math. Keep in step with the identical block in the root Cargo.toml, which
# carries the full explanation.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }



[lints]
workspace = true
