[package]
name = "renzora_splash"
version = "0.2.0"
edition = "2021"

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false }
renzora_ember = { path = "../renzora_ember" }
renzora_ui = { path = "../renzora_ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
dirs = "6"
renzora_net = { path = "../renzora_net" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "console"] }
# The browser's answer to `rfd` above: a directory picker with real read/write
# on the folder the user chooses.
renzora_webfs = { path = "../renzora_webfs" }

[lints]
workspace = true
