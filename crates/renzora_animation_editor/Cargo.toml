[package]
name = "renzora_animation_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_theme = { path = "../renzora_theme" }
renzora_editor_framework = { path = "../renzora_editor_framework" }
bevy = { workspace = true }
renzora = { path = "../renzora", default-features = false, features = ["editor"] }
renzora_ember = { path = "../renzora_ember" }
renzora_animation = { path = "../renzora_animation" }
renzora_inspector = { path = "../renzora_inspector" }
renzora_ui = { path = "../renzora_ui" }
renzora_undo = { path = "../renzora_undo" }
# The timeline's Particles group: keyed effect parameters, edited through the
# effect editor's document so the two editors never hold two copies.
renzora_particles = { path = "../renzora_particles" }
renzora_particles_editor = { path = "../renzora_particles/editor" }
ron = "0.8"
# The Rig and Face panels: building skeletons and skins, mirroring, IK and
# the face's expressions.
renzora_rig = { path = "../renzora_rig" }
# Lip sync reads a voice recording's loudness, which needs it decoded.
renzora_audio = { path = "../renzora_audio", features = ["decode"] }
rfd = "0.15"
# The pose library's files.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
