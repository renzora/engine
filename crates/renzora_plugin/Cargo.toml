[package]
name = "renzora_plugin"
version = "0.1.0"
edition = "2021"
description = "Write Renzora plugins in Rust. Compiles standalone — no engine checkout, no Bevy, no pinned toolchain."
license = "MIT OR Apache-2.0"
repository = "https://github.com/renzora/engine"

[features]
# A PLUGIN depends on this crate with default features and gets zero
# dependencies — that is the whole design, and it is what makes a plugin build
# in under a second on any machine with any rustc.
default = ["std"]

# Link the Rust standard library. ON by default, and the only reason it is a
# feature at all is that turning it off makes a plugin roughly six times smaller:
#
#   pulse.dll, `dist` profile      std  112,128 B
#                                no_std  17,920 B
#
# That is not an optimiser setting — `opt-level = "z"` + fat LTO + `panic =
# "abort"` on the std build only reaches 92,160 B. Each dlopen'd plugin carries
# its own copy of std, so ~90 KB is a floor per DLL, and across the 63 plugins
# shipped in `plugins/` it is 5.6 MB of duplicated runtime.
#
# WHAT TURNING IT OFF COSTS — read before reaching for it. `catch_unwind` lives
# in `std` and has no `core` equivalent, so a `no_std` plugin loses the panic
# firewall: today a panicking system is caught, reported as
# `SystemStatus::Panicked`, and the host DISABLES THAT SYSTEM and keeps running
# (see `host::mod`'s system runner). Without `std` the panic reaches an
# `extern "C"` frame and takes the whole editor with it. `no_std` on stable
# cannot unwind at all — there is no way to define `eh_personality` — so such a
# plugin must also set `panic = "abort"` in its profile.
#
# The trade is therefore "5.5 MB against third-party crash isolation", which is
# why this is opt-out rather than opt-in. The engine's own plugins take it —
# 59 of the 63 in `plugins/` are `no_std`, dropping that set from 6.30 MB to
# 1.04 MB — because their panics are our bugs rather than a stranger's, and
# because a post-process effect is a shader plus two arithmetic systems. A
# downloaded marketplace plugin should keep `std`.
#
# The four that do not: `lua` (needs `script`), `text3d` (`std::fs` for fonts),
# `hair` (`HashMap` + a `Mutex` static), `wobble` (its `noise` dep pulls
# `num-traits` with default features, and feature unification cannot subtract).
std = []

# Soft-float math for `no_std`. `f32::sqrt`, `sin_cos`, `sin`, `acos`, `powf`
# and `rem_euclid` are `std` inherent methods with no `core` equivalent — they
# compile down to libm calls that `core` deliberately does not link. `Vec3`,
# `Quat` and the colour conversions in `ecs` need all six, so a `no_std` plugin
# has to supply them:
#
#   renzora_plugin = { version = "0.1", default-features = false, features = ["libm"] }
#
# Two knobs for one decision is not ideal, but it is the shape `glam` and
# `nalgebra` already use, so it is the one a plugin author has met before. The
# `std` build never references the crate, so leaving it off costs nothing.
libm = ["dep:libm"]

# ── Domain modules ────────────────────────────────────────────────────────────
# One feature per domain a plugin can drive. These are NOT part of the ABI: each
# is an ordinary user of `CommandKind::Service`, which carries bytes `sys` never
# reads. Two consequences worth stating, because they are the reason for the
# split:
#
#   * Adding a domain bumps THIS CRATE's semver, not `sys::VERSION_MINOR`. The
#     ABI version describes the boundary; a plugin wanting audio should not have
#     to declare a minimum that also encodes animation history.
#   * They are dependency-free, so opting in costs a plugin nothing beyond the
#     types it uses — which, being plain data with no statics, emit no code.
#
# Adding one is a module here plus a `plugin_bridge` in the engine crate that
# owns the domain. Neither touches `sys`.
anim = []
physics = []
http = []
# Native file/folder pickers. Costs nothing to leave off, and — unlike the three
# above — cost nothing to ADD either: it was the first domain to ride the generic
# reply channel, so it needed no `sys::VERSION_MINOR` bump of its own.
dialog = []

# Compile a plugin to be LINKED INTO the host rather than `dlopen`'d.
#
# A plugin normally exports `renzora_plugin_init` unmangled, because the loader
# looks it up by that exact name. Link two such plugins into one binary and the
# link fails: the symbol is defined twice. So this feature drops `#[no_mangle]`
# from what `add!` emits, leaving ordinary `pub extern "C"` functions that a
# generated aggregator calls by path (`pulse::renzora_plugin_init`).
#
# The cfg is evaluated HERE, in this crate, not in the plugin — which is exactly
# why the macro delegates the attribute to `__plugin_init_entry!` rather than
# writing `#[cfg(feature = ...)]` into its own expansion, where the feature name
# would resolve against the *plugin's* manifest and always be absent.
#
# Turned on for the whole build graph by the lean exporter's generated
# `renzora_static_plugins` crate; cargo's feature unification then applies it to
# every plugin compiled in that invocation. Nothing else should enable it — a
# cdylib built with it exports no init symbol and cannot be loaded from disk.
static_link = []

# Scripting is a domain like the three above, with one difference worth calling
# out: it is the only one where the *host* calls into the plugin rather than the
# other way round. That needs an `Interface` function to register a backend, so
# unlike `anim`/`physics`/`http` it does move `sys::VERSION_MINOR`. The domain
# vocabulary — the command list, the context, the codec — still lives behind
# this feature and still costs a plugin nothing to leave off.
#
# Requires `std`, unlike the three domains above. `register_backend!` parks the
# backend in a `std::sync::Mutex` static, `WireError` implements
# `std::error::Error`, and — decisively — an interpreter is not a thing that
# wants `no_std`: the one backend that exists links mlua, which links libc. A
# language plugin is the case where the 90 KB of std is already noise.
script = ["std"]

# The ENGINE opts into `host`, which adds the other side of the boundary: the
# interface implementation, the dynamic-query dispatcher, and the `dlopen`
# loader. Split by feature rather than by crate so a plugin author depends on
# exactly one name.
#
# Requires `std` — it links Bevy, `libloading` and the host's own threading, none
# of which exist without it. That is not a limitation to lift: the host is the
# editor, and the editor is a windowed GPU application.
host = ["std", "dep:bevy", "dep:libloading"]
# The 3D half of the host: `StandardMaterial` / `MeshMaterial3d`, which come from
# `bevy_pbr`. A 2D-only export strips that, so without this `add_material`
# refuses with a warning and `MaterialSlot::Standard` does not exist. Plugins
# shipping their own material go through `MaterialSlot::Custom` and are
# unaffected. Only meaningful alongside `host`; a guest plugin never sees it.
render_3d = []

# NOTE: there is deliberately no `editor` feature pulling in `renzora`.
# A crate with a path dependency cannot be published to crates.io, and this one
# has to be publishable — a third-party plugin author must be able to
# `cargo add renzora_plugin`. So the dependency runs the other way: editor crates
# depend on THIS crate and read `host::PluginComponentSchemas`, rather than this
# crate reaching into the engine.

# ── The guest side must stay dependency-free ──────────────────────────────────
# `sys` and `ecs` are compiled into BOTH the host and every plugin, potentially
# by different rustc versions on different machines. The only thing making that
# safe is that every type crossing the boundary is `#[repr(C)]` and every
# function is `extern "C"`. A *non-optional* dependency here would put types with
# unspecified layout on the boundary and silently miscompile plugins built with a
# different toolchain — corrupted data, not a link error.
#
# So: anything added below MUST be `optional = true` and gated behind `host` or
# `editor`. If a type needs to cross the boundary, define a `#[repr(C)]` mirror
# in `sys` instead — `sys::Transform` documents why even `bevy::Transform` gets
# mirrored rather than shared by pointer.
[dependencies]
renzora_plugin_derive = { path = "../renzora_plugin_derive" }
bevy = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }
# Pulled only by the `libm` feature, i.e. only by `no_std` plugins. It is itself
# `no_std` and dependency-free, so it does not weaken the guarantee above — it
# exposes functions, not types, and nothing from it crosses the ABI boundary.
libm = { version = "0.2", optional = true }

# NOTE: the tests deliberately link NO plugin from `plugins/`. A path dependency
# on one would drag it back into the engine's workspace — cargo rejects a path dep
# on a package that declares itself a workspace root, and without that
# declaration the plugin silently inherits the engine's feature unification and
# target dir. The tests define their own minimal plugins inline instead, which
# also means they exercise the API rather than one example's use of it.

[lints]
workspace = true
