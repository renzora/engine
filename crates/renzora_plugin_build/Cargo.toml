[package]
name = "renzora_plugin_build"
version = "0.1.0"
edition = "2021"
description = "Compile a native plugin from source against a staged Renzora SDK."

# Not a Bevy plugin and deliberately not one: no `renzora::add!` line, no
# systems, no `App`. It is a function library the editor's install flow calls,
# the same shape as `renzora_export`.
#
# Bevy is not a dependency either, which is the point — the whole crate is
# "read a manifest, build an argv, run rustc, write a stamp". Keeping it free of
# the engine means it can be exercised without booting one.
[dependencies]
# The half `xtask` also needs: the rustc command line, the third-party
# dependency build, and the JSON reader. Carries no dependencies of its own, so
# xtask can share it without inheriting the four below.
renzora_native_build = { path = "../renzora_native_build" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `mod unpack`'s two dependencies, and the only native ones this crate has.
#
# Target-scoped rather than plain because the module is desktop-only: it prepares
# a `sdk.tar.zst` for `rustc`, and a browser can run neither. This crate is still
# reached on wasm — `renzora_runtime` deps the native-plugin loader and the
# Rust-script backend unconditionally — so anything left un-scoped here ships in
# every web game. `tar` alone brought `filetime` and `xattr` along for a build
# that has no filesystem.
#
# `zstd` could not cross even if we wanted it to: it builds a vendored libzstd
# through `cc`, and wasm32-unknown-unknown has no libc sysroot for that C, so
# clang stops at `'stdlib.h' file not found` before reaching any Renzora code.
# That is what broke the web build when the native plugin system landed. It was
# briefly fixed by swapping in pure-Rust `ruzstd` for wasm; gating the module is
# the better answer, because it removes the code rather than porting code that
# can never run. (`renzora_rpak` keeps its own `ruzstd` arm — a web game really
# does read `.rpak` archives.)
#
# Its decoder implements `Read`, which is what lets the tar reader chain straight
# onto it instead of round-tripping a ~1.9 GB temporary file. See `unpack.rs` for
# the measurements, including why the obvious `xz2` swap is not a speed-up.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tar = "0.4"
zstd = "0.13"

[lints]
workspace = true
