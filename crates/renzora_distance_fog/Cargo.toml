[package]
name = "renzora_distance_fog"
version = "0.1.0"
edition = "2021"

# No `editor` feature: lean runtime crate. The inspector + native drawer moved to
# the nested renzora_distance_fog_editor crate (crates/renzora_distance_fog/editor).

[dependencies]
renzora_scene_api = { path = "../api/renzora_scene_api" }
bevy = { workspace = true }
serde = { version = "1", features = ["derive"] }
renzora_world_api = { path = "../api/renzora_world_api" }

[lints]
workspace = true

# The plugins this crate declares. Read by `cargo renzora sync`, which
# links the crate into the engine and installs each one from the generated
# plugin lists; nothing in the crate's own code is involved.
[[package.metadata.renzora.plugin]]
type = "DistanceFogPlugin"
