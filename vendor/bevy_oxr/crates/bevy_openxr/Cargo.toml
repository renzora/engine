[package]
name = "bevy_mod_openxr"
description = "Community crate for OpenXR in Bevy"
version = "0.5.0"
edition = "2024"
repository = "https://github.com/awtterpip/bevy_oxr"
license = "MIT/Apache-2.0"
keywords = ["gamedev", "bevy", "Xr", "Vr", "OpenXR"]

[features]
default = ["vulkan"]
vulkan = ["dep:ash", "dep:android_system_properties"]
d3d12 = ["wgpu/dx12", "wgpu-hal/dx12", "dep:winapi"]
fb_passthrough = []
reflect = ["dep:bevy_reflect"]
window_support = ["dep:bevy_winit", "dep:bevy_window"]
raw_vulkan_init = []
# RENZORA PATCH: `bevy_render`'s own `raw_vulkan_init`, which Bevy's `dlss`
# feature turns on. It adds an `AdditionalVulkanFeatures` argument to
# `RenderCreation::manual`, so this crate has to know when it is on; a crate
# cannot see another's features. Distinct from `raw_vulkan_init` above, which
# Renzora enables in every build and which gates nothing.
bevy_raw_vulkan_init = ["bevy_render/raw_vulkan_init"]

[dev-dependencies]
bevy = { version = "0.20" }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.20"
android_system_properties = { version = "0.1.5", optional = true }

# bevy can't be placed behind target or proc macros won't work properly
[dependencies]
# RENZORA: Bevy comes from Renzora's `bevy/` by path, never crates.io.
bevy_ecs = { path = "../../../../bevy/crates/bevy_ecs", default-features = false }
bevy_math = { path = "../../../../bevy/crates/bevy_math", default-features = false }
bevy_render = { path = "../../../../bevy/crates/bevy_render", default-features = false }
# 0.20 port: the `ExtractResource` derive expands to paths in `bevy_extract`.
bevy_extract = { path = "../../../../bevy/crates/bevy_extract", default-features = false }
bevy_app = { path = "../../../../bevy/crates/bevy_app", default-features = false }
bevy_reflect = { path = "../../../../bevy/crates/bevy_reflect", default-features = false, optional = true }
bevy_log = { path = "../../../../bevy/crates/bevy_log", default-features = false }
bevy_transform = { path = "../../../../bevy/crates/bevy_transform", default-features = false }
bevy_camera = { path = "../../../../bevy/crates/bevy_camera", default-features = false }
bevy_derive = { path = "../../../../bevy/crates/bevy_derive", default-features = false }
bevy_platform = { path = "../../../../bevy/crates/bevy_platform", default-features = false }
bevy_winit = { path = "../../../../bevy/crates/bevy_winit", default-features = false, optional = true }
bevy_window = { path = "../../../../bevy/crates/bevy_window", default-features = false, optional = true }

# all other dependencies are placed under this since on wasm, this crate is completely empty
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_mod_xr = { path = "../bevy_xr", version = "0.5.0" }
openxr = "0.21.1"
thiserror = "2.0.3"
# Must match bevy 0.20's wgpu (30.x): `raw_vulkan_init` hands raw wgpu objects
# to bevy's RenderDevice/RenderQueue, so a version skew makes them distinct types.
wgpu = "30"
wgpu-hal = "30"
ash = { version = "0.38", optional = true }

[target.'cfg(target_family = "unix")'.dependencies]
wgpu = { version = "30", features = ["vulkan-portability"] }

[target.'cfg(target_family = "windows")'.dependencies]
openxr = { version = "0.21.1", features = ["mint", "loaded"] }
winapi = { version = "0.3.9", optional = true }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
