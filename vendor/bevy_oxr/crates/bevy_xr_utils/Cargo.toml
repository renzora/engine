[package]
name = "bevy_xr_utils"
version = "0.5.0"
edition = "2024"
license = "MIT/Apache-2.0"
repository = "https://github.com/awtterpip/bevy_oxr"
description = "utils for bevy_mod_xr and bevy_mod_openxr"

[dependencies]
bevy_mod_xr = { path = "../bevy_xr", version = "0.5.0" }
bevy_mod_openxr = { path = "../bevy_openxr", version = "0.5.0" }
# RENZORA: Bevy comes from Renzora's `bevy/` by path, never crates.io.
bevy_ecs = { path = "../../../../bevy/crates/bevy_ecs", default-features = false }
bevy_app = { path = "../../../../bevy/crates/bevy_app", default-features = false }
bevy_transform = { path = "../../../../bevy/crates/bevy_transform", default-features = false }
bevy_color = { path = "../../../../bevy/crates/bevy_color", default-features = false }
bevy_gizmos = { path = "../../../../bevy/crates/bevy_gizmos", default-features = false }
bevy_log = { path = "../../../../bevy/crates/bevy_log", default-features = false }
bevy_derive = { path = "../../../../bevy/crates/bevy_derive", default-features = false }
bevy_math = { path = "../../../../bevy/crates/bevy_math", default-features = false }

[dev-dependencies]
bevy = { version = "0.20" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
openxr = "0.21.1"
openxr_mndx_xdev_space = "0.2.0"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
