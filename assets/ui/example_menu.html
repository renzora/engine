<!-- Example main menu authored entirely in markup.

     Spawn it from Rust as a canvas:
         cmd.spawn((UiCanvas::default(), HtmlTemplatePath("ui/example_menu.html".into())));
     or from a script (see scripts/ui_menu.rs):
         ScriptAction::new("hui_spawn", me).arg("template", "ui/example_menu.html").send(world)

     Each <node template="ui/components/menu_button.html">'s `action` is the
     markup callback name, forwarded to every script's `Ui` hook (broadcast,
     like RPCs). The `tag:`-prefixed attributes are not
     forwarded yet, so `args` arrives empty. -->
<template>
    <property name="title">Renzora</property>

    <node
        id="menu_root"
        flex_direction="column"
        align_items="center"
        justify_content="center"
        width="100%"
        height="100%"
    >
        <text font_size="48" font_color="#FFFFFF" margin="0px 0px 24px 0px">
            {title}
        </text>

        <node template="ui/components/menu_button.html" text="Start Game" action="start_game" tag:scene="level_01" />
        <node template="ui/components/menu_button.html" text="Settings"   action="open_settings" />
        <node template="ui/components/menu_button.html" text="Credits"    action="open_credits" />
        <node template="ui/components/menu_button.html" text="Quit"       action="quit_game" />
    </node>
</template>
