# Cargo aliases — everything uses dist profile for consistent plugin hashes
[alias]
# Run
# `cargo renzora` is the native (no-Docker) build+stage+run. It routes through
# the `xtask` helper instead of a bare `cargo run`, because a bare run leaves the
# shared images flat in target/dist/ rather than beside the executable where the
# binary looks for them. `xtask` compiles the workspace, stages a
# clean dist/<platform>/ exactly like the Docker build-all.sh (bevy_dylib +
# renzora + the editor bundle beside the exe; plugins in plugins/), then launches
# it. `cargo renzora dist` stages without launching. With rust-toolchain.toml
# pinning rustc, this mirrors the container locally on the host platform; Docker
# stays the path for cross-platform/release builds.
#
# `--manifest-path` rather than `-p xtask`: xtask is its own workspace root, not
# a member (it has to build even when a dangling generated dependency stops the
# engine workspace from loading — see xtask/Cargo.toml). The path is relative to
# the current directory, so run `cargo renzora` from the repo root.
#
# ── Why the two `--config` overrides ─────────────────────────────────────────
# The Linux section at the bottom of this file links with `clang` + `mold`, and
# a cargo config applies to EVERY build run from this directory — including the
# build of xtask itself. On a host missing either tool that produced a bootstrap
# deadlock: `cargo renzora` died with rustc's bare "linker `clang` not found"
# while compiling xtask, so the one binary able to diagnose the missing linker
# could never be built to say so.
#
# These pin the BOOTSTRAP of xtask to `cc` + binutils `ld.bfd` — the two things
# every Linux box already has — leaving the linker choice below to apply where
# it actually pays off: the workspace build that xtask then drives as its own
# cargo invocation. xtask checks for clang/mold there and reports them by name.
#
# `rustflags` is appended, not replaced: cargo JOINS config arrays across
# sources, so `-fuse-ld=mold` from the target section is still on the command
# line and the trailing `-fuse-ld=bfd` overrides it (the last `-fuse-ld` wins in
# the compiler driver). That also means the xtask bootstrap uses bfd even where
# mold is installed — it is one tiny dependency-free crate, measured at 0.4 s.
#
# Inert off Linux: the key names a target triple a Windows/macOS host never
# selects. xtask lives in its own workspace with its own target/, so nothing
# here perturbs the engine's build cache or its `-C metadata` hashes.
renzora = "run --config target.x86_64-unknown-linux-gnu.linker='cc' --config target.x86_64-unknown-linux-gnu.rustflags=['-C','link-arg=-fuse-ld=bfd'] --manifest-path xtask/Cargo.toml --"
# ⚠ These two select a SINGLE package, so they resolve `renzora` without its
# `editor` feature and recompile ~86 shared packages against the `--workspace`
# cache (see the note under `dist` below). Fine for an occasional headless
# server run; if you are switching back and forth, build once with `cargo dist`
# and launch `target/dist/renzora.exe` directly instead.
#
# `--no-editor` is gone from `runtime`: it used to suppress loading the editor
# bundle dll, and this binary can no longer become the editor at all.
runtime = "run --profile dist --bin renzora"
# Dedicated server = the runtime binary launched with `--server`.
server = "run --profile dist --bin renzora -- --server"

# Build
#
# `cargo dist` is the everyday one: BOTH executables — `renzora` (the runtime /
# shipped game) and `renzora-editor` — from ONE invocation. Faster than
# `build-all` because it stops at the two binaries instead of also building
# every other workspace target.
#
# ── Why every build alias says `--workspace` ───────────────────────────────
# Cargo resolves features once per invocation, across the packages it selected.
# A `--workspace` build resolves `renzora` WITH its `editor` feature (the editor
# package asks for it); selecting one package alone resolves it WITHOUT. Those
# are different feature sets, so they get different `-C metadata` hashes and
# therefore different `.rlib` filenames — and ~86 shared packages (bevy,
# bevy_ecs, wgpu, glam, …) get compiled a SECOND time. Worse, the two
# invocations then evict each other forever: alternating them recompiles the
# engine every single time.
#
# (Not to be confused with `cargo renzora dist`, which STAGES an already-built
# tree into dist/<platform>/. This one only compiles + links.)
#
# That is exactly what the old `build-runtime = "build --profile dist --bin
# renzora"` alias did — and it wrote to the same `target/dist/renzora.exe` path
# as `build-editor`, so the two silently fought over one output file. It has
# been REMOVED. Building only the runtime is no longer a thing you need: the
# runtime binary produced by `cargo dist` already contains no editor code,
# because `renzora_app` does not depend on any editor crate.
dist = "build --profile dist --workspace --exclude renzora-android --exclude renzora-ios"
build-editor = "build --profile dist --workspace"
build-all = "build --profile dist --workspace"
build-plugins = "build --profile dist --workspace"

# WASM (game only — the editor bundle is a desktop dlopen target; no wasm editor)
build-web = "build --profile dist --bin renzora --no-default-features --features wasm --target wasm32-unknown-unknown"

# Android
build-android = "build --profile dist --no-default-features --target aarch64-linux-android"

# iOS
build-ios = "build --profile dist --target aarch64-apple-ios -p renzora-ios"
build-ios-sim = "build --profile dist --target aarch64-apple-ios-sim -p renzora-ios"

# tvOS
build-tvos = "build --profile dist --target aarch64-apple-tvos -p renzora-ios"
build-tvos-sim = "build --profile dist --target aarch64-apple-tvos-sim -p renzora-ios"

# ── Linking model ───────────────────────────────────────────────────────────
# In-workspace plugin crates are rlib-only and link statically into the host
# binary. An INSTALLED plugin is a `dylib` that links the real Bevy and the real
# contract crate, so it must share them with the host: `dynamic_linking` is in
# the root manifest's default feature set and pulls `bevy_dylib`,
# `renzora_dylib` and `renzora_ember_dylib`, which stage beside the executable.
# That is what makes one `World` type, one translation table and one theme
# palette per process.
#
# `prefer-dynamic` is NOT set here, and must not be: it arrives with
# `bevy/dynamic_linking` where it belongs. Setting it in this file applies it to
# every target including the ones that must stay static, and its only extra
# effect is to make a binary import a toolchain-hashed `std-<hash>.dll` that
# then has to ship beside it.
#
# `crt-static` IS set, on both Windows triples below, and the reason is that
# Windows does not ship the runtime a dynamic one would need.
#
# The comment this replaces said VCRUNTIME140 and MSVCP140 were "a dependency
# Windows always has". They are not. Windows ships the *Universal* CRT
# (ucrtbase.dll and the api-ms-win-crt-* set) as an OS component, which is why
# most of the import table resolves anywhere and the claim looked true;
# VCRUNTIME140 (MSVC's exception unwinding, RTTI, stack cookies) and MSVCP140
# (the C++ standard library) ship with the Visual C++ Redistributable instead.
# Visual Studio installs that, and so do most games, so every machine that
# builds the engine has had it for years and a freshly installed Windows has
# not. The release therefore ran for everyone who built it and died before
# `main` for a user with a clean machine, naming a DLL in an OS dialog with
# nothing written to any log.
#
# There were only ever two fixes, because the CRT has to be either inside the
# binary or in a file beside it: static-link it, or ship vcruntime140.dll,
# vcruntime140_1.dll and msvcp140.dll in the folder. Static, because three more
# files in the install directory is a worse deal than ~100 KB per binary.
#
# The historical objection was that a static CRT is per-module, and this build
# is several modules: renzora.exe, bevy_dylib and the shared images each get
# their own copy, with their own heap. That is a real hazard in general and it
# does not reach us, because Rust's allocator on Windows is
# HeapAlloc(GetProcessHeap()) rather than the CRT's malloc, so a Vec allocated
# in one module and dropped in another is unaffected. Verified before turning
# this on: a dylib + exe pair built this way imports KERNEL32 and std-<hash>.dll
# and nothing else, and passes a Vec across the boundary correctly.
#
# The one place the hazard survives is real C++, which here is exactly one crate
# (basis-universal-sys, Bevy's KTX2 transcoder). Its allocations are created and
# freed behind a single FFI call inside whichever module linked it, so none of
# them crosses a boundary.
#
# Anything else that loads into this process has to agree, or it reintroduces
# the import the engine no longer satisfies. Two places do:
#
#   * `renzora_native_build::rustc::args` passes the same flag when it compiles
#     a native plugin or a Rust script on the user's machine.
#   * `renzora_export::build::encoded_rustflags` keeps passing it for a lean
#     export, which sets CARGO_ENCODED_RUSTFLAGS and so replaces this file
#     rather than merging with it.
#
# A plugin built without it still imports VCRUNTIME140 and will not load on a
# machine with no redistributable. An installed plugin is compiled by the
# editor's own driver, which passes `+crt-static`, so this only bites a library
# somebody built by hand and dropped in.

# Path scrubbing: panic `Location`s (and debuginfo) embed the source paths of
# the machine that BUILT the binary — without remapping, a shipped release
# shows players absolute paths from the release machine (GH issue #67: a crash
# dialog printing the developer's `C:\Users\<name>\.cargo\registry\...`). The
# prefixes below are the CANONICAL Docker paths (the rust image's
# CARGO_HOME=/usr/local/cargo; the repo mounted at /app/src), so container
# builds ship clean `/cargo/...` + `/renzora/...` paths. On host builds the
# prefixes match nothing and the flags are inert — releases must ship from the
# container anyway. The crash reporter (`renzora_engine::crash`) additionally
# scrubs registry/home prefixes at display time as a backstop for host builds.
# NOTE: rustflags feed cargo's metadata hash, so adding/changing these renames
# `bevy_dylib-<metadata>` and moves the plugin ABI (a one-time full rebuild;
# prebuilt plugins rebuild with the next release as usual — see CLAUDE.md §3).

# Windows: use rust-lld. MSVC link.exe hits LNK1189 (65535-object limit) on
# bevy_dylib with dynamic_linking enabled. `rust-lld` (no .exe) is a special
# value rustc resolves to its bundled lld from the sysroot — works on
# Windows host AND inside the Linux Docker cross-compile, so the container's
# rustflags (xwin lib paths) still merge in correctly.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    # The MSVC runtime, linked in rather than shipped beside the binaries. See
    # the long note above for why Windows not having it is the whole point.
    "-C", "target-feature=+crt-static",
    # crt-static covers everything rustc compiles, and nothing it does not.
    # `intel_tex_2` (the BC/ASTC texture compressor behind `renzora_rmip`) ships
    # its ISPC kernels PREBUILT as `.lib` files checked into the crate, built
    # against the dynamic CRT, and their objects carry `/DEFAULTLIB:msvcprt`, so
    # the linker loaded the import library for msvcp140.dll regardless. That is
    # why renzora_editor.dll alone kept importing it while every other binary
    # came out clean. Declining the directive leaves one symbol unresolved,
    # `std::_Xlength_error`, which `renzora_rmip::bake` defines; the long comment
    # there explains why that is the whole interaction and why linking the static
    # C++ runtime instead is rejected by `/failifmismatch`.
    #
    # A crate that genuinely needed the C++ standard library would fail to link
    # here with an unresolved symbol naming it, which is the failure mode worth
    # having: loud at build time rather than a DLL a user does not have.
    "-C", "link-arg=/NODEFAULTLIB:msvcprt.lib",
    # Statically linking Bevy AND the ~187k lines of editor into one executable
    # produces a debug PDB well past the 4 GiB that the default 4096-byte page
    # size can address (`rust-lld: Output data is larger than 4 GiB`). Raising
    # the page size is the fix lld itself recommends; it costs nothing in the
    # stripped `dist` profile and only matters for dev builds of the editor.
    "-C", "link-arg=/pdbpagesize:16384",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

# Windows ARM64: same reasoning as x86_64 above, one target triple over. This
# triple is NEVER produced by the Docker toolchain — xwin can only redistribute
# the MSVC CRT + SDK, so the C compiler there is clang, and clang can't stand in
# for MSVC on ARM64 (see docker/windows/Dockerfile). It is built natively instead,
# on a `windows-11-arm` runner in .github/workflows/build-engine.yml, which is why
# the section carries no xwin lib paths — the real MSVC toolchain supplies them.
[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    # Both as on x86_64 above, and for the same reasons: `intel_tex_2` ships a
    # prebuilt arm64 archive too (`ispc_texcomp_astcaarch64-pc-windows-msvc.lib`),
    # so this triple has the same `/DEFAULTLIB:msvcprt` to decline.
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/NODEFAULTLIB:msvcprt.lib",
    "-C", "link-arg=/pdbpagesize:16384",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

# macOS: embed @loader_path so the binary finds bevy_dylib, renzora.dylib,
# and any installed plugin next to itself.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

# Linux: mold linker + $ORIGIN rpath so the binary finds bevy_dylib,
# renzora.so, and any installed plugin next to itself.
#
# `-fuse-ld=mold`, never the absolute `/usr/bin/mold`: clang has rejected a path
# in -fuse-ld since 12 ("invalid linker name in argument"), and on a NixOS host
# there is no /usr/bin/mold to name anyway. The name resolves through PATH in
# the container and on the host alike. docker/linux/Dockerfile's cross wrapper
# strips this exact string.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,-rpath,$ORIGIN",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]
