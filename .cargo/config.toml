# Cargo aliases — everything uses dist profile for consistent plugin hashes
[alias]
# Run
# `cargo renzora` is the native (no-Docker) build+stage+run. It routes through
# the `xtask` helper instead of a bare `cargo run`, because a bare run leaves the
# distribution plugin cdylibs flat in target/dist/ where the loader (which scans
# <exe-dir>/plugins/) never finds them. `xtask` compiles the workspace, stages a
# clean dist/<platform>/ exactly like the Docker build-all.sh (bevy_dylib +
# renzora + the editor bundle beside the exe; plugins in plugins/), then launches
# it. `cargo renzora dist` stages without launching. With rust-toolchain.toml
# pinning rustc, this mirrors the container locally on the host platform; Docker
# stays the path for cross-platform/release builds.
#
# `--manifest-path` rather than `-p xtask`: xtask is its own workspace root, not
# a member (it has to build even when a dangling generated dependency stops the
# engine workspace from loading — see xtask/Cargo.toml). The path is relative to
# the current directory, so run `cargo renzora` from the repo root.
renzora = "run --manifest-path xtask/Cargo.toml --"
# ⚠ These two select a SINGLE package, so they resolve `renzora` without its
# `editor` feature and recompile ~86 shared packages against the `--workspace`
# cache (see the note under `dist` below). Fine for an occasional headless
# server run; if you are switching back and forth, build once with `cargo dist`
# and launch `target/dist/renzora.exe` directly instead.
#
# `--no-editor` is gone from `runtime`: it used to suppress loading the editor
# bundle dll, and this binary can no longer become the editor at all.
runtime = "run --profile dist --bin renzora"
# Dedicated server = the runtime binary launched with `--server`.
server = "run --profile dist --bin renzora -- --server"

# Build
#
# `cargo dist` is the everyday one: BOTH executables — `renzora` (the runtime /
# shipped game) and `renzora-editor` — from ONE invocation. Faster than
# `build-all` because it stops at the two binaries instead of also building
# every other workspace target.
#
# ── Why every build alias says `--workspace` ───────────────────────────────
# Cargo resolves features once per invocation, across the packages it selected.
# A `--workspace` build resolves `renzora` WITH its `editor` feature (the editor
# package asks for it); selecting one package alone resolves it WITHOUT. Those
# are different feature sets, so they get different `-C metadata` hashes and
# therefore different `.rlib` filenames — and ~86 shared packages (bevy,
# bevy_ecs, wgpu, glam, …) get compiled a SECOND time. Worse, the two
# invocations then evict each other forever: alternating them recompiles the
# engine every single time.
#
# (Not to be confused with `cargo renzora dist`, which STAGES an already-built
# tree into dist/<platform>/. This one only compiles + links.)
#
# That is exactly what the old `build-runtime = "build --profile dist --bin
# renzora"` alias did — and it wrote to the same `target/dist/renzora.exe` path
# as `build-editor`, so the two silently fought over one output file. It has
# been REMOVED. Building only the runtime is no longer a thing you need: the
# runtime binary produced by `cargo dist` already contains no editor code,
# because `renzora_app` does not depend on any editor crate.
dist = "build --profile dist --workspace --bin renzora --bin renzora-editor"
build-editor = "build --profile dist --workspace"
build-all = "build --profile dist --workspace"
build-plugins = "build --profile dist --workspace"

# WASM (game only — the editor bundle is a desktop dlopen target; no wasm editor)
build-web = "build --profile dist --bin renzora --no-default-features --features wasm --target wasm32-unknown-unknown"

# Android
build-android = "build --profile dist --no-default-features --target aarch64-linux-android"

# iOS
build-ios = "build --profile dist --target aarch64-apple-ios -p renzora-ios"
build-ios-sim = "build --profile dist --target aarch64-apple-ios-sim -p renzora-ios"

# tvOS
build-tvos = "build --profile dist --target aarch64-apple-tvos -p renzora-ios"
build-tvos-sim = "build --profile dist --target aarch64-apple-tvos-sim -p renzora-ios"

# Static link the MSVC runtime (eliminates VCRUNTIME140.dll dependency)
# NOTE: Disabled — crt-static changes crate disambiguators, breaking TypeId
# across dylib boundaries (required for dynamic plugin system).
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "target-feature=+crt-static"]

# Workspace plugin crates are rlib-only and get statically linked into
# the host binary. Distribution plugins and the editor bundle
# (`renzora_editor`) are `cdylib` and get loaded at runtime by
# `dynamic_plugin_loader`. The `prefer-dynamic` flag below applies to crates
# that emit BOTH rlib + dylib — currently bevy (via `bevy/dynamic_linking`)
# and `renzora` (the shared SDK contract, incl. the folded-in post-process and
# editor contracts). `renzora_editor` (the editor framework) is now rlib-only:
# the only types crossing the binary↔bundle boundary live in `renzora.dll`, so
# the framework needs no dylib of its own and the exe never imports a separate
# editor dll. bevy and renzora each ship as a single `.dll`/`.so`/`.dylib` next
# to the host so workspace crates (linked statically) AND dlopen'd plugins/the
# bundle share one compiled copy of the SDK contracts and matching `TypeId`s.

# Path scrubbing: panic `Location`s (and debuginfo) embed the source paths of
# the machine that BUILT the binary — without remapping, a shipped release
# shows players absolute paths from the release machine (GH issue #67: a crash
# dialog printing the developer's `C:\Users\<name>\.cargo\registry\...`). The
# prefixes below are the CANONICAL Docker paths (the rust image's
# CARGO_HOME=/usr/local/cargo; the repo mounted at /app/src), so container
# builds ship clean `/cargo/...` + `/renzora/...` paths. On host builds the
# prefixes match nothing and the flags are inert — releases must ship from the
# container anyway. The crash reporter (`renzora_engine::crash`) additionally
# scrubs registry/home prefixes at display time as a backstop for host builds.
# NOTE: rustflags feed cargo's metadata hash, so adding/changing these renames
# `bevy_dylib-<metadata>` and moves the plugin ABI (a one-time full rebuild;
# prebuilt plugins rebuild with the next release as usual — see CLAUDE.md §3).

# Windows: use rust-lld. MSVC link.exe hits LNK1189 (65535-object limit) on
# bevy_dylib with dynamic_linking enabled. `rust-lld` (no .exe) is a special
# value rustc resolves to its bundled lld from the sysroot — works on
# Windows host AND inside the Linux Docker cross-compile, so the container's
# rustflags (xwin lib paths) still merge in correctly.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
    # Statically linking Bevy AND the ~187k lines of editor into one executable
    # produces a debug PDB well past the 4 GiB that the default 4096-byte page
    # size can address (`rust-lld: Output data is larger than 4 GiB`). Raising
    # the page size is the fix lld itself recommends; it costs nothing in the
    # stripped `dist` profile and only matters for dev builds of the editor.
    "-C", "link-arg=/pdbpagesize:16384",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

# macOS: embed @loader_path so the binary finds bevy_dylib, renzora.dylib,
# and any dlopen'd distribution plugin next to itself.
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]

# Linux: mold linker + $ORIGIN rpath so the binary finds bevy_dylib,
# renzora.so, and any dlopen'd distribution plugin next to itself.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=/usr/bin/mold",
    "-C", "link-arg=-Wl,-rpath,$ORIGIN",
    "--remap-path-prefix=/usr/local/cargo=/cargo",
    "--remap-path-prefix=/app/src=/renzora",
]
