[workspace]
resolver = "2"
# Glob auto-includes every crate under `crates/` so adding a new plugin
# only requires creating its directory — no manual workspace.members
# update. `cargo check -p renzora_<name>` works from the root, and
# `[workspace.lints]` / `[workspace.dependencies]` propagate cleanly.
members = [
    ".",
    # Engine crate + every plugin (`renzora` + `renzora_*`).
    "crates/renzora",
    "crates/renzora_*",
    # Nested editor halves of split dual-mode crates (e.g.
    # `crates/renzora_engine/editor` = `renzora_engine_editor`). The lean
    # runtime crate sits at `crates/renzora_<name>/`; its editor-only code lives
    # in the nested `editor/` subcrate, linked only by the editor bundle. A
    # member glob that matches nothing is a hard error, so this stays valid only
    # while ≥1 `editor/` subcrate exists.
    "crates/renzora_*/editor",
    # NOTE: `xtask` (`cargo renzora`) is deliberately NOT a member — it is its
    # own workspace root. It generates the plugin `path` dependencies, and cargo
    # refuses to load a workspace with a dangling one, so as a member it could
    # not be built to repair the very tree it maintains. See `xtask/Cargo.toml`.
    # Vendored Bevy ecosystem crates. Listed explicitly (not via a
    # `bevy_*` glob) so we don't accidentally pick up `bevy_oxr`, which
    # is its own vendored workspace.
    "crates/bevy_firefly",
    "crates/bevy_gaussian_splatting",
    "crates/bevy_hanabi",
    "crates/bevy_hui",
    "crates/bevy_procedural_tree",
    "crates/bevy_silk",
    "crates/vleue_navigator",
    # vleue_navigator's pathfinding deps, vendored to bump their glam 0.30 → 0.32
    # (bevy 0.19's glam). Upstream polyanya 0.16.1 is the latest and still pins
    # glam 0.30, which would otherwise clash with bevy's glam (two `Vec2` types).
    "crates/polyanya",
    "crates/bvh2d",
]
# Avian comes from crates.io (`avian3d`/`avian2d` 0.7, which target Bevy 0.19),
# not a vendored nested workspace. It was vendored when no release supported
# Bevy 0.19; once 0.7.0 shipped, the fork was a copy to keep in sync for one
# local patch, and that patch now lives in `renzora_physics` instead. Its four
# ecosystem crates (bevy_heavy, bevy_transform_interpolation, glam_matrix_extras,
# avian_derive) went with it — they were members only so avian's path deps
# resolved to them, and a path copy sitting alongside the registry copy the
# published avian pulls would be two distinct types sharing a name.
# `plugins/` holds first-party `renzora_plugin` cdylibs — the C-ABI mechanism,
# not the older dylib one in `crates/renzora_*`. They are deliberately NOT
# workspace members: as members they would inherit the engine's cargo feature
# unification and link Bevy, destroying the zero-dependency property that makes a
# plugin build in a second on any machine. Each is its own cargo project with its
# own lockfile and target dir; `cargo renzora` builds and stages them all, and a
# dev can `cd plugins/<name> && cargo build` directly.
exclude = ["plugins"]
# (The old egui-based `disabled/renzora_vr_editor` was deleted — the VR editor
# is being rebuilt from scratch on the ember/bevy_ui shell. Park any future
# not-yet-compiling crates under `disabled/`, outside the `crates/*` glob.)

# Every crate inherits these via `[lints] workspace = true`, so this table must
# exist even when empty. It previously carried an `unexpected_cfgs` allow for
# `cfg(feature = "dlopen")`: `renzora::add!` emitted that cfg into every calling
# crate, warning in the ones with no such feature. The dlopen FFI path is gone,
# so the allow is no longer needed.
[workspace.lints.rust]

[workspace.dependencies]
# `dynamic_linking` is intentionally NOT in workspace defaults — it pulls
# in `bevy_dylib` (dylib-only), which can't link into iOS staticlib or
# Android cdylib builds. The desktop binary (`renzora_app`) opts in via
# its own `[dependencies]` entry; cargo's feature unification under
# `--workspace` propagates it to plugin crates so they end up with the
# same bevy compilation as the host (and the same `bevy::World` TypeId,
# which `plugin_bevy_hash()` checks at dlopen time). Mobile/wasm builds
# under `cargo build -p <mobile_crate>` only see their own dep tree
# (resolver = "2") and stay clean of dynamic_linking.
# Bevy feature policy — ABI-stability driven (read before touching this list).
# Plugins dlopen against ONE shared `bevy_dylib`; its compiled feature set IS
# the API surface every plugin can reach AND an input to the ABI hash. So we
# enable a deliberately MAXIMAL-but-valid set here, once: "everything a plugin
# could practically want" minus the three things that physically cannot be
# blanket-enabled — (1) mutually-exclusive backends, (2) platform-specific
# features, (3) dev/CI/trace features. Per-target backend choices live in the
# `wasm` feature below and the mobile crates, not here. Widening this set later
# costs an intra-version ABI bump, so we front-load it.
#
# Deliberately OMITTED (each would be an ABI bump to add — do it with eyes open):
#   meshlet, meshlet_processor                    ENABLED below (experimental
#                                                   virtual geometry)
#   (bevy_solari IS enabled below — it backs the renzora_solari plugin.)
#   dlss, force_disable_dlss                      NVIDIA proprietary SDK
#   trace_chrome, detailed_trace, track_location, dev/CI only — OFF (they tax every
#     trace_tracy_memory, bevy_dev_tools,           frame and would skew a profile);
#     bevy_ci_testing, bevy_debug_stepping,         all OFF — `trace_tracy` too
#     bevy_ui_debug, debug, *glam_assert,           (see `plugins/tracy`).
#     embedded_watcher, hotpatching, schedule_data
#   zstd_c, reflect_auto_register_static,         superseded by the chosen
#     default_no_std / critical-section / libm / web   std + zstd_rust variants
#   statically-linked-dxc, spirv_shader_passthrough, raw_vulkan_init   per-backend
#   webgl2/webgpu/x11/wayland/android-*/accesskit_unix   per-target (see wasm/mobile)
#   ghost_nodes                                   REMOVED 2026-07: it was enabled
#     but `GhostNode` is used exactly zero times in the workspace, and the feature
#     is not free to leave on. It swaps `bevy_ui`'s `UiChildren` for a much slower
#     implementation on the editor's hottest path: `is_changed()` — called once per
#     UI node per frame by `update_children_recursively` — short-circuits only when
#     a node's children actually changed, so in steady state every node falls
#     through to `iter_ghost_nodes()`, which returns a `Box<dyn Iterator>`, i.e. ONE
#     HEAP ALLOCATION PER UI NODE PER FRAME. `iter_ui_children` likewise builds and
#     reverses a `SmallVec<[Entity; 8]>` (heap-allocating for any node with >8
#     children — dock lists, hierarchy rows and asset grids all exceed that) where
#     the non-ghost path returns a plain slice iterator. With ~5k UI entities that
#     is the dominant term in `ui_layout_system`.
#     Re-adding it is an ABI bump AND a perf regression — only do so if something
#     genuinely needs to park a non-UI entity mid-hierarchy, and measure first.
#     NOTE the two impls are NOT equivalent beyond cost: the ghost `iter_ui_children`
#     filters children to `Or<(With<Node>, With<GhostNode>)>`, the non-ghost one
#     yields the raw `Children` slice unfiltered. That is safe here only because
#     every `bevy_ui` consumer (stack, update, ui_surface, layout, accessibility)
#     re-filters on `&Node` itself, and because ghost traversal always required the
#     explicit `GhostNode` marker — a bare component-less child was never traversed
#     under either setting.
#
# SOURCE: Bevy 0.19 is published on crates.io. The `bevy` umbrella pulls its
# sub-crates as matching 0.19.x registry deps, so the tree stays internally
# consistent — one Bevy across the dlopen boundary.
bevy = { version = "0.19", default-features = false, features = [
    # ── The `2d` / `3d` / `ui` metas, EXPANDED LEAF BY LEAF ──────────────────
    # Bevy's default is the four metas `2d, 3d, ui, audio`. We take
    # `default-features = false` and re-add all but `audio` — Renzora's audio is
    # its own (`plugins/audio`), so `bevy_audio` (and its rodio/cpal/symphonia
    # stack) is never used anywhere in the engine.
    #
    # The other three are written out leaf by leaf instead of named, because
    # **a meta-feature cannot be partially stripped.** The lean exporter shrinks a
    # game by deleting feature strings from this list, so anything reachable only
    # through `3d` survives every attempt to remove it. That was not theoretical:
    # `capabilities.rs`'s `render_3d` listed `bevy_pbr` for removal while `3d` sat
    # here re-enabling it, so the toggle did nothing at all. Three more crates
    # arrived the same way through `default_platform` — which `2d`, `3d` AND `ui`
    # each pull in — and shipped in every exported game despite the notes below
    # claiming they had been dropped as unused: `sysinfo_plugin` (→ sysinfo),
    # `bevy_gilrs` (→ gilrs, gilrs-core) and `bevy_clipboard` (→ arboard).
    #
    # This set is the exact union of `2d + 3d + ui` for Bevy 0.19.0, verified by
    # diffing the resolved feature list either side of the expansion. Keep it
    # exact: on a Bevy bump, re-derive it from that release's `Cargo.toml` — the
    # `2d`/`3d`/`ui` entries and the `default_app`, `default_platform`,
    # `common_api`, `*_api`, `*_bevy_render`, `scene` and `picking` groups they
    # expand into. Five members (`bevy_light`, `hdr`, `morph`, `morph_animation`,
    # `bevy_post_process`) are NOT repeated here — they already appear below with
    # their own notes, and a duplicate would survive the exporter deleting one.
    #
    # `default_app` — app scaffolding; all three metas need it.
    "async_executor", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    # `default_platform` — windowing and OS integration. `x11`/`wayland` are
    # Linux-only and `webgl2` wasm-only: inert on other targets, but dropping them
    # would leave those platforms with no windowing backend, so they stay. The
    # last four are the strippable ones and now have capabilities.
    "std", "bevy_winit", "multi_threaded", "custom_cursor",
    "webgl2", "x11", "wayland",
    "bevy_gilrs", "bevy_clipboard", "default_font", "sysinfo_plugin",
    # `gamepad` listed SEPARATELY from `bevy_gilrs`, which is the only thing that
    # would otherwise enable it. The two are different layers: `gamepad` is
    # `bevy_input`'s ECS surface (`GamepadButton`, `GamepadAxis`, the events),
    # used by six runtime crates — renzora, renzora_engine, renzora_gamepad,
    # renzora_input, renzora_scripting, renzora_settings — while `bevy_gilrs` is
    # the OS backend that feeds it. Naming it here is what lets the Gamepad
    # capability drop the backend without deleting the types those crates
    # compile against; a game built that way simply never sees a pad connect.
    "gamepad",
    # `scene` + `picking`
    "bevy_scene", "bevy_world_serialization",
    "bevy_picking", "mesh_picking", "sprite_picking", "ui_picking",
    # `common_api` — the part 2d, 3d and ui share.
    "bevy_animation", "bevy_camera", "bevy_color", "bevy_gizmos", "bevy_image",
    "bevy_mesh", "bevy_shader", "bevy_material", "bevy_text", "bevy_window", "png",
    # Render stack shared by all three.
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render",
    # `2d` proper.
    "bevy_sprite", "bevy_sprite_render",
    # `3d` proper. `bevy_light` (listed further down) does NOT depend on bevy_pbr,
    # which is what lets a 2D export keep lights and atmosphere after the rest of
    # this group goes.
    "bevy_pbr", "bevy_gltf", "gltf_animation", "bevy_mikktspace",
    "bevy_anti_alias", "ktx2", "zstd_rust", "smaa_luts", "tonemapping_luts",
    "bevy_light",
    # `ui` proper.
    "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "bevy_input_focus",
    "serialize",
    # extra engine subsystems
    # (bevy_remote / BRP deliberately omitted — nothing in the editor or the
    # exported game uses the Bevy Remote Protocol, and it was the sole puller of
    # bevy_dev_tools, which would otherwise re-introduce bevy_pbr into a 2D build.)
    #
    # DROPPED (2026-07 slim pass) — each had ZERO references in the workspace, and
    # the "a plugin might want it" argument that justified them is going away with
    # the C-ABI extension interface (plugins won't link bevy at all):
    #   bevy_feathers            Renzora's UI is `renzora_ember`. The only mention
    #                              left is a colour constant copied by hand in
    #                              `renzora_grid/src/infinite_grid.rs`.
    #   bevy_settings            unused.
    #   sysinfo_plugin           NOT actually dropped — see the expansion above.
    #     Removing it from this list achieved nothing, because `default_platform`
    #     (reached from `2d`/`3d`/`ui`) turned it straight back on, so `sysinfo`
    #     shipped in every export for a year. It is now named explicitly above and
    #     stripped by the `diagnostics` capability. Same story for `bevy_gilrs`
    #     and `bevy_clipboard`. Treat this whole list with suspicion: "not
    #     mentioned here" never meant "not compiled".
    #   bevy_camera_controller   unused — the editor has its own camera rig
    #     free_camera, pan_camera  (`renzora_camera`).
    #   reflect_functions        unused.
    # `reflect_documentation` is KEPT pending a check on whether inspector
    # tooltips read reflected doc strings.
    "reflect_documentation",
    # Shader languages: WGSL only. There are 186 `.wgsl` files in the tree and
    # ZERO `.glsl`/`.vert`/`.frag`/`.spv`/`.wesl`, so `shader_format_glsl`,
    # `shader_format_spirv` and `shader_format_wesl` were all dead weight —
    # each pulls its own translation stack (naga backends) into every build.
    # Image formats — ONLY the ones `renzora_import` actually sniffs/handles.
    # Dropped `ff`, `ico`, `pnm`, `qoi`, `tiff`: no importer path recognises those
    # extensions, so the codec could never be reached. Everything below IS reached
    # (see `renzora_import/{gltf_pass,fbx_ufbx,obj}.rs` + the asset browser), so do
    # not trim this list further without re-checking those sniffers — a
    # stripped codec means the importer accepts a file the engine then can't decode.
    # NOTE: `capabilities.rs` groups gif/bmp/tga as strippable `image_extra`; that
    # is correct for a LEAN EXPORT (a shipped game with no such assets) but not for
    # this base build, which is also the editor.
    "bmp", "dds", "exr", "gif", "hdr", "jpeg", "tga",
    "webp", "zlib",
    # `basis-universal` is NOT here — it lives in `renzora_app`'s
    # `cfg(not(target_arch = "wasm32"))` dependency block, because it cannot
    # build for the web. See the note there.
    # (audio formats intentionally dropped — decoding lives in the audio plugin)
    # (`compressed_image_saver` + `asset_processor` dropped below — unused.)
    # PBR / rendering detail — the texture-slot features below are all live in the
    # material system (`renzora_material`): transmission, clearcoat/multi-layer,
    # anisotropy and specular maps each have inspector fields and importer paths.
    # DROPPED: `pbr_clustered_decals`, `pbr_light_textures`, `experimental_pbr_pcss`
    # — zero references outside `capabilities.rs`'s strip list.
    # The four optional PBR texture sets are NOT here — they live in
    # `renzora_app`'s `cfg(not(target_arch = "wasm32"))` block, because together
    # they blow WebGPU's per-stage sampler limit. See the note there.
    # `morph`/`morph_animation` KEPT pending a check on whether the GLTF/FBX
    # importers pass blend shapes through — no code names `MorphWeights`, but the
    # feature gates an import capability, not an API surface.
    "morph", "morph_animation",
    # LUT/data features — NOT code-referenced by design; they gate embedded data
    # bevy_pbr samples at runtime, so grep can never justify them. `bluenoise_texture`
    # backs `crates/renzora_bluenoise`; `area_light_luts` interacts with the deferred
    # bind-group layout (see `renzora_engine/src/scene_io.rs`); `dfg_lut` is the
    # specular BRDF table and changes PBR output if removed.
    "bluenoise_texture", "dfg_lut", "area_light_luts",
    # Experimental hardware-raytraced lighting — backs the `renzora_solari`
    # distribution plugin (Bevy's `SolariPlugins`). Enabling it recompiles
    # `bevy_dylib` and MOVES the plugin ABI hash (CLAUDE.md §3): every existing
    # distribution plugin must be rebuilt, and the pinned hash must be re-pinned
    # after the next container build.
    "bevy_solari",
    # built-in post-process effect stack (vignette, lens distortion, chromatic aberration)
    "bevy_post_process",
    # clipboard / fonts / ui — `system_clipboard` and `clipboard_image` are NOT
    # here; they reach for `arboard`, which is desktop-only. Same wasm exclusion
    # as `basis-universal` / `file_watcher`; see `renzora_app`'s target block.
    "system_font_discovery",
    # asset IO / processing
    # DROPPED: `asset_processor` + `compressed_image_saver` (Bevy's offline asset
    # pipeline — Renzora has its own `.rmip` texture pipeline and never enabled
    # Bevy's processor at runtime) and `web_asset_cache` (nothing reads it).
    # DROPPED: `http`/`https` (Bevy's URL asset source). They were kept "for the
    # editor (marketplace/asset browsing)", but nothing ever loaded an asset by
    # URL through `AssetServer` — the marketplace, thumbnails, sign-in and the
    # update check all went through the engine's own client, and that client is
    # now `plugins/http` behind the `renzora_net` boundary. Keeping these was
    # therefore paying `bevy_asset`'s `ureq` + rustls/ring/webpki-roots (~20
    # packages) for a code path with no callers. The `remote_assets` capability
    # is retained in `renzora_export` so a game that DOES want URL assets can
    # turn them back on.
    # `file_watcher` KEPT pending a similar check: the theme/shader hot-reload
    # uses its own mtime polling, so Bevy's watcher may be unused. It is NOT
    # here either — same wasm-only exclusion as `basis-universal` above.
    # NOTE: `trace_tracy` is deliberately NOT enabled. Bevy installs its Tracy
    # tracing layer inside `LogPlugin` at boot whenever that feature is compiled
    # in, with no runtime off-switch — so it would arm Tracy on every launch and
    # grow RAM until a profiler connects, regardless of any in-app toggle. Tracy
    # is instead opt-in via the `plugins/tracy` C-ABI plugin (frame marks +
    # diagnostic plots, started only on its toggle). Per-system CPU zones need a
    # dedicated profiling build that re-adds `trace_tracy` — which MOVES the ABI
    # hash (CLAUDE.md §3) and so is kept out of the normal build.
    # DROPPED: `meshlet` + `meshlet_processor` (experimental virtual geometry).
    # Nothing in the workspace referenced them, and `meshlet_processor` was the
    # sole consumer of `metis-sys`, whose vendored C is the only reason
    # `docker/windows/Dockerfile` carries a cross-compile workaround — that hack
    # can go with it.
] }
# Individual Bevy sub-crates that some vendored ecosystem crates depend on
# directly (not via the `bevy` umbrella). Same 0.19 line as `bevy` above so they
# resolve to the one 0.19.x release — preserving a single Bevy across the dlopen
# boundary.
bevy_math = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false }
bevy_light = { version = "0.19", default-features = false }
bevy_picking = { version = "0.19", default-features = false }
log = "0.4"

[package]
name = "renzora_app"
version = "0.2.0"
edition = "2021"
default-run = "renzora"

[[bin]]
name = "renzora"
path = "src/main.rs"

[features]
# `dynamic_linking` is in the DEFAULT set so every ordinary build — the editor,
# `cargo renzora`, `cargo check`, the `--workspace` dist builds, the dedicated
# server — links the shared `bevy_dylib`/`renzora` dylib and keeps the one frozen
# plugin ABI (`plugin_bevy_hash`). It is a *feature* rather than an inline dep
# flag so the lean release exporter can drop it with `--no-default-features
# --features runtime`, producing a fully static single binary (static Bevy +
# static std, no dylibs) — see `crates/renzora_export` and `[profile.dist-lean]`.
# Dropping it does NOT move the dev/editor ABI: the default build is unchanged.
default = ["runtime", "xr"]
# One binary, always runtime-shaped. The editor is no longer a compile-time
# feature: it ships as the `renzora_editor` cdylib loaded at startup
# from beside the exe (Operation Merge). Present → the binary is the editor;
# absent → the same binary is the exported game. The runtime binary is also
# the dedicated server (launch with `--server` to boot headless) and the
# host/listen server (`--host`). No separate editor/server feature or binary.
runtime = ["dep:renzora_runtime"]
# Shared-`bevy_dylib` dynamic linking. ON by default (above); the lean exporter
# turns it OFF for a static release binary. Mobile/wasm lanes never enable it
# (they build via `--no-default-features --features <wasm|…>` or their own
# crates), so `bevy_dylib` — a dylib-only crate that can't link into an iOS
# staticlib / Android cdylib / wasm — correctly stays out of those builds.
dynamic_linking = ["bevy/dynamic_linking"]
# OpenXR/VR boot mode: launching with `--vr` renders the game into a headset
# (see `renzora_runtime::add_xr_rendering` / `renzora_xr`). In `default` so
# every desktop build can be a VR runtime; the wasm/mobile lanes never enable
# it, and the lean exporter's `--no-default-features --features runtime` drops
# it unless a game opts back in.
xr = ["renzora_runtime?/xr"]
# Link the game's C-ABI plugins INTO the binary instead of loading them from
# `plugins/` beside it. Set only by the lean exporter, and only in its throwaway
# copy of the workspace, where it also fills in the otherwise-empty
# `renzora_static_plugins` crate. A dev-tree build with this on links nothing
# extra — the checked-in crate returns an empty list — so turning it on by hand
# is harmless and pointless. See `renzora_plugin::static_link`.
static_plugins = ["dep:renzora_static_plugins"]
# Throwaway PROFILING build — re-adds Bevy's Tracy instrumentation for a full
# flame graph + per-system Statistics in Tracy. `bevy/trace` turns on the
# per-system and render-node CPU spans (bevy_ecs gates system zones behind it, so
# WITHOUT this the 200-plugin system breakdown is invisible); `bevy/trace_tracy`
# installs the Tracy layer (CPU zones + one frame mark/frame) and the GPU-timestamp
# zones in bevy_render; `renzora_runtime`'s matching feature adds
# `RenderDiagnosticsPlugin` so those GPU zones actually record. Build+run it with
# `cargo renzora --features profiling` (native) or `renzora run -- --features profiling`.
#
# DELIBERATELY out of `default`: compiling `trace_tracy` recompiles `bevy_dylib`
# and MOVES the plugin ABI (CLAUDE.md §3), so prebuilt community plugins in
# `plugins/` won't load against a profiling binary — everything built from source
# in the same invocation (the editor bundle + all workspace plugins) still matches.
# Keep the in-app "Tracy Profiler" toggle (Settings → Plugins) OFF in this build:
# Bevy already frame-marks, and the `plugins/tracy` bridge marking too would
# double-count every frame.
profiling = ["bevy/trace", "bevy/trace_tracy", "renzora_runtime?/profiling"]
wasm = [
    "runtime",
    "bevy/webgpu",
    "bevy/bevy_asset",
    "bevy/bevy_window",
    "bevy/bevy_winit",
    "bevy/bevy_state",
    "bevy/bevy_log",
    "bevy/bevy_input_focus",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_gltf",
    "bevy/bevy_scene",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_text",
    "bevy/bevy_picking",
    "bevy/jpeg",
    "bevy/multi_threaded",
    "bevy/async_executor",
]

[dependencies]
# `dynamic_linking` is pulled by the `dynamic_linking` feature (in `default`),
# NOT pinned here — so it can be dropped for a static lean build via
# `--no-default-features`. Feature unification under `--workspace` still
# propagates the default-on feature to every plugin crate's bevy dep, so they
# share one `bevy_dylib` instance and matching TypeIds. Mobile builds
# (`-p renzora-ios` / `-p renzora-android`) don't see this dep and compile bevy
# without dynamic_linking — bevy_dylib stays out of their staticlib/cdylib link.
bevy = { workspace = true }

# Single shared library — `editor` feature on this crate adds editor extras.
renzora_runtime = { path = "crates/renzora_runtime", optional = true }
uuid = "1"

# Misc
# C-ABI plugin host. One crate for both sides of the boundary: a plugin depends
# on `renzora_plugin` with default features and gets zero deps; the engine opts
# into `host` for the interface impl, dispatcher and dlopen loader.
renzora_plugin = { path = "crates/renzora_plugin", features = ["host"] }
# The generated list of plugins linked into the binary. Optional because it is
# empty (and so pure overhead) in every build but a lean export that asked for
# static plugins — see the `static_plugins` feature above.
renzora_static_plugins = { path = "crates/renzora_static_plugins", optional = true }
# Render half of the plugin ABI — installs plugin-registered render passes.
renzora_postprocess = { path = "crates/renzora_postprocess" }
toml = "0.8"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

# ── Bevy features the web cannot have ────────────────────────────────────────
# Held here, target-gated, rather than in `[workspace.dependencies].bevy`, so
# that the wasm lane simply never turns them on. Feature unification still
# spreads both to every crate's `bevy` dep on desktop — this is a subtraction
# for ONE target, not an opt-in for the rest, and desktop behaviour is unchanged.
#
#   file_watcher     Bevy refuses it outright: `compile_error!("The
#                    \"file_watcher\" feature for hot reloading does not work on
#                    Wasm.")`. Nothing is lost — the theme/shader hot-reload uses
#                    its own mtime polling.
#   basis-universal  Builds a vendored C++ transcoder through `cc`. Targeting
#                    wasm32-unknown-unknown there is no libc sysroot, so clang
#                    dies on `'stdlib.h' file not found`. (Web basis support
#                    would mean an emscripten target, not a feature flag.)
#   system_clipboard Pulls `arboard`, which has no web backend — `bevy_clipboard`
#   clipboard_image  fails to compile without it. Browser clipboard access is an
#                    async permissions-gated web API; it would be a separate
#                    implementation, not this feature.
#   pbr_transmission_textures        Together these add roughly eight
#   pbr_multi_layer_material_textures  texture+sampler pairs to the PBR bind
#   pbr_anisotropy_texture             group, which took the fragment stage to
#   pbr_specular_textures              20 samplers against WebGPU's per-stage
#                    limit of 16. The result was not a degraded material but no
#                    3D at all: `pbr_opaque_mesh_pipeline` failed to create, so
#                    `main_opaque_pass_3d` produced an invalid command buffer
#                    every single frame. The web build therefore trades
#                    transmission, clearcoat, anisotropy and specular MAPS for
#                    being able to render. The underlying material properties
#                    still work — it is the per-pixel textures that are gone.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = [
    "file_watcher",
    "basis-universal",
    "system_clipboard",
    "clipboard_image",
    "pbr_transmission_textures",
    "pbr_multi_layer_material_textures",
    "pbr_anisotropy_texture",
    "pbr_specular_textures",
] }

# WASM support: getrandom needs JS backend on wasm32 targets.
# getrandom has no default backend for wasm32-unknown-unknown — it `compile_error!`s
# unless the JS backend feature is on. Nothing here calls getrandom directly; these
# are feature-unification handles, one per major version present in the graph, so
# whichever transitive dep pulls a given major gets a backend. All three majors are
# live at once: 0.2 and 0.3 from older corners of bevy/wgpu's tree, and 0.4 via
# `rand` 0.10 (bevy_math) and `uuid` 1.23. The 0.4 handle is the one that was
# missing, and its absence is what broke the CI wasm lane — nothing in the tree
# changed shape, a dependency simply crossed a major boundary. Expect to add a
# 0.5 line here the next time one does.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.108"

[build-dependencies]
winres = "0.1"

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
# NO LTO here — measured, not assumed. Enabling `lto = "thin"` on this profile
# made both binaries BIGGER and the build slower:
#
#   renzora.exe         170 MB -> 174 MB
#   renzora-editor.exe  238 MB -> 243 MB
#
# At `opt-level = 2` thin LTO's dominant effect is cross-crate *inlining*, which
# is not size-constrained, and the duplicated inlined bodies outweigh whatever
# dead-stripping removes. LTO only pays for itself on size when paired with
# `opt-level = "s"` — which is exactly what `[profile.dist-lean]` does, and why
# that profile is the right home for size work.
#
# (The historical reason this profile was frozen — its lto/codegen-units feeding
# `bevy_dylib-<metadata>` and therefore the plugin ABI hash — no longer applies;
# there is no shared dylib. It is free to change. It just should not change to
# this.)

# Lean release profile for the single-binary game export. Kept SEPARATE from
# `dist` on purpose: `dist`'s lto/codegen-units feed the frozen plugin ABI hash,
# so they must not change. `dist-lean` is only ever invoked by the lean exporter
# (`--no-default-features --features runtime`, i.e. static Bevy + static std),
# where there is no dylib boundary or ABI to preserve — so we maximise size
# reduction: thin LTO to dead-strip unreachable engine code, size-opt, and full
# symbol strip.
#
# `thin` not `fat` LTO: fat LTO merges the whole program into one giant link unit,
# which on a graph this size made `rust-lld` fail to link the `renzora` dylib;
# thin LTO keeps per-module units (robust + much faster) while still giving most
# of the size win.
#
# NOT `panic = "abort"`: the `renzora` crate is `dylib`+`rlib`, and the dylib
# artifact links the precompiled std's `panic_unwind` runtime, which can't be
# mixed with an `abort` strategy on stable Rust (it would need `-Z build-std` to
# rebuild std). So we keep the default `unwind`; the lost unwind-table savings
# are small next to LTO + strip.
#
# `codegen-units` is left at `dist`'s default (16) — forcing 1 only helped fat
# LTO and slows the build a lot for little size gain under thin LTO.
#
# `panic`, `opt-level` and `codegen-units` are the three keys the exporter may
# override PER EXPORT, by patching them into its disposable copy of this manifest
# (`renzora_export::build::patch_lean_profile`, driven by the Features tab's
# Panic unwinding / Loop vectorization / Parallel code generation toggles). The
# values here are what an export gets with all three left at their defaults, so
# changing one changes every default export — which is the point, but do it on a
# measurement, not a hunch. Nothing patches the profile in THIS tree.
[profile.dist-lean]
inherits = "dist"
lto = "thin"
opt-level = "s"
strip = "symbols"


[lints]
workspace = true
