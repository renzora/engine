[workspace]

[package]
name = "audio"
version = "0.1.0"
edition = "2021"
description = "The Renzora audio engine. Implements the engine's audio-backend contract."

# The lean exporter reads this before it links anything in. Each entry is matched
# as a substring of the Rust target triple.
#
# This crate's `renzora_plugin_init` is behind `#[cfg(not(target_arch =
# "wasm32"))]` — the backend is built on cpal, whose wasm hosts cannot capture,
# so the web is waiting on a WebAudio backend implementing the same contract.
# Without this key a web export links the plugin anyway and dies inside the
# GENERATED aggregator, minutes into the compile, with `cannot find value
# renzora_plugin_init in crate audio` and nothing pointing at the cause.
[package.metadata.renzora]
unsupported-targets = ["wasm32"]

[lib]
# `rlib` alongside `cdylib` so the core is unit-testable without going through
# the C ABI. The DSP is the half of this crate that can be wrong in ways a
# smoke test never catches, so it has to be reachable from `cargo test`.
crate-type = ["cdylib", "rlib"]

[features]
# Ogg Vorbis and WAV, which is what a game project actually ships: Vorbis for
# everything compressed, WAV for the short uncompressed one-shots. MP3 and FLAC
# are opt-in because most projects carry neither, and this is the first time
# that has been a choice — kira's format features were enabled engine-wide, so
# every game paid for every decoder whether or not it had one of those files.
default = ["ogg", "wav", "mp3"]
ogg = ["symphonia/ogg", "symphonia/vorbis"]
wav = ["symphonia/wav", "symphonia/pcm"]
mp3 = ["symphonia/mp3"]
flac = ["symphonia/flac"]

[dependencies]
# The boundary. `audio` brings the `Backend` trait, the request/reply vocabulary
# and the one `Interface` entry a backend registers through — and nothing else:
# this crate still links no Bevy and no engine.
renzora_plugin = { path = "../../crates/renzora_plugin", features = ["audio"] }

# `default-features = false` matters more than usual here: symphonia's default
# turns on mkv, adpcm, flac and more, which is most of what the feature list
# above exists to avoid.
symphonia = { version = "0.5", default-features = false }

# Native only. cpal's wasm hosts implement output but leave `build_input_stream_raw`
# as a `// TODO` returning an error, so a browser build gets a WebAudio backend
# instead of this one — which is the whole reason the mixer above is ours rather
# than a library's. `rtrb` is the SPSC ring the host thread posts commands through;
# see `device.rs` for why a mutex is not an option.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.17"
rtrb = "0.3"

[dev-dependencies]

[profile.dist]
inherits = "release"
opt-level = 3
strip = "symbols"
