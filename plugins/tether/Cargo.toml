[workspace]

[package]
name = "tether"
version = "0.1.0"
edition = "2021"
description = "Snaps drifting entities home. Demonstrates inserting a HOST component through Commands."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
