# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependency below exists so rust-analyzer can
# resolve `renzora::` while you author; the real build is `cargo renzora`.
[workspace]

[package]
name = "procedural_tree"
version = "0.1.0"
edition = "2021"
description = "Procedurally generated 3D trees — seeded branch/leaf meshes that sway in the world wind."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
renzora = { path = "../../crates/renzora" }
# The generator's RNG. Plain Rust with no Bevy anywhere in its graph, so the
# native-plugin dep resolver builds it with cargo into a private rlib and hands
# it to the plugin's `rustc` as an extra `--extern`. A duplicate copy costs
# nothing: `fastrand` holds no process-global state the engine also owns.
fastrand = "2.3"

# No `serde` entry: `renzora::serde` is the engine's copy, and a private one
# would be a different trait from the one Bevy's `Vec3` implements. Every derive
# under `src/tree/` carries `#[serde(crate = "renzora::serde")]` to match.
