[workspace]

[package]
name = "crt"
version = "0.1.0"
edition = "2021"
description = "CRT screen effect — scanlines, curvature, chromatic fringing and vignette."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
