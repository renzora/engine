[workspace]

[package]
name = "drift"
version = "0.1.0"
edition = "2021"
description = "Hot-reload probe you can see: change the motion constants, rebuild, watch entities change course without restarting."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
