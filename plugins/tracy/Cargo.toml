# Declares its OWN workspace root. Without it cargo walks up, finds the engine's
# Cargo.toml and uses that workspace's target dir and profiles — even though
# `plugins` is in its `exclude` list, which only stops membership.
[workspace]

[package]
name = "tracy"
version = "0.1.0"
edition = "2021"
description = "Stream the engine's diagnostics to a running Tracy profiler."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }
# The Tracy protocol client. NOT `no_std`: this opens a socket and spawns Tracy's
# own worker thread, so std is not optional here the way it is for a
# post-process effect.
#
# `ondemand` is the feature that makes a dormant profiler free — without it the
# client accumulates trace data from startup whether or not anyone ever
# connects, which is what made Tracy expensive to leave compiled in. With it,
# nothing is buffered until a profiler attaches.
#
# `default-features = false` drops `enable`'s siblings we do not use (call-stack
# sampling, system tracing) — each costs a background thread and, on Windows,
# elevated-privilege probing at startup.
tracy-client = { version = "0.18", default-features = false, features = ["enable", "ondemand"] }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
