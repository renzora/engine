[workspace]

[package]
name = "hair"
version = "0.1.0"
edition = "2021"
description = "Procedural hair groom: scatter strands over a mesh, verlet-simulate them, rebuild camera-facing ribbons each frame."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
