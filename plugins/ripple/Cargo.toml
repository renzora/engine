[workspace]

[package]
name = "ripple"
version = "0.1.0"
edition = "2021"
description = "A custom shaded material driven by a plugin component, over a texture the plugin generates each frame."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin", default-features = false, features = ["libm"] }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
# no_std cannot unwind on stable.
panic = "abort"
