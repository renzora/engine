# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependency below exists so rust-analyzer can
# resolve `renzora::` while you author; the real build is `cargo renzora`.
[workspace]

[package]
name = "text3d"
version = "0.1.0"
edition = "2021"
description = "3D text — crisp SDF quads, or real triangulated glyph geometry, optionally extruded."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
# Also the source of `renzora::text_mesh` — the SDF glyph packing and the
# `SdfTextMaterial` this shares with `renzora_ember`'s world-space UI emitter.
# It has to be the SHARED copy, or the two would register two materials.
renzora = { path = "../../crates/renzora" }
# Mesh mode: read glyph outlines from the font and triangulate the fill, with
# holes. Both are plain Rust with no Bevy in their graph, so the native-plugin
# dep resolver builds them with cargo into private rlibs and hands them to this
# plugin's `rustc` as extra `--extern`s.
ttf-parser = "0.25"
lyon_tessellation = "1.0"
