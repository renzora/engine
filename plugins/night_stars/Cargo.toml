# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependency below exists so rust-analyzer can
# resolve `renzora::` while you author; the real build is `cargo renzora`.
[workspace]

[package]
name = "night_stars"
version = "0.1.0"
edition = "2021"
description = "Night stars — a procedural starfield on a sky dome, faded by sun elevation."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
renzora = { path = "../../crates/renzora" }

# No `renzora_lighting`: `Sun` moved to the contract crate, which is the only
# thing this needed from it. No `serde` either — `NightStarsData` moved too.
