# Build settings for standalone C-ABI plugins.
#
# Cargo discovers config by walking UP from the working directory and does not
# stop at a workspace root, so a plugin built in `plugins/<name>/` inherits the
# engine's `.cargo/config.toml` even though it declares `[workspace]` and is a
# separate workspace. That inheritance is actively harmful here, and this file
# exists to cut it off.
#
# Note that `rustflags` arrays are **merged** across config files, not replaced —
# the nearer file's entries are appended after the further one's. So a flag
# cannot be removed from here, only overridden by a later entry that contradicts
# it. That is why `prefer-dynamic` is switched off with an explicit `=no` rather
# than by omitting it: omitting it changes nothing at all.
#
# ## Why `prefer-dynamic` must not reach a plugin
#
# The engine sets it so `bevy_dylib` and `renzora` are shared between the
# executable, the editor bundle, and dlopen'd distribution plugins. A standalone
# plugin links none of those — but the flag also makes it link **std**
# dynamically, and Cargo names that library `std-<metadata>.dll`, where the
# metadata hashes the toolchain. The plugin's import table then names one exact
# std build.
#
# That silently destroys the entire premise. A standalone plugin is supposed to
# be buildable with any rustc on any machine precisely because it imports
# nothing from the host — the interface is passed *in* as a function table. An
# inherited `prefer-dynamic` re-introduces a toolchain-versioned import under a
# hashed filename, which is the same trap as `bevy_dylib-<metadata>` and fails
# the same way: the OS loader rejects the library before a single line of
# Renzora code runs, with no diagnostic pointing at the cause.
#
# It is easy to miss because it works fine right up until it doesn't. Build a
# plugin in this checkout with the pinned toolchain and the matching std dll is
# already staged beside the exe, so it loads. Build it with any other rustc — or
# hand the .dll to someone running a different editor release — and it stops
# loading, for a reason nothing in the plugin points to.
#
# ## Why `crt-static`
#
# The engine cannot use it: it changes crate disambiguators, which moves the
# `TypeId`s that the shared-dylib plugin ABI depends on. A standalone plugin
# shares no types with anyone — the boundary is `#[repr(C)]` structs and function
# pointers — so nothing there applies, and static linking the MSVC runtime drops
# VCRUNTIME140.dll and the api-ms-win-crt-* set from the import table. What is
# left is the OS itself, which is the goal: the import table should hold nothing
# that can be the wrong version.

[target.x86_64-pc-windows-msvc]
# rust-lld is kept from the engine config. link.exe's 65535-export cap is not a
# concern at this size, but rust-lld is what the toolchain is set up around and
# is the one that is definitely present.
linker = "rust-lld"
rustflags = ["-C", "prefer-dynamic=no", "-C", "target-feature=+crt-static"]

# The Unix targets keep their linker settings from the engine config (mold,
# rpath) — those are harmless for a plugin — and only switch off the dynamic
# std. `crt-static` is Windows-specific and has no equivalent here; glibc is
# already a stable system ABI in the way VCRUNTIME140.dll is not.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "prefer-dynamic=no"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "prefer-dynamic=no"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "prefer-dynamic=no"]
