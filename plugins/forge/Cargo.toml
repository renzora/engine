[workspace]

[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Spawns a ring of tori. Demonstrates the Torus primitive and spawning renderable entities from a query."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
