# The C-ABI `plugins/grayscale`, rewritten as a native plugin.
#
# Both do the same thing and both live in `plugins/`. The difference is what
# they can reach: this one uses Bevy's real types and Renzora's real
# `PostProcessEffect` trait, while the C-ABI one declares its effect through a
# `#[repr(C)]` descriptor and links no Bevy at all.
#
# The C-ABI version is NOT obsolete and this does not replace it. That one is
# ~52 KB, loads into any engine build regardless of how it was compiled, and can
# be linked INTO a lean export — none of which this can do. This one gets the
# real trait, the inspector derive, and ordinary Bevy asset loading. Different
# trades, both worth having.
#
# ⚠ Do NOT run `cargo build` here — see plugins/hello-native/Cargo.toml for why.
[workspace]

[package]
name = "native_grayscale"
version = "0.1.0"
edition = "2021"
description = "Grayscale post-process, as a native plugin."

[lib]
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
renzora = { path = "../../crates/renzora" }
