# Native plugin: an ordinary Bevy plugin shipped as source and compiled against
# the staged SDK on the machine that installs it.
#
# ⚠ Do NOT run `cargo build` here. `plugins/` is outside the engine workspace, so
# cargo would resolve a SECOND Bevy from crates.io and the plugin that came out
# would have different `TypeId`s from the engine — it would load, run, and
# corrupt the World. The path dependency below exists so rust-analyzer can
# resolve `renzora::` while you author; the real build is `cargo renzora`.
[workspace]

[package]
name = "pool_water"
version = "0.1.0"
edition = "2021"
description = "Pool water — refraction, caustics and a rippling height simulation."

[lib]
# `dylib` is what makes this a NATIVE plugin: it shares Rust types with the host.
# `cdylib` would be the C ABI, which links no Bevy.
crate-type = ["dylib"]

[dependencies]
bevy = "0.19"
renzora = { path = "../../crates/renzora" }

# NOTE: no `serde` entry, deliberately. Cargo would resolve a second copy,
# distinct from the one the engine's Bevy derives against. `renzora::serde`
# re-exports the engine's — and since nothing else here is third-party, cargo is
# never invoked for this plugin at all, which keeps the build offline.
