[workspace]

[package]
name = "magnet"
version = "0.1.0"
edition = "2021"
description = "Magnetic attraction. Demonstrates Or filters, adjacent bool fields, and a plugin resource read by one system and written by another."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin", default-features = false, features = ["libm"] }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
# no_std cannot unwind on stable.
panic = "abort"
