[workspace]

[package]
name = "ticker"
version = "0.1.0"
edition = "2021"
description = "Hot-reload probe: proves a plugin's resource survives a swap, and that exactly one build runs after it."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin" }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
