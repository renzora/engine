[workspace]

[package]
name = "locomotion"
version = "0.1.0"
edition = "2021"
description = "Drives an animator from movement: reads AnimState, plays idle/walk/run, crossfades between them."

[lib]
crate-type = ["cdylib"]

[dependencies]
# `anim` is opt-in. Animation is not part of the ABI — it is an ordinary user of
# the generic service command — so a plugin that never animates anything leaves
# this feature off and the boundary never learns that animation exists.
renzora_plugin = { path = "../../crates/renzora_plugin", default-features = false, features = ["libm", "anim"] }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
# no_std cannot unwind on stable.
panic = "abort"
