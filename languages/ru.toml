"settings.hint.bottom_drag" = "При перетаскивании ресурса из нижней панели она сворачивается, чтобы было видно, куда вы целитесь. Здесь задаётся, что происходит, когда вы отпускаете кнопку. Перетаскивание, начатое при уже закрытой панели, никогда её не открывает."
"settings.hint.console_log_limit" = "Сколько записей хранит консоль, прежде чем удалять самые старые. Меньшие значения отрисовывают меньше строк и меньше нагружают кадры; по умолчанию 100."
"settings.hint.splash_effects" = "3D-заставка лаунчера и анимированная дымка за экраном загрузки. Обе заполняют всё окно, поэтому дороже всего обходятся на сверхшироких дисплеях и дисплеях 4K и выше, где «Авто» их отключает."
"settings.hint.throttle_unfocused" = "Пока фокус у другого окна, редактор работает примерно на 60 кадрах в секунду для экономии энергии. Выключите, чтобы сохранить полную скорость в фоне, например при профилировании."
"settings.hint.render_thumbnails" = "Рендерить превью для моделей и материалов, у которых их ещё нет. Выключите, чтобы показывать только уже готовые миниатюры и остановить рендер-процесс компаньона, освободив его память, например в проекте с тысячами импортированных материалов."
"settings.hint.external_scene_edits" = "Что происходит, когда файл открытой сцены меняется на диске И у вас есть несохранённые изменения в ней. Если несохранённого нет, сцена всегда перезагружается. Перезагрузка отбрасывает ваши несохранённые изменения; если оставить свои, файл не трогается, и сохранение перезапишет его."
"settings.hint.gizmos_all_viewports" = "Когда открыто несколько окон просмотра, показывать гизмо трансформации и контур выделения сразу во всех. По умолчанию выключено: они следуют за окном просмотра под курсором, а остальные виды остаются чистыми."
"settings.hint.gizmo_pivot_bottom" = "Размещать рукоятки трансформации в нижнем центре выделения, а не в середине его ограничивающего объёма, чтобы они находились там, где объект касается земли. Вращение и масштабирование тоже идут относительно этой точки, поэтому объект остаётся стоять на поверхности, а не проваливается сквозь неё."
