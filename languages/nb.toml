# ─── export_help ───
"export.cap.solari.help" = "Bevy Solari maskinvarestrålesporet direkte og indirekte belysning (DI + GI). Bare på når Solari-pluginen brukes."
"export.cap.meshlets.help" = "Eksperimentell meshlet-rendering og den metis-baserte prosessoren. Sjelden brukt; stor."
"export.cap.feathers.help" = "Bevys kontrollverktøysett; brukes ikke av Renzoras eget UI."
"export.cap.remote_assets.help" = "Innlasting av ressurser over http/https under kjøring. Drar inn hele TLS-stakken rustls/ring/ureq (flere MB). Av for et spill som leverer lokale (rpak) ressurser."
"export.cap.asset_pipeline.help" = "Frakoblet ressursbehandling og lagring av komprimerte bilder: verktøy for redigering/utvikling, ikke nødvendig i et levert spill."
"export.cap.extra_shader_langs.help" = "Støtte for GLSL- og SPIR-V-shadere. Renzoras shadere er WGSL/WESL, så disse brukes ikke."
"export.cap.editor_helpers.help" = "Kamerakontrollere for fri bevegelse/panorering og systeminformasjonsdiagnostikk; bare for redigering/utvikling."
"export.cap.dev_extras.help" = "Filovervåking for direkte omlasting, refleksjonsdokumentasjon (verktøytips i inspektøren), utklippstavletilgang, oppdaging av OS-skrifter og bevys innstillingssystem. Alt er bare for redigering/utvikling og brukes ikke i et levert spill. (Utklippstavlens `arboard`-backend dras inn separat av motoren og trenger sin egen bryter for full besparelse.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: umiddelbar tegning av feilsøkingslinjer (~1,3 MiB). Bare for redigering/feilsøking; et levert spill bruker det sjelden. (Kan nå fjernes fordi vi eier det eksplisitte bevy-manifestet; det var tidligere sveiset inn i 2d/3d-metapakkene.) Redigeringsprogrammets transformasjonsgizmo er en egen crate, renzora_gizmo, og påvirkes ikke."
"export.cap.image_extra.help" = "Alle valgfrie teksturdekodere: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (+ zlib) og KTX2 beholdes alltid (vindusikon / komprimerte teksturer). Aktiveres automatisk ut fra bildefilene som faktisk finnes i prosjektet, så et spill uten teksturer eller med ett format dropper dekoderne det aldri bruker."
"export.cap.sky.help" = "Atmosfære, himmelboks, skyer, nattstjerner, miljøkart. Dropp for et 2D-spill."
"export.cap.particles.help" = "Partikkeleffekter: .vfx-partikkelsystemet, som også spiller av gamle .particle-effekter. Dropp det hvis spillet ikke har partikkeleffekter."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, bevegelsesuskarphet, tåke, OIT osv. (Tonemapping beholdes.)"
"export.cap.water.help" = "Vannoverflatesystemet."
"export.cap.terrain.help" = "Terrengsystemet."
"export.cap.spline.help" = "Spline-systemet."
"export.cap.navmesh.help" = "Generering av navigasjonsmesh og stifinning (polyanya/vleue)."
"export.cap.physics.help" = "Fysikkmotoren avian for stive legemer (~6,5 MiB). Driver også oppdrift i vann og kolliderhindringer i navmesh, som fjernes sammen med den. Dropp for et spill uten fysikksimulering."
"export.cap.render_3d.help" = "Hele 3D-pipelinen: bevy_pbr (StandardMaterial, skygger, deferred/forward-renderer), innlasting av glTF-modeller og renzora_shader-systemet for grafmaterialer (~10 MiB). AV = et rent 2D-spill (sprites + UI). Lys/atmosfære virker fortsatt (bevy_light beholdes). Krever at 3D-delsystemene (Terreng/Vann/Himmel/Etterbehandling) også er av; de bygger på bevy_pbr."
"export.cap.audio.help" = "Lydsystemet. Dropp for et spill uten lyd."
"export.cap.animation.help" = "Systemet for skjelett- og egenskapsanimasjon."
"export.cap.blueprint.help" = "Kjøretiden for visuell skripting med nodegrafer (~0,2 MiB). Aktiveres automatisk når prosjektet inneholder .blueprint/.bp-grafer."
"export.cap.rhai.help" = "Rhai-skriptbackenden (~2,3 MiB). Lua er alltid med; Rhai aktiveres automatisk bare når prosjektet inneholder .rhai-skript."
"export.cap.script_http.help" = "HTTP-verbene for skript. Drar inn TLS-stakken ureq + rustls/ring (~1 MiB). Aktiveres automatisk når et skript kaller http_get/http_post."
"export.cap.game_ui.help" = "UI-systemet i spillet."
