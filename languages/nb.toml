"settings.hint.default_expand" = "Hvilke komponentseksjoner som starter åpne når du velger en entitet. \"Bare det viktigste\" holder Navn, Transformasjon og Skript åpne."
"settings.hint.rail_sweep" = "Dra i glideskinnen nederst på et tallfelt for raskt å sveipe det fra min til maks; tallområdet gjør fortsatt den fine relative justeringen."
"settings.hint.bottom_drag" = "Når du drar en ressurs ut av bunnpanelet, glir det igjen slik at du ser hva du sikter på. Dette er hva som skjer når du slipper. Et dra som starter med panelet allerede lukket, åpner det aldri."
"settings.hint.toggle_on_click" = "Klikk på en rad i hierarkiet folder også ut undertreet, og folder det sammen igjen når klikket fjerner valget. Av betyr at pilikonet (og piltastene Venstre/Høyre) er eneste måte å folde en gren på."
"settings.hint.autosave" = "Lagrer den åpne scenen på nytt med jevne mellomrom. Statuslinjen teller ned der det ellers står \"Klar\"."
"settings.hint.console_log_limit" = "Hvor mange oppføringer konsollen beholder før den fjerner de eldste. Lavere verdier tegner færre rader og koster færre bilder; 100 er standard."
"settings.hint.restart_editor" = "Trer i kraft etter at redigeringsprogrammet er startet på nytt."
"settings.hint.splash_effects" = "Startprogrammets filmatiske 3D-scene og det animerte disen bak lasteskjermen. Begge fyller vinduet, så de koster mest på ultrabrede skjermer og 4K og høyere, der Auto slår dem av."
"settings.hint.throttle_unfocused" = "Mens et annet vindu har fokus, kjører redigeringsprogrammet med omtrent 60 bilder per sekund for å spare strøm. Slå av dette for å holde full hastighet i bakgrunnen, for eksempel under profilering."
"settings.hint.render_thumbnails" = "Render forhåndsvisninger for modeller og materialer som ikke har noen ennå. Slå av dette for bare å vise miniatyrbilder som allerede er rendret og stoppe følgeprogrammets renderarbeider, slik at minnet frigjøres, for eksempel i et prosjekt med tusenvis av importerte materialer."
"settings.hint.external_scene_edits" = "Hva som skjer når den åpne scenens fil endres på disk OG du har ulagrede endringer i den. Uten ulagrede endringer lastes scenen alltid inn på nytt. Ny innlasting forkaster de ulagrede endringene dine; å beholde dine lar filen være, så lagring overskriver den."
"settings.hint.drag_opacity" = "Hvor ugjennomsiktig transformasjonsgizmoen forblir mens du drar et håndtak. Lavere verdier toner den ut slik at objektet under forblir synlig; 1,0 holder den helt ugjennomsiktig."
"settings.hint.gizmos_all_viewports" = "Når flere visningsporter er åpne, vis transformasjonsgizmoen og utvalgsomrisset i alle samtidig. Av som standard: de følger visningsporten pekeren er i, slik at de andre visningene holdes rene."
"settings.hint.gizmo_pivot_bottom" = "Plasser transformasjonshåndtakene nederst i midten av utvalget i stedet for midt i avgrensningsboksen, slik at de sitter der objektet møter bakken. Rotering og skalering dreier også rundt dette punktet, slik at et objekt blir stående på overflaten i stedet for å synke gjennom den."
"settings.hint.input_actions" = "Navngitte handlinger kobler fysiske inndata (taster, mus, spillkontroller) til spillmekanikk. Skript leser dem etter navn."
"settings.hint.no_plugins" = "Ingen plugin-innstillinger registrert. Plugins legger til seksjoner her via `register_settings_section`."
