"settings.hint.scroll_speed" = "Πολλαπλασιάζει την κύλιση των πάνελ (ροδέλα ποντικιού, πλήκτρα βέλους και σύρσιμο με μεσαίο κλικ). Το 1.5 είναι η προεπιλογή."
"settings.hint.default_expand" = "Ποιες ενότητες συστατικών ξεκινούν ανοιχτές όταν επιλέγετε μια οντότητα. Το \"Μόνο τα βασικά\" κρατά ανοιχτά τα Name, Transform και Scripts."
"settings.hint.rail_sweep" = "Σύρετε την κάτω ράγα ενός αριθμητικού πεδίου για γρήγορη σάρωση από το ελάχιστο ως το μέγιστο· η περιοχή του αριθμού εξακολουθεί να κάνει τη λεπτή σχετική ρύθμιση."
"settings.hint.bottom_drag" = "Όταν σύρετε έναν πόρο έξω από το κάτω πάνελ, αυτό κλείνει ώστε να βλέπετε πού στοχεύετε. Αυτό συμβαίνει όταν τον αφήσετε. Μια μεταφορά που ξεκινά με το πάνελ ήδη κλειστό δεν το ανοίγει ποτέ."
"settings.hint.toggle_on_click" = "Το κλικ σε μια γραμμή της ιεραρχίας αναπτύσσει και το υποδέντρο της, και το συμπτύσσει ξανά όταν το κλικ την αποεπιλέγει. Όταν είναι ανενεργό, μόνο το βελάκι (και τα πλήκτρα Left/Right) αναπτύσσουν έναν κλάδο."
"settings.hint.autosave" = "Αποθηκεύει ξανά την ανοιχτή σκηνή ανά τακτά διαστήματα. Η γραμμή κατάστασης δείχνει αντίστροφη μέτρηση στη θέση του \"Έτοιμο\"."
"settings.hint.console_log_limit" = "Πόσες καταχωρίσεις κρατά η κονσόλα πριν απορρίψει τις παλαιότερες. Μικρότερες τιμές αποδίδουν λιγότερες γραμμές και κοστίζουν λιγότερα καρέ· η προεπιλογή είναι 100."
"settings.hint.restart_editor" = "Εφαρμόζεται μετά την επανεκκίνηση του επεξεργαστή."
"settings.hint.splash_effects" = "Η τρισδιάστατη κινηματογραφική σκηνή του εκκινητή και η κινούμενη ομίχλη πίσω από την οθόνη φόρτωσης. Και τα δύο γεμίζουν το παράθυρο, οπότε κοστίζουν περισσότερο σε ultrawide και 4K ή μεγαλύτερες οθόνες, όπου το Αυτόματο τα απενεργοποιεί."
"settings.hint.throttle_unfocused" = "Όσο άλλο παράθυρο έχει την εστίαση, ο επεξεργαστής λειτουργεί στα περίπου 60 καρέ ανά δευτερόλεπτο για εξοικονόμηση ενέργειας. Απενεργοποιήστε το για πλήρη ταχύτητα στο παρασκήνιο, για παράδειγμα κατά την ανάλυση απόδοσης."
"settings.hint.render_thumbnails" = "Απόδοση προεπισκοπήσεων για μοντέλα και υλικά που δεν έχουν ακόμα. Απενεργοποιήστε το για να εμφανίζονται μόνο οι ήδη αποδοσμένες μικρογραφίες και να σταματήσει η εργασία απόδοσης του companion, ελευθερώνοντας τη μνήμη του, για παράδειγμα σε έργο με χιλιάδες εισαγμένα υλικά."
"settings.hint.external_scene_edits" = "Τι συμβαίνει όταν το αρχείο της ανοιχτής σκηνής αλλάζει στον δίσκο ΚΑΙ έχετε μη αποθηκευμένες αλλαγές σε αυτή. Χωρίς μη αποθηκευμένες αλλαγές η σκηνή επαναφορτώνεται πάντα. Η επαναφόρτωση απορρίπτει τις μη αποθηκευμένες αλλαγές σας· η διατήρηση των δικών σας αφήνει το αρχείο ως έχει, οπότε η αποθήκευση το αντικαθιστά."
"settings.hint.drag_opacity" = "Πόσο αδιαφανές μένει το gizmo μετασχηματισμού όσο σύρετε μια λαβή. Μικρότερες τιμές το ξεθωριάζουν ώστε να φαίνεται το αντικείμενο από κάτω· το 1.0 το κρατά πλήρως αδιαφανές."
"settings.hint.gizmos_all_viewports" = "Όταν είναι ανοιχτά πολλά παράθυρα προβολής, εμφανίζει το gizmo μετασχηματισμού και το περίγραμμα επιλογής σε όλα ταυτόχρονα. Ανενεργό από προεπιλογή: ακολουθούν το παράθυρο προβολής όπου βρίσκεται ο κέρσορας, κρατώντας καθαρές τις άλλες προβολές."
"settings.hint.gizmo_pivot_bottom" = "Τοποθετεί τις λαβές μετασχηματισμού στο κάτω κέντρο της επιλογής αντί για τη μέση του πλαισίου οριοθέτησης, ώστε να βρίσκονται εκεί που το αντικείμενο ακουμπά το έδαφος. Η περιστροφή και η κλιμάκωση γίνονται επίσης από εκεί, κρατώντας το αντικείμενο πάνω στην επιφάνεια αντί να βυθίζεται μέσα της."
"settings.hint.input_actions" = "Οι επώνυμες ενέργειες αντιστοιχίζουν φυσικές εισόδους (πλήκτρα, ποντίκι, χειριστήριο) στο gameplay. Τα σενάρια τις διαβάζουν με το όνομά τους."
"settings.hint.no_plugins" = "Δεν έχουν καταχωρηθεί ρυθμίσεις πρόσθετων. Τα πρόσθετα προσθέτουν ενότητες εδώ μέσω του `register_settings_section`."
"settings.hint.no_installed_plugins" = "Δεν υπάρχουν εγκατεστημένα πρόσθετα. Τοποθετήστε ένα στον φάκελο plugins δίπλα στον επεξεργαστή."
"settings.hint.plugins_restart" = "Οι αλλαγές εφαρμόζονται την επόμενη φορά που θα ξεκινήσει ο επεξεργαστής. Ένα πρόσθετο προσθέτει συστήματα και ρεσούρσες όσο συναρμολογείται η εφαρμογή, και δεν μπορούν να αφαιρεθούν όσο εκτελείται."
"settings.plugin.active" = "Ενεργό"
