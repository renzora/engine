"export.packaging.web_lean" = "Lean επαναμεταγλώττιση"
"export.packaging.web_guidance" = "Το lean είναι αυτό που πρέπει να διανείμετε στο web, και εδώ μετράει περισσότερο από οπουδήποτε αλλού: το προκατασκευασμένο πρότυπο είναι ολόκληρη η μηχανή, που την κατεβάζει κάθε παίκτης πριν ξεκινήσει το παιχνίδι. Μια lean επαναμεταγλώττιση αφαιρεί ό,τι δεν χρησιμοποιεί το παιχνίδι και είναι η μόνη λειτουργία web που μπορεί να περιέχει πρόσθετα (ένας browser δεν μπορεί να φορτώσει πρόσθετο από αρχείο).\n\nΧρησιμοποιήστε το πρότυπο για έναν γρήγορο έλεγχο όσο δουλεύετε."
"export.packaging.web_hint" = "Χρειάζεται τον στόχο wasm32, το wasm-bindgen και το binaryen· και τα τρία λαμβάνονται αυτόματα αν λείπουν. Το binaryen απλώς μικραίνει το πακέτο: αν δεν μπορεί να ληφθεί, η εξαγωγή πετυχαίνει ούτως ή άλλως, με μεγαλύτερο μέγεθος."
"export.runtime.lean_unused" = "Μια lean εξαγωγή μεταγλωττίζει ξανά τη μηχανή από τον πηγαίο κώδικα, οπότε δεν χρησιμοποιεί το πρότυπο runtime: δεν χρειάζεται να έχετε εγκατεστημένο κάποιο."
