# ─── export_help ───
"export.cap.solari.help" = "Άμεσος και έμμεσος φωτισμός με ray tracing υλικού του Bevy Solari (DI + GI). Ενεργό μόνο όταν χρησιμοποιείται το πρόσθετο Solari."
"export.cap.meshlets.help" = "Πειραματική απόδοση meshlet και ο επεξεργαστής της με βάση το metis. Χρησιμοποιείται σπάνια· μεγάλο μέγεθος."
"export.cap.feathers.help" = "Η εργαλειοθήκη στοιχείων ελέγχου του Bevy, που δεν χρησιμοποιείται από το UI του Renzora."
"export.cap.remote_assets.help" = "Φόρτωση πόρων μέσω http/https κατά την εκτέλεση: φέρνει ολόκληρη τη στοίβα TLS rustls/ring/ureq (αρκετά MB). Ανενεργό για παιχνίδι που διανέμει τοπικούς πόρους (rpak)."
"export.cap.asset_pipeline.help" = "Επεξεργασία πόρων εκτός σύνδεσης και αποθήκευση συμπιεσμένων εικόνων: εργαλεία επεξεργαστή/ανάπτυξης, δεν χρειάζονται σε διανεμημένο παιχνίδι."
"export.cap.extra_shader_langs.help" = "Υποστήριξη shaders GLSL και SPIR-V. Οι shaders του Renzora είναι WGSL/WESL, οπότε αυτά δεν χρησιμοποιούνται."
"export.cap.editor_helpers.help" = "Ελεγκτές ελεύθερης κάμερας/μετατόπισης και διαγνωστικά πληροφοριών συστήματος: μόνο για επεξεργαστή/ανάπτυξη."
"export.cap.dev_extras.help" = "Παρακολούθηση αρχείων για άμεση επαναφόρτωση, τεκμηρίωση reflection (επεξηγήσεις επιθεωρητή), πρόσβαση στο πρόχειρο, εντοπισμός γραμματοσειρών λειτουργικού και το σύστημα ρυθμίσεων του bevy: όλα μόνο για επεξεργαστή/ανάπτυξη, χωρίς καμία χρήση σε διανεμημένο παιχνίδι. (Το backend `arboard` του προχείρου φέρνεται χωριστά από τη μηχανή και χρειάζεται δικό του διακόπτη για την πλήρη εξοικονόμηση.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: σχεδίαση γραμμών αποσφαλμάτωσης άμεσης λειτουργίας (~1.3 MiB). Μόνο για επεξεργαστή/αποσφαλμάτωση· ένα διανεμημένο παιχνίδι σπάνια το χρησιμοποιεί. (Πλέον αφαιρείται επειδή ελέγχουμε το ρητό manifest του bevy· παλαιότερα ήταν ενσωματωμένο στα meta 2d/3d.) Το gizmo μετασχηματισμού του επεξεργαστή είναι ξεχωριστό crate, το renzora_gizmo, και δεν επηρεάζεται."
"export.cap.image_extra.help" = "Κάθε προαιρετικός αποκωδικοποιητής υφών: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. Τα PNG (+ το zlib του) και KTX2 διατηρούνται πάντα (εικονίδιο παραθύρου / συμπιεσμένες υφές). Ενεργοποιείται αυτόματα ανάλογα με τα αρχεία εικόνας που υπάρχουν στο έργο, ώστε ένα παιχνίδι χωρίς υφές ή με μία μόνο μορφή να παραλείπει τους αποκωδικοποιητές που δεν χρησιμοποιεί."
"export.cap.sky.help" = "Ατμόσφαιρα, ουράνιος θόλος, σύννεφα, νυχτερινά αστέρια, χάρτες περιβάλλοντος. Παραλείψτε το για παιχνίδι 2D."
"export.cap.particles.help" = "Εφέ σωματιδίων: το σύστημα σωματιδίων .vfx, που αναπαράγει και τα παλιά εφέ .particle. Παραλείψτε το αν το παιχνίδι σας δεν έχει εφέ σωματιδίων."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, θόλωση κίνησης, ομίχλη, OIT κ.λπ. (Η χαρτογράφηση τόνων παραμένει.)"
"export.cap.water.help" = "Το υποσύστημα επιφάνειας νερού."
"export.cap.terrain.help" = "Το υποσύστημα εδάφους."
"export.cap.spline.help" = "Το υποσύστημα splines."
"export.cap.navmesh.help" = "Δημιουργία πλέγματος πλοήγησης και εύρεση διαδρομής (polyanya/vleue)."
"export.cap.physics.help" = "Η μηχανή φυσικής στερεών σωμάτων avian (~6.5 MiB). Τροφοδοτεί επίσης την άνωση στο νερό και τα εμπόδια συγκρουστών του navmesh, που αφαιρούνται μαζί της. Παραλείψτε το για παιχνίδι χωρίς προσομοίωση φυσικής."
"export.cap.render_3d.help" = "Ολόκληρο το pipeline 3D: bevy_pbr (StandardMaterial, σκιές, deferred/forward renderer), φόρτωση μοντέλων glTF και το σύστημα υλικών γραφήματος renzora_shader (~10 MiB). ΑΝΕΝΕΡΓΟ = παιχνίδι μόνο 2D (sprites + UI). Τα φώτα/η ατμόσφαιρα λειτουργούν ακόμα (το bevy_light διατηρείται). Απαιτεί να είναι επίσης ανενεργά τα υποσυστήματα 3D (Έδαφος/Νερό/Ουρανός/Post-FX), καθώς βασίζονται στο bevy_pbr."
"export.cap.audio.help" = "Το υποσύστημα ήχου. Παραλείψτε το για παιχνίδι χωρίς ήχο."
"export.cap.animation.help" = "Το υποσύστημα σκελετικής κίνησης και κίνησης ιδιοτήτων."
"export.cap.blueprint.help" = "Το runtime οπτικών σεναρίων με γράφημα κόμβων (~0.2 MiB). Ενεργοποιείται αυτόματα όταν το έργο περιέχει γραφήματα .blueprint/.bp."
"export.cap.rhai.help" = "Το backend σεναρίων Rhai (~2.3 MiB). Η Lua περιλαμβάνεται πάντα· η Rhai ενεργοποιείται αυτόματα μόνο όταν το έργο περιέχει σενάρια .rhai."
"export.cap.script_http.help" = "Οι εντολές HTTP των σεναρίων: φέρνουν τη στοίβα TLS ureq + rustls/ring (~1 MiB). Ενεργοποιείται αυτόματα όταν ένα σενάριο καλεί http_get/http_post."
"export.cap.game_ui.help" = "Το υποσύστημα UI εντός παιχνιδιού."
