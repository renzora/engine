"export.packaging.guidance" = "Το lean είναι αυτό που πρέπει να διανείμετε. Μεταγλωττίζει ξανά τη μηχανή μόνο για αυτό το παιχνίδι, οπότε είναι ένα αρχείο χωρίς κοινόχρηστες βιβλιοθήκες δίπλα του και χωρίς τον κώδικα που το παιχνίδι σας δεν καλεί ποτέ.\n\nΟι άλλες δύο αντιγράφουν το runtime του επεξεργαστή και τα dylibs του, κάτι που παράγεται γρήγορα και ξαναδοκιμάζεται εύκολα: χρησιμοποιήστε τες για έλεγχο μιας εξαγωγής όσο δουλεύετε, όχι για κυκλοφορία."
