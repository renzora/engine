"settings.hint.toggle_on_click" = "Egy hierarchiasorra kattintva a részfája is kinyílik, és újra becsukódik, amikor a kattintás megszünteti a kijelölést. Kikapcsolva csak a nyíl (és a Bal/Jobb nyílbillentyűk) bontja ki az ágat."
"settings.hint.autosave" = "Időzítve újramenti a megnyitott jelenetet. Az állapotsor a \"Kész\" helyén visszaszámlál."
"settings.hint.console_log_limit" = "Hány bejegyzést tart meg a konzol, mielőtt a legrégebbieket elveti. Az alacsonyabb érték kevesebb sort renderel és kevesebb képkockába kerül; az alapérték 100."
"settings.hint.restart_editor" = "A szerkesztő újraindítása után lép érvénybe."
"settings.hint.splash_effects" = "Az indító 3D filmes jelenete és a betöltőképernyő mögötti animált köd. Mindkettő kitölti az ablakot, ezért ultraszéles és 4K feletti kijelzőkön kerülnek a legtöbbe, ahol az Automatikus beállítás kikapcsolja őket."
"settings.hint.throttle_unfocused" = "Amíg egy másik ablak van fókuszban, a szerkesztő energiatakarékosságból nagyjából 60 képkocka/mp sebességgel fut. Kapcsolja ki, ha a háttérben is teljes sebességet szeretne, például profilozás közben."
"settings.hint.render_thumbnails" = "Előnézetek renderelése azokhoz a modellekhez és anyagokhoz, amelyeknek még nincs. Kikapcsolva csak a már elkészült bélyegképek jelennek meg, és a kísérőalkalmazás renderelő folyamata leáll, felszabadítva a memóriáját, például egy több ezer importált anyagot tartalmazó projektben."
"settings.hint.external_scene_edits" = "Mi történjen, ha a megnyitott jelenet fájlja megváltozik a lemezen, ÉS Önnek vannak nem mentett módosításai. Ha nincs mentetlen módosítás, a jelenet mindig újratöltődik. Az újratöltés elveti a nem mentett módosításokat; a saját megtartása érintetlenül hagyja a fájlt, így a mentés felülírja azt."
"settings.hint.drag_opacity" = "Mennyire marad átlátszatlan a transzformációs gizmó, amíg egy fogantyút húz. Az alacsonyabb érték elhalványítja, így az alatta lévő objektum látható marad; az 1,0 teljesen átlátszatlanul hagyja."
"settings.hint.gizmos_all_viewports" = "Több nyitott nézetablak esetén a transzformációs gizmó és a kijelölés körvonala egyszerre mindegyikben megjelenik. Alapértelmezés szerint ki van kapcsolva: azt a nézetablakot követik, amelyben a kurzor van, így a többi nézet tiszta marad."
"settings.hint.gizmo_pivot_bottom" = "A transzformációs fogantyúk a kijelölés alsó közepére kerülnek a befoglaló doboz közepe helyett, így ott ülnek, ahol az objektum a talajjal érintkezik. A forgatás és a méretezés forgáspontja is ide kerül, így az objektum a felületen állva marad, nem süllyed bele."
"settings.hint.input_actions" = "Az elnevezett műveletek a fizikai bemeneteket (billentyűk, egér, játékvezérlő) rendelik a játékmenethez. A szkriptek név szerint olvassák őket."
"settings.hint.no_plugins" = "Nincsenek regisztrált bővítménybeállítások. A bővítmények a `register_settings_section` segítségével adnak ide szakaszokat."
"settings.hint.no_installed_plugins" = "Nincsenek telepített bővítmények. Helyezzen egyet a szerkesztő melletti plugins mappába."
"settings.hint.plugins_restart" = "A módosítások a szerkesztő következő indításakor lépnek érvénybe. A bővítmény az alkalmazás összeállítása közben ad hozzá rendszereket és erőforrás-objektumokat, és ezek futás közben nem vonhatók vissza."
