# ─── export_help ───
"export.cap.solari.help" = "Bevy Solari hardveres sugárkövetésű közvetlen és közvetett megvilágítás (DI + GI). Csak akkor van bekapcsolva, ha a Solari bővítmény használatban van."
"export.cap.meshlets.help" = "Kísérleti meshlet-renderelés és a metis-alapú feldolgozója. Ritkán használt; nagy méretű."
"export.cap.feathers.help" = "A Bevy vezérlőelem-készlete; a Renzora saját felülete nem használja."
"export.cap.remote_assets.help" = "Erőforrások betöltése http/https protokollon futásidőben; behúzza a teljes rustls/ring/ureq TLS-készletet (több MB). Helyi (rpak) erőforrásokat szállító játéknál kikapcsolva."
"export.cap.asset_pipeline.help" = "Offline erőforrás-feldolgozás és tömörített képek mentése; szerkesztői/fejlesztői eszközök, egy kiadott játékban nincs rájuk szükség."
"export.cap.extra_shader_langs.help" = "GLSL és SPIR-V shadertámogatás. A Renzora shaderei WGSL/WESL nyelvűek, így ezek nincsenek használatban."
"export.cap.editor_helpers.help" = "Szabad/pásztázó kameravezérlők és rendszerinformációs diagnosztika; csak szerkesztéshez/fejlesztéshez."
"export.cap.dev_extras.help" = "Fájlfigyelés a gyors újratöltéshez, reflexiós dokumentációs szövegek (felügyelő elemleírásai), vágólap-hozzáférés, rendszerbetűtípusok felderítése és a Bevy beállítási rendszere; mind csak szerkesztéshez/fejlesztéshez, egy kiadott játékban egyáltalán nem használtak. (A vágólap `arboard` háttérrendszerét a motor külön húzza be, és a teljes megtakarításhoz saját kapcsoló kell neki.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: azonnali módú hibakereső vonalrajzolás (~1,3 MiB). Csak szerkesztéshez/hibakereséshez; egy kiadott játék ritkán használja. (Most már eltávolítható, mert a Bevy manifestet mi kezeljük explicit módon; korábban a 2d/3d metacsomagokba volt beégetve.) A szerkesztő transzformációs gizmója külön crate (renzora_gizmo), erre nincs hatással."
"export.cap.image_extra.help" = "Minden opcionális textúradekódoló: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. A PNG (és a zlib) és a KTX2 mindig megmarad (ablakikon / tömörített textúrák). A projektben ténylegesen megtalálható képfájlok alapján automatikusan engedélyeződik, így egy textúra nélküli vagy egyetlen formátumot használó játék elhagyja a soha nem használt dekódolókat."
"export.cap.sky.help" = "Légkör, égbolt, felhők, éjszakai csillagok, környezeti térképek. 2D játéknál elhagyható."
"export.cap.particles.help" = "Részecskeeffektek: a .vfx részecskerendszer, amely a régi .particle effekteket is lejátssza. Hagyja el, ha a játékban nincsenek részecskeeffektek."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, mozgási elmosódás, köd, OIT stb. (A tónusleképezés megmarad.)"
"export.cap.water.help" = "A vízfelszín alrendszer."
"export.cap.terrain.help" = "A terep alrendszer."
"export.cap.spline.help" = "A spline alrendszer."
"export.cap.navmesh.help" = "Navigációs háló generálása és útkeresés (polyanya/vleue)."
"export.cap.physics.help" = "Az avian merevtest-fizikai motor (~6,5 MiB). Ez működteti a víz felhajtóerejét és a navmesh ütközőakadályait is, amelyek vele együtt kikerülnek. Fizikai szimuláció nélküli játéknál elhagyható."
"export.cap.render_3d.help" = "A teljes 3D pipeline: bevy_pbr (StandardMaterial, árnyékok, deferred/forward renderelő), glTF modellbetöltés és a renzora_shader gráfanyag-rendszere (~10 MiB). KI = csak 2D játék (sprite-ok + UI). A fények/légkör továbbra is működnek (a bevy_light megmarad). Ehhez a 3D alrendszereknek (Terep/Víz/Égbolt/Utófeldolgozás) is kikapcsolva kell lenniük, mivel a bevy_pbr-re épülnek."
"export.cap.audio.help" = "A hang alrendszer. Néma játéknál elhagyható."
"export.cap.animation.help" = "A csontvázas/tulajdonság-animációs alrendszer."
"export.cap.blueprint.help" = "A csomópontgráfos vizuális szkriptelés futtatókörnyezete (~0,2 MiB). Automatikusan engedélyeződik, ha a projekt .blueprint/.bp gráfokat tartalmaz."
"export.cap.rhai.help" = "A Rhai szkriptelési háttérrendszer (~2,3 MiB). A Lua mindig benne van; a Rhai csak akkor engedélyeződik automatikusan, ha a projekt .rhai szkripteket tartalmaz."
"export.cap.script_http.help" = "A szkriptek HTTP műveletei; behúzzák az ureq + rustls/ring TLS-készletet (~1 MiB). Automatikusan engedélyeződik, ha egy szkript a http_get/http_post függvényt hívja."
"export.cap.game_ui.help" = "A játékon belüli UI alrendszer."
