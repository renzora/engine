"export.packaging.web_guidance" = "A weben a karcsú módot érdemes kiadni, és itt ez minden másnál fontosabb: az előre elkészített sablon a teljes motor, amelyet minden játékos letölt a játék indulása előtt. A karcsú újrafordítás elhagyja a játék által nem használt részeket, és ez az egyetlen webes mód, amely bővítményeket is vihet, mivel a böngésző nem tud fájlból betölteni bővítményt.\n\nMunka közbeni gyors ellenőrzéshez használja a sablont."
