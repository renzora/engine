# ─── export_help ───
"export.cap.solari.help" = "Iluminare directă și indirectă ray-traced hardware Bevy Solari (DI + GI). Activată doar când este folosit pluginul Solari."
"export.cap.meshlets.help" = "Randare experimentală cu meshleturi și procesorul său bazat pe metis. Rar folosită; de mari dimensiuni."
"export.cap.feathers.help" = "Setul de widgeturi Bevy, nefolosit de UI-ul propriu Renzora."
"export.cap.remote_assets.help" = "Încărcarea resurselor prin http/https la runtime aduce întreaga stivă TLS rustls/ring/ureq (câțiva MB). Dezactivată pentru un joc care livrează resurse locale (rpak)."
"export.cap.asset_pipeline.help" = "Procesarea offline a resurselor și salvarea imaginilor comprimate: unelte de editor/dezvoltare, inutile într-un joc livrat."
"export.cap.extra_shader_langs.help" = "Suport pentru shadere GLSL și SPIR-V. Shaderele Renzora sunt WGSL/WESL, deci acestea nu sunt folosite."
"export.cap.editor_helpers.help" = "Controlere de cameră liberă/panoramare și diagnosticare a informațiilor de sistem; doar pentru editor/dezvoltare."
"export.cap.dev_extras.help" = "Urmărirea fișierelor pentru reîncărcare la cald, documentația din reflecție (indicațiile inspectorului), accesul la clipboard, descoperirea fonturilor sistemului și sistemul de setări bevy: toate doar pentru editor/dezvoltare, fără nicio utilizare într-un joc livrat. (Backendul de clipboard `arboard` este adus separat de motor și are nevoie de propria condiție pentru economia completă.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: desenare de linii de depanare în mod imediat (~1,3 MiB). Doar pentru editor/depanare; un joc livrat îl folosește rar. (Acum poate fi eliminat deoarece deținem manifestul bevy explicit; înainte era sudat în meta-pachetele 2d/3d.) Gizmo-ul de transformare al editorului este un crate separat, renzora_gizmo, și nu este afectat."
"export.cap.image_extra.help" = "Fiecare decodor de textură opțional: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (+ zlib) și KTX2 sunt păstrate mereu (pictograma ferestrei / texturi comprimate). Activat automat după fișierele de imagine existente efectiv în proiect, astfel încât un joc fără texturi sau cu un singur format renunță la decodoarele pe care nu le folosește."
"export.cap.sky.help" = "Atmosferă, skybox, nori, stele de noapte, hărți de mediu. Elimină pentru un joc 2D."
"export.cap.particles.help" = "Efecte de particule: sistemul de particule .vfx, care redă și efectele .particle mai vechi. Elimină-l dacă jocul nu are efecte de particule."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, neclaritate de mișcare, ceață, OIT etc. (Tonemapping-ul rămâne.)"
"export.cap.water.help" = "Subsistemul suprafețelor de apă."
"export.cap.terrain.help" = "Subsistemul de teren."
"export.cap.spline.help" = "Subsistemul de spline-uri."
"export.cap.navmesh.help" = "Generarea mesh-urilor de navigare și găsirea traseelor (polyanya/vleue)."
"export.cap.physics.help" = "Motorul fizic de corpuri rigide avian (~6,5 MiB). Asigură și flotabilitatea în apă și obstacolele navmesh din collidere, care sunt eliminate odată cu el. Elimină pentru un joc fără simulare fizică."
"export.cap.render_3d.help" = "Întregul pipeline 3D: bevy_pbr (StandardMaterial, umbre, randare deferred/forward), încărcarea modelelor glTF și sistemul de materiale graf renzora_shader (~10 MiB). DEZACTIVAT = un joc doar 2D (sprite-uri + UI). Luminile/atmosfera funcționează în continuare (bevy_light este păstrat). Necesită ca și subsistemele 3D (Teren/Apă/Cer/Post-FX) să fie dezactivate, deoarece se bazează pe bevy_pbr."
"export.cap.audio.help" = "Subsistemul audio. Elimină pentru un joc fără sunet."
"export.cap.animation.help" = "Subsistemul de animație scheletică/de proprietăți."
"export.cap.blueprint.help" = "Runtime-ul de scripting vizual bazat pe grafuri de noduri (~0,2 MiB). Activat automat când proiectul conține grafuri .blueprint/.bp."
"export.cap.rhai.help" = "Backendul de scripturi Rhai (~2,3 MiB). Lua este inclus mereu; Rhai este activat automat doar când proiectul conține scripturi .rhai."
"export.cap.script_http.help" = "Verbele HTTP pentru scripturi aduc stiva TLS ureq + rustls/ring (~1 MiB). Activat automat când un script apelează http_get/http_post."
"export.cap.game_ui.help" = "Subsistemul de UI din joc."
