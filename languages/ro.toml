"settings.hint.restart_rendering" = "Este necesară repornirea pentru ca modul de randare să aibă efect."
"settings.hint.physics_backend" = "Se schimbă imediat în editor; jocul îl folosește de la următoarea pornire. Un motor fizic instalat ca plugin apare aici."
"settings.hint.no_project" = "Niciun proiect nu este încărcat în prezent."
"settings.hint.no_scenes" = "Nu s-au găsit scene în scenes/. Creează una pentru a o marca drept globală."
"settings.hint.ui_scale" = "Scalează UI-ul editorului peste setarea DPI a sistemului. 100% urmează sistemul."
"settings.hint.scroll_speed" = "Multiplică derularea panourilor: rotița mouse-ului, tastele săgeți și tragerea cu clic de mijloc. 1,5 este senzația implicită."
"settings.hint.default_expand" = "Ce secțiuni de componente pornesc deschise când selectezi o entitate. \"Doar esențiale\" păstrează deschise Nume, Transformare și Scripturi."
"settings.hint.rail_sweep" = "Trage șina glisorului de jos a unui câmp numeric pentru a-l parcurge rapid de la minim la maxim; zona numărului face în continuare ajustarea fină relativă."
"settings.hint.bottom_drag" = "Tragerea unei resurse din panoul de jos îl închide, ca să vezi unde țintești. Aceasta este ce se întâmplă când îi dai drumul. O tragere care începe cu panoul deja închis nu îl deschide niciodată."
"settings.hint.toggle_on_click" = "Clicul pe un rând din ierarhie îi deschide și subarborele și îl închide din nou când clicul îl deselectează. Dezactivat, doar săgeata (și tastele săgeată stânga/dreapta) pliază o ramură."
"settings.hint.autosave" = "Salvează din nou scena deschisă la un interval. Bara de stare afișează numărătoarea inversă în locul textului \"Gata\"."
"settings.hint.console_log_limit" = "Câte intrări păstrează consola înainte de a le elimina pe cele mai vechi. Valorile mai mici afișează mai puține rânduri și costă mai puține cadre; 100 este implicit."
"settings.hint.restart_editor" = "Are efect după repornirea editorului."
"settings.hint.splash_effects" = "Cinematicul 3D al lansatorului și ceața animată din spatele ecranului de încărcare. Ambele umplu fereastra, deci costă cel mai mult pe ecranele ultrawide și 4K sau mai mari, unde modul Automat le dezactivează."
"settings.hint.throttle_unfocused" = "Cât timp altă fereastră are focusul, editorul rulează la aproximativ 60 de cadre pe secundă pentru a economisi energie. Dezactivează opțiunea pentru a-l păstra la viteză maximă în fundal, de exemplu în timpul profilării."
"settings.hint.render_thumbnails" = "Randează previzualizări pentru modelele și materialele care nu au încă. Dezactivează opțiunea pentru a afișa doar miniaturile deja randate și a opri procesul de randare al companionului, eliberându-i memoria, de exemplu într-un proiect cu mii de materiale importate."
"settings.hint.external_scene_edits" = "Ce se întâmplă când fișierul scenei deschise se modifică pe disc ȘI ai modificări nesalvate în ea. Fără modificări nesalvate, scena se reîncarcă mereu. Reîncărcarea renunță la modificările nesalvate; păstrarea lor lasă fișierul neatins, deci salvarea îl suprascrie."
"settings.hint.drag_opacity" = "Cât de opac rămâne gizmo-ul de transformare cât timp tragi un mâner. Valorile mai mici îl estompează, astfel încât obiectul de dedesubt rămâne vizibil; 1.0 îl păstrează complet opac."
"settings.hint.gizmos_all_viewports" = "Când sunt deschise mai multe viewporturi, arată gizmo-ul de transformare și conturul selecției în toate deodată. Dezactivat implicit: urmează viewportul în care se află cursorul, păstrând celelalte vederi curate."
"settings.hint.gizmo_pivot_bottom" = "Plasează mânerele de transformare în centrul bazei selecției, nu în mijlocul casetei de încadrare, astfel încât să stea acolo unde obiectul atinge solul. Rotirea și scalarea pivotează tot acolo, ceea ce menține obiectul pe suprafață în loc să se scufunde prin ea."
"settings.hint.input_actions" = "Acțiunile cu nume asociază intrările fizice (taste, mouse, gamepad) cu gameplay-ul. Scripturile le citesc după nume."
"settings.hint.no_plugins" = "Nu sunt înregistrate setări de pluginuri. Pluginurile adaugă secțiuni aici prin `register_settings_section`."
"settings.hint.no_installed_plugins" = "Nu sunt instalate pluginuri. Pune unul în folderul plugins de lângă editor."
"settings.hint.plugins_restart" = "Modificările au efect la următoarea pornire a editorului. Un plugin adaugă sisteme și resurse ECS în timp ce aplicația este asamblată, iar acestea nu pot fi retrase odată ce rulează."
