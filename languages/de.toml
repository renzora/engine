"export.packaging.web_guidance" = "Schlank ist das, was du im Web ausliefern solltest, und hier zählt es mehr als irgendwo sonst: Die vorgefertigte Vorlage ist die gesamte Engine, die jeder Spieler vor dem Spielstart herunterlädt. Eine schlanke Neukompilierung lässt die Teile weg, die dieses Spiel nie nutzt, und ist der einzige Web-Modus, der Plugins enthalten kann (ein Browser kann keines aus einer Datei laden).\n\nNutze die Vorlage für eine schnelle Prüfung während der Arbeit."
"export.packaging.web_hint" = "Benötigt das wasm32-Target, wasm-bindgen und binaryen; alle drei werden bei Bedarf automatisch geladen. Binaryen verkleinert nur das Bundle: Kann es nicht heruntergeladen werden, gelingt der Export trotzdem, nur größer."
