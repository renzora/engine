"settings.hint.throttle_unfocused" = "Solange ein anderes Fenster den Fokus hat, läuft der Editor mit etwa 60 Bildern pro Sekunde, um Energie zu sparen. Schalte dies aus, damit er im Hintergrund mit voller Geschwindigkeit läuft, zum Beispiel beim Profiling."
"settings.hint.render_thumbnails" = "Rendert Vorschauen für Modelle und Materialien, die noch keine haben. Schalte dies aus, um nur bereits gerenderte Vorschaubilder anzuzeigen und den Render-Worker des Companions zu stoppen, was seinen Speicher freigibt, zum Beispiel in einem Projekt mit Tausenden importierten Materialien."
"settings.hint.external_scene_edits" = "Was passiert, wenn sich die Datei der geöffneten Szene auf der Festplatte ändert UND du ungespeicherte Änderungen daran hast. Ohne ungespeicherte Änderungen wird die Szene immer neu geladen. Neu laden verwirft deine ungespeicherten Änderungen; behältst du deine, bleibt die Datei unberührt und Speichern überschreibt sie."
"settings.hint.gizmos_all_viewports" = "Wenn mehrere Viewports geöffnet sind, Transform-Gizmo und Auswahlumriss in allen gleichzeitig anzeigen. Standardmäßig aus: Sie folgen dem Viewport, in dem sich dein Cursor befindet, und halten die anderen Ansichten sauber."
"settings.hint.gizmo_pivot_bottom" = "Setzt die Transform-Griffe an die untere Mitte der Auswahl statt in die Mitte ihres Begrenzungsrahmens, sodass sie dort sitzen, wo das Objekt den Boden berührt. Auch Rotieren und Skalieren nutzen diesen Drehpunkt, damit ein Objekt auf der Oberfläche stehen bleibt, statt in sie einzusinken."
"settings.hint.no_installed_plugins" = "Keine Plugins installiert. Lege eines in den plugins-Ordner neben dem Editor."
"settings.hint.plugins_restart" = "Änderungen werden beim nächsten Start des Editors wirksam. Ein Plugin fügt Systeme und Ressourcen hinzu, während die App zusammengesetzt wird, und diese lassen sich nicht zurückziehen, solange sie läuft."
