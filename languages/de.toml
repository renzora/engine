"export.packaging.guidance" = "Schlank ist das, was du ausliefern solltest. Es kompiliert die Engine nur für dieses Spiel neu, sodass es eine einzige Datei ist, ohne gemeinsam genutzte Bibliotheken daneben und ohne den Code, den dein Spiel nie aufruft.\n\nDie anderen beiden kopieren die eigene Runtime des Editors und ihre Dylibs. Das geht schnell und lässt sich rasch erneut testen; nutze sie, um einen Export während der Arbeit zu prüfen, nicht für ein Release."
"export.packaging.web_template" = "Vorgefertigte Vorlage"
