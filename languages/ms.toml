"settings.hint.bottom_drag" = "Menyeret aset keluar dari panel bawah akan menutupnya supaya anda dapat melihat sasaran anda. Ini ialah apa yang berlaku apabila anda melepaskannya. Seretan yang bermula semasa panel sudah tertutup tidak akan membukanya."
"settings.hint.toggle_on_click" = "Mengklik baris hierarki juga membuka subpepohonnya, dan menutupnya semula apabila klik itu menyahpilihnya. Jika dimatikan, karet (dan kekunci anak panah Left/Right) menjadi satu-satunya cara untuk melipat cabang."
"settings.hint.autosave" = "Menyimpan semula adegan yang dibuka mengikut pemasa. Bar status mengira detik menggantikan \"Sedia\"."
"settings.hint.console_log_limit" = "Berapa banyak entri yang disimpan oleh konsol sebelum membuang yang tertua. Nilai lebih rendah memaparkan lebih sedikit baris dan menggunakan lebih sedikit bingkai; 100 ialah lalai."
"settings.hint.restart_editor" = "Berkuat kuasa selepas editor dimulakan semula."
"settings.hint.splash_effects" = "Sinematik 3D pelancar dan jerebu beranimasi di belakang skrin pemuatan. Kedua-duanya memenuhi tetingkap, jadi kosnya paling tinggi pada paparan ultralebar dan 4K ke atas, di mana Auto mematikannya."
"settings.hint.throttle_unfocused" = "Semasa tetingkap lain difokus, editor berjalan pada kira-kira 60 bingkai sesaat untuk menjimatkan kuasa. Matikan ini untuk mengekalkan kelajuan penuh di latar belakang, contohnya semasa pemprofilan."
"settings.hint.render_thumbnails" = "Render pratonton untuk model dan bahan yang belum mempunyainya. Matikan ini untuk menunjukkan hanya lakaran kecil yang sudah dirender dan menghentikan pekerja render companion, membebaskan memorinya, contohnya dalam projek dengan beribu-ribu bahan yang diimport."
"settings.hint.external_scene_edits" = "Apa yang berlaku apabila fail adegan yang dibuka berubah pada cakera DAN anda mempunyai perubahan yang belum disimpan padanya. Jika tiada yang belum disimpan, adegan sentiasa dimuat semula. Memuat semula membuang perubahan anda yang belum disimpan; mengekalkan perubahan anda membiarkan fail itu, jadi menyimpan akan menindihnya."
"settings.hint.drag_opacity" = "Sejauh mana gizmo transformasi kekal legap semasa anda menyeret pemegang. Nilai lebih rendah memudarkannya supaya objek di bawahnya kekal kelihatan; 1.0 mengekalkannya legap sepenuhnya."
"settings.hint.gizmos_all_viewports" = "Apabila beberapa port pandang dibuka, tunjukkan gizmo transformasi dan garis luar pilihan dalam setiap satu serentak. Dimatikan secara lalai: ia mengikut port pandang tempat kursor anda berada, memastikan paparan lain bersih."
"settings.hint.gizmo_pivot_bottom" = "Letakkan pemegang transformasi di tengah bawah pilihan dan bukannya di tengah kotak sempadannya, supaya ia berada di tempat objek bertemu tanah. Putaran dan skala juga berpangsi di situ, yang mengekalkan objek berdiri di atas permukaan dan bukannya tenggelam melaluinya."
"settings.hint.input_actions" = "Tindakan bernama memetakan input fizikal (kekunci, tetikus, pad permainan) kepada permainan. Skrip membacanya mengikut nama."
