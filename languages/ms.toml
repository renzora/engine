"export.cap.extra_shader_langs.help" = "Sokongan shader GLSL dan SPIR-V. Shader Renzora ialah WGSL/WESL, jadi ini tidak digunakan."
"export.cap.editor_helpers.help" = "Pengawal kamera bebas/anjak dan diagnostik maklumat sistem: editor/pembangun sahaja."
"export.cap.dev_extras.help" = "Pemerhatian fail muat semula langsung, rentetan dokumen pantulan (petua alat pemeriksa), akses papan keratan, penemuan fon OS, dan sistem tetapan bevy: semuanya editor/pembangun sahaja, tanpa sebarang penggunaan dalam permainan yang diterbitkan. (Bahagian belakang `arboard` papan keratan dibawa secara berasingan oleh enjin dan memerlukan get sendiri untuk penjimatan penuh.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: lukisan garis nyahpepijat mod segera (~1.3 MiB). Editor/nyahpepijat sahaja; permainan yang diterbitkan jarang menggunakannya. (Kini boleh dilucutkan kerana kami memiliki manifes bevy yang eksplisit; dahulu ia terikat pada meta 2d/3d.) Gizmo transformasi editor ialah crate berasingan, renzora_gizmo, dan tidak terjejas."
"export.cap.image_extra.help" = "Setiap penyahkod tekstur pilihan: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (+ zlibnya) dan KTX2 sentiasa dikekalkan (ikon tetingkap / tekstur termampat). Didayakan secara automatik mengikut fail imej yang sebenarnya ada dalam projek, jadi permainan tanpa tekstur atau berformat tunggal membuang penyahkod yang tidak pernah digunakannya."
"export.cap.sky.help" = "Atmosfera, kotak langit, awan, bintang malam, peta persekitaran. Buang untuk permainan 2D."
"export.cap.particles.help" = "Kesan zarah: sistem zarah .vfx, yang juga memainkan kesan .particle lama. Buang jika permainan anda tiada kesan zarah."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, kabur gerakan, kabus, OIT, dsb. (Pemetaan ton kekal.)"
"export.cap.water.help" = "Subsistem permukaan air."
"export.cap.terrain.help" = "Subsistem rupa bumi."
"export.cap.spline.help" = "Subsistem spline."
"export.cap.navmesh.help" = "Penjanaan jejaring navigasi dan pencarian laluan (polyanya/vleue)."
"export.cap.physics.help" = "Enjin fizik jasad tegar avian (~6.5 MiB). Juga menggerakkan keapungan air dan halangan pelanggar navmesh, yang dilucutkan bersamanya. Buang untuk permainan tanpa simulasi fizik."
"export.cap.render_3d.help" = "Keseluruhan saluran paip 3D: bevy_pbr (StandardMaterial, bayang, perender deferred/forward), pemuatan model glTF, dan sistem bahan graf renzora_shader (~10 MiB). MATI = permainan 2D sahaja (sprite + UI). Lampu/atmosfera masih berfungsi (bevy_light dikekalkan). Memerlukan subsistem 3D (Rupa Bumi/Air/Langit/Post-FX) juga dimatikan, kerana ia dibina di atas bevy_pbr."
"export.cap.audio.help" = "Subsistem audio. Buang untuk permainan senyap."
"export.cap.animation.help" = "Subsistem animasi rangka/sifat."
"export.cap.blueprint.help" = "Masa jalan penskripan visual graf nod (~0.2 MiB). Didayakan secara automatik apabila projek mengandungi graf .blueprint/.bp."
"export.cap.rhai.help" = "Bahagian belakang skrip Rhai (~2.3 MiB). Lua sentiasa disertakan; Rhai didayakan secara automatik hanya apabila projek mengandungi skrip .rhai."
"export.cap.script_http.help" = "Kata kerja HTTP skrip: membawa masuk tindanan TLS ureq + rustls/ring (~1 MiB). Didayakan secara automatik apabila skrip memanggil http_get/http_post."
"export.cap.game_ui.help" = "Subsistem UI dalam permainan."
