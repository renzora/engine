# ─── export_help ───
"export.cap.solari.help" = "Bevy Solari hårdvarustrålspårad direkt och indirekt belysning (DI + GI). Aktiverad endast när Solari-pluginet används."
"export.cap.meshlets.help" = "Experimentell meshlet-rendering och dess metis-baserade processor. Används sällan; stor."
"export.cap.feathers.help" = "Bevys widgetverktygslåda; används inte av Renzoras eget UI."
"export.cap.remote_assets.help" = "Inläsning av tillgångar via http/https vid körning; drar in hela TLS-stacken rustls/ring/ureq (flera MB). Av för ett spel som levererar lokala (rpak) tillgångar."
"export.cap.asset_pipeline.help" = "Offlinebearbetning av tillgångar och sparning av komprimerade bilder: verktyg för redigerare/utveckling, behövs inte i ett levererat spel."
"export.cap.extra_shader_langs.help" = "Stöd för GLSL- och SPIR-V-shaders. Renzoras shaders är WGSL/WESL, så dessa används inte."
"export.cap.editor_helpers.help" = "Kamerakontroller för fri rörelse/panorering och systeminfodiagnostik; endast redigerare/utveckling."
"export.cap.dev_extras.help" = "Filbevakning för snabbinläsning, reflektionsdokumentation (verktygstips i inspektören), urklippsåtkomst, identifiering av systemtypsnitt och bevys inställningssystem; allt endast för redigerare/utveckling, utan användning i ett levererat spel. (Urklippets `arboard`-backend dras in separat av motorn och behöver en egen spärr för full besparing.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: felsökningslinjer i immediate mode (~1,3 MiB). Endast redigerare/felsökning; ett levererat spel använder det sällan. (Kan nu tas bort eftersom vi äger det explicita bevy-manifestet; det var tidigare hopsvetsat med 2d/3d-metapaketen.) Redigerarens transformgizmo är ett separat crate, renzora_gizmo, och påverkas inte."
"export.cap.image_extra.help" = "Alla valfria texturavkodare: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (+ dess zlib) och KTX2 behålls alltid (fönsterikon / komprimerade texturer). Aktiveras automatiskt efter de bildfiler som faktiskt finns i projektet, så ett spel utan texturer eller med ett enda format släpper avkodarna det aldrig använder."
"export.cap.sky.help" = "Atmosfär, himmelsbox, moln, nattstjärnor, miljökartor. Ta bort för ett 2D-spel."
"export.cap.particles.help" = "Partikeleffekter: partikelsystemet .vfx, som också spelar upp gamla .particle-effekter. Ta bort det om ditt spel saknar partikeleffekter."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, rörelseoskärpa, dimma, OIT osv. (Tonmappning behålls.)"
"export.cap.water.help" = "Vattenytans delsystem."
"export.cap.terrain.help" = "Terrängdelsystemet."
"export.cap.spline.help" = "Spline-delsystemet."
"export.cap.navmesh.help" = "Generering av navigationsnät och vägsökning (polyanya/vleue)."
"export.cap.physics.help" = "Fysikmotorn avian för stela kroppar (~6,5 MiB). Driver även vattnets flytkraft och navmesh-kolliderarhinder, som tas bort tillsammans med den. Ta bort för ett spel utan fysiksimulering."
"export.cap.render_3d.help" = "Hela 3D-pipelinen: bevy_pbr (StandardMaterial, skuggor, deferred/forward-renderare), inläsning av glTF-modeller och renzora_shaders grafmaterialsystem (~10 MiB). AV = ett rent 2D-spel (sprites + UI). Ljus/atmosfär fungerar fortfarande (bevy_light behålls). Kräver att 3D-delsystemen (Terräng/Vatten/Himmel/Post-FX) också är avstängda, eftersom de bygger på bevy_pbr."
"export.cap.audio.help" = "Ljuddelsystemet. Ta bort för ett tyst spel."
"export.cap.animation.help" = "Delsystemet för skelett-/egenskapsanimation."
"export.cap.blueprint.help" = "Körmiljön för visuell skriptning med nodgrafer (~0,2 MiB). Aktiveras automatiskt när projektet innehåller .blueprint/.bp-grafer."
"export.cap.rhai.help" = "Rhai-skriptbackend (~2,3 MiB). Lua ingår alltid; Rhai aktiveras automatiskt endast när projektet innehåller .rhai-skript."
"export.cap.script_http.help" = "Skriptens HTTP-verb; drar in TLS-stacken ureq + rustls/ring (~1 MiB). Aktiveras automatiskt när ett skript anropar http_get/http_post."
"export.cap.game_ui.help" = "Delsystemet för spel-UI."
