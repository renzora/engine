"settings.hint.rail_sweep" = "Dra i den nedre reglerskenan på ett numeriskt fält för att snabbt svepa det från min till max; sifferområdet gör fortfarande den fina relativa justeringen."
"settings.hint.bottom_drag" = "När du drar en tillgång ut ur bottenpanelen glider den igen så att du ser vad du siktar på. Detta är vad som händer när du släpper. En dragning som börjar med panelen redan stängd öppnar den aldrig."
"settings.hint.toggle_on_click" = "Ett klick på en hierarkirad fäller också ut dess underträd, och fäller ihop det igen när klicket avmarkerar den. Av lämnar pilen (och vänster/höger piltangent) som enda sätt att fälla ut en gren."
"settings.hint.autosave" = "Sparar om den öppna scenen med jämna mellanrum. Statusfältet räknar ned i stället för \"Klar\"."
"settings.hint.console_log_limit" = "Hur många poster konsolen behåller innan den äldsta tas bort. Lägre värden renderar färre rader och kostar färre bildrutor; 100 är standard."
"settings.hint.restart_editor" = "Börjar gälla efter omstart av redigeraren."
"settings.hint.splash_effects" = "Startfönstrets 3D-filmsekvens och det animerade diset bakom inläsningsskärmen. Båda fyller fönstret och kostar därför mest på ultrabreda skärmar och 4K och uppåt, där Auto stänger av dem."
"settings.hint.throttle_unfocused" = "Medan ett annat fönster har fokus körs redigeraren med ungefär 60 bildrutor per sekund för att spara energi. Stäng av detta för att behålla full hastighet i bakgrunden, till exempel vid profilering."
"settings.hint.render_thumbnails" = "Rendera förhandsvisningar för modeller och material som inte har någon än. Stäng av detta för att bara visa redan renderade miniatyrer och stoppa companions renderingsprocess, vilket frigör dess minne, till exempel i ett projekt med tusentals importerade material."
"settings.hint.external_scene_edits" = "Vad som händer när den öppna scenens fil ändras på disken OCH du har osparade ändringar i den. Utan osparade ändringar läses scenen alltid in igen. Att läsa in igen kastar dina osparade ändringar; att behålla dina lämnar filen orörd, så att spara skriver över den."
"settings.hint.drag_opacity" = "Hur ogenomskinlig transformgizmon förblir medan du drar i ett handtag. Lägre värden tonar ut den så att objektet under förblir synligt; 1.0 håller den helt ogenomskinlig."
"settings.hint.gizmos_all_viewports" = "När flera vyportar är öppna, visa transformgizmon och markeringskonturen i alla samtidigt. Av som standard: de följer vyporten som markören är i, vilket håller de andra vyerna rena."
"settings.hint.gizmo_pivot_bottom" = "Placera transformhandtagen i markeringens nedre mitt i stället för mitt i dess omslutande låda, så att de sitter där objektet möter marken. Rotation och skalning utgår också därifrån, vilket håller ett objekt stående på ytan i stället för att sjunka genom den."
"settings.hint.input_actions" = "Namngivna åtgärder kopplar fysisk indata (tangenter, mus, handkontroll) till spellogik. Skript läser dem efter namn."
