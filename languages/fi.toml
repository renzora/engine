"settings.hint.scroll_speed" = "Kertoo paneelien vierityksen: hiiren rulla, nuolinäppäimet ja keskipainikkeella vetäminen. 1.5 on oletustuntuma."
"settings.hint.default_expand" = "Mitkä komponenttiosiot ovat auki, kun valitset entiteetin. \"Vain olennaiset\" pitää Nimen, Muunnoksen ja Skriptit auki."
"settings.hint.rail_sweep" = "Vedä numerokentän alareunan liukukiskoa pyyhkäistäksesi arvon nopeasti minimistä maksimiin; numeroalue tekee edelleen hienon suhteellisen säädön."
"settings.hint.bottom_drag" = "Kun vedät resurssin ulos alapaneelista, paneeli liukuu kiinni, jotta näet mihin tähtäät. Tämä määrää, mitä tapahtuu, kun päästät irti. Veto, joka alkaa paneelin ollessa jo suljettuna, ei koskaan avaa sitä."
"settings.hint.toggle_on_click" = "Hierarkian rivin napsauttaminen myös laajentaa sen alipuun ja kutistaa sen taas, kun napsautus poistaa valinnan. Pois päältä haaran voi laajentaa vain nuolikuvakkeesta (tai Vasen/Oikea-nuolinäppäimillä)."
"settings.hint.autosave" = "Tallentaa avoimen kohtauksen uudelleen ajastetusti. Tilarivi laskee aikaa alaspäin \"Valmis\"-tekstin paikalla."
"settings.hint.console_log_limit" = "Kuinka monta merkintää konsoli säilyttää ennen vanhimpien poistamista. Pienemmät arvot piirtävät vähemmän rivejä ja vievät vähemmän ruutuaikaa; 100 on oletus."
"settings.hint.restart_editor" = "Tulee voimaan editorin uudelleenkäynnistyksen jälkeen."
"settings.hint.splash_effects" = "Käynnistimen 3D-elokuvallinen esitys ja latausnäytön takana oleva animoitu usva. Molemmat täyttävät ikkunan, joten ne maksavat eniten ultralaajoilla ja 4K-tai-suuremmilla näytöillä, joilla Automaattinen poistaa ne käytöstä."
"settings.hint.throttle_unfocused" = "Kun toinen ikkuna on kohdistettuna, editori toimii noin 60 ruudun sekuntinopeudella virran säästämiseksi. Poista tämä käytöstä pitääksesi täyden nopeuden taustalla, esimerkiksi profiloidessa."
"settings.hint.render_thumbnails" = "Renderöi esikatselukuvat malleille ja materiaaleille, joilla niitä ei vielä ole. Poista tämä käytöstä näyttääksesi vain jo renderöidyt pikkukuvat ja pysäyttääksesi apuohjelman renderöintiprosessin, mikä vapauttaa sen muistin, esimerkiksi projektissa, jossa on tuhansia tuotuja materiaaleja."
"settings.hint.external_scene_edits" = "Mitä tapahtuu, kun avoimen kohtauksen tiedosto muuttuu levyllä JA sinulla on siihen tallentamattomia muutoksia. Jos tallentamatonta ei ole, kohtaus latautuu aina uudelleen. Uudelleenlataus hylkää tallentamattomat muutoksesi; omien säilyttäminen jättää tiedoston ennalleen, joten tallennus korvaa sen."
"settings.hint.drag_opacity" = "Kuinka peittävänä muunnosgizmo pysyy, kun vedät kahvaa. Pienemmät arvot häivyttävät sitä, jotta alla oleva objekti näkyy; 1.0 pitää sen täysin peittävänä."
"settings.hint.gizmos_all_viewports" = "Kun useita näkymiä on auki, näytä muunnosgizmo ja valinnan ääriviiva kaikissa samanaikaisesti. Oletuksena pois päältä: ne seuraavat näkymää, jossa osoitin on, jolloin muut näkymät pysyvät siisteinä."
"settings.hint.gizmo_pivot_bottom" = "Sijoita muunnoskahvat valinnan pohjan keskelle rajauslaatikon keskikohdan sijaan, jolloin ne ovat kohdassa, jossa objekti kohtaa maan. Myös kierto ja skaalaus tapahtuvat sen ympäri, mikä pitää objektin pinnalla eikä uppoamassa sen läpi."
"settings.hint.input_actions" = "Nimetyt toiminnot yhdistävät fyysiset syötteet (näppäimet, hiiri, peliohjain) pelitoimintoihin. Skriptit lukevat niitä nimen perusteella."
