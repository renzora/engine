# ─── export_help ───
"export.cap.solari.help" = "Bevy Solarin laitteistopohjainen säteenseurattu suora ja epäsuora valaistus (DI + GI). Päällä vain, kun Solari-liitännäistä käytetään."
"export.cap.meshlets.help" = "Kokeellinen meshlet-renderöinti ja sen metis-pohjainen prosessori. Harvoin käytetty; suuri."
"export.cap.feathers.help" = "Bevyn ohjainkirjasto; Renzoran oma käyttöliittymä ei käytä sitä."
"export.cap.remote_assets.help" = "Resurssien lataus http/https-yhteyden yli ajon aikana: tuo mukanaan koko rustls/ring/ureq-TLS-pinon (useita Mt). Pois päältä pelissä, joka toimittaa paikalliset (rpak) resurssit."
"export.cap.asset_pipeline.help" = "Resurssien offline-käsittely ja pakattujen kuvien tallennus: editorin ja kehityksen työkaluja, joita julkaistu peli ei tarvitse."
"export.cap.extra_shader_langs.help" = "GLSL- ja SPIR-V-varjostintuki. Renzoran varjostimet ovat WGSL/WESL-muotoisia, joten näitä ei käytetä."
"export.cap.editor_helpers.help" = "Vapaa- ja panorointikameraohjaimet sekä järjestelmätietodiagnostiikka: vain editorille ja kehitykseen."
"export.cap.dev_extras.help" = "Pikalatauksen tiedostovalvonta, reflektion dokumentaatiotekstit (tarkastelimen työkaluvihjeet), leikepöydän käyttö, käyttöjärjestelmän fonttien haku ja Bevyn asetusjärjestelmä: kaikki vain editorille ja kehitykseen, eikä julkaistu peli käytä niitä lainkaan. (Moottori tuo leikepöydän `arboard`-taustajärjestelmän erikseen, ja täysi säästö vaatii sille oman rajauksen.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: välittömän tilan virheenjäljitysviivojen piirto (~1,3 MiB). Vain editorille ja virheenjäljitykseen; julkaistu peli käyttää sitä harvoin. (Nyt karsittavissa, koska hallitsemme Bevyn manifestia itse; aiemmin se oli kiinteästi 2d/3d-metapaketeissa.) Editorin muunnosgizmo on erillinen crate, renzora_gizmo, eikä tämä vaikuta siihen."
"export.cap.image_extra.help" = "Kaikki valinnaiset tekstuurinpurkajat: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (ja sen zlib) sekä KTX2 säilytetään aina (ikkunan kuvake / pakatut tekstuurit). Otetaan automaattisesti käyttöön projektissa todella olevien kuvatiedostojen mukaan, joten teksturiton tai yhtä muotoa käyttävä peli jättää pois purkajat, joita se ei koskaan käytä."
"export.cap.sky.help" = "Ilmakehä, taivaskupu, pilvet, yötähdet, ympäristökartat. Jätä pois 2D-pelistä."
"export.cap.particles.help" = "Partikkeliefektit: .vfx-partikkelijärjestelmä, joka toistaa myös vanhat .particle-efektit. Jätä pois, jos pelissäsi ei ole partikkeliefektejä."
"export.cap.postfx.help" = "Hehku, SSAO, SSR, syväterävyys, liikesumennus, sumu, OIT jne. (Sävykartoitus säilyy.)"
"export.cap.water.help" = "Vedenpinnan alijärjestelmä."
"export.cap.terrain.help" = "Maaston alijärjestelmä."
"export.cap.spline.help" = "Splinien alijärjestelmä."
"export.cap.navmesh.help" = "Navigointiverkon luonti ja reitinhaku (polyanya/vleue)."
"export.cap.physics.help" = "Avian-fysiikkamoottori jäykille kappaleille (~6,5 MiB). Vastaa myös veden nosteesta ja navigointiverkon törmäysmuotoesteistä, jotka karsitaan sen mukana. Jätä pois pelistä, jossa ei ole fysiikkasimulaatiota."
"export.cap.render_3d.help" = "Koko 3D-liukuhihna: bevy_pbr (StandardMaterial, varjot, deferred/forward-renderöijä), glTF-mallien lataus ja renzora_shader-graafimateriaalijärjestelmä (~10 MiB). POIS = pelkkä 2D-peli (spritet + UI). Valot ja ilmakehä toimivat edelleen (bevy_light säilytetään). Vaatii, että myös 3D-alijärjestelmät (maasto/vesi/taivas/jälkikäsittely) ovat pois päältä, koska ne rakentuvat bevy_pbr:n päälle."
"export.cap.audio.help" = "Äänen alijärjestelmä. Jätä pois äänettömästä pelistä."
"export.cap.animation.help" = "Luuranko- ja ominaisuusanimaation alijärjestelmä."
"export.cap.blueprint.help" = "Solmugraafipohjaisen visuaalisen skriptauksen ajonaikainen ympäristö (~0,2 MiB). Otetaan automaattisesti käyttöön, kun projektissa on .blueprint/.bp-graafeja."
"export.cap.rhai.help" = "Rhai-skriptien taustajärjestelmä (~2,3 MiB). Lua on aina mukana; Rhai otetaan automaattisesti käyttöön vain, kun projektissa on .rhai-skriptejä."
"export.cap.script_http.help" = "Skriptien HTTP-verbit: tuovat mukanaan ureq + rustls/ring-TLS-pinon (~1 MiB). Otetaan automaattisesti käyttöön, kun skripti kutsuu funktiota http_get/http_post."
"export.cap.game_ui.help" = "Pelin sisäisen käyttöliittymän alijärjestelmä."
