"export.packaging.web_guidance" = "Kevyt on se, mitä verkossa kannattaa julkaista, ja täällä sillä on vielä suurempi merkitys kuin muualla: valmiiksi käännetty malli on koko moottori, jonka jokainen pelaaja lataa ennen pelin alkua. Kevyt uudelleenkäännös jättää pois osat, joita tämä peli ei koskaan käytä, ja on ainoa verkkotila, joka voi sisältää liitännäisiä (selain ei voi ladata liitännäistä tiedostosta).\n\nKäytä mallia nopeaan tarkistukseen työn lomassa."
