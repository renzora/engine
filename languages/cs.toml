# ─── export_help ───
"export.cap.solari.help" = "Hardwarově ray tracované přímé i nepřímé osvětlení Bevy Solari (DI + GI). Zapnuto jen při použití pluginu Solari."
"export.cap.meshlets.help" = "Experimentální vykreslování meshletů a jeho procesor založený na metis. Používá se zřídka; velké."
"export.cap.feathers.help" = "Sada widgetů Bevy; vlastní UI Renzory ji nepoužívá."
"export.cap.remote_assets.help" = "Načítání assetů přes http/https za běhu: přitáhne celý TLS stack rustls/ring/ureq (několik MB). Vypnuto pro hru dodávající lokální assety (rpak)."
"export.cap.asset_pipeline.help" = "Offline zpracování assetů a ukládání komprimovaných obrázků: nástroje editoru a vývoje, v dodané hře nepotřebné."
"export.cap.extra_shader_langs.help" = "Podpora shaderů GLSL a SPIR-V. Shadery Renzory jsou WGSL/WESL, takže se nepoužívají."
"export.cap.editor_helpers.help" = "Ovladače volné kamery a posunu a diagnostika informací o systému: pouze editor a vývoj."
"export.cap.dev_extras.help" = "Sledování souborů pro hot reload, dokumentační řetězce reflexe (popisky inspektoru), přístup ke schránce, vyhledávání systémových písem a systém nastavení Bevy: vše pouze pro editor a vývoj, v dodané hře zcela nevyužité. (Backend schránky `arboard` přitahuje engine samostatně a pro plnou úsporu potřebuje vlastní přepínač.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: immediate-mode kreslení ladicích čar (~1,3 MiB). Pouze editor a ladění; dodaná hra jej používá zřídka. (Nyní odstranitelné, protože vlastníme explicitní manifest Bevy; dříve bylo pevně svázané s metabalíčky 2d/3d.) Gizmo transformace v editoru je samostatný crate, renzora_gizmo, a není tím dotčeno."
"export.cap.image_extra.help" = "Všechny volitelné dekodéry textur: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (+ jeho zlib) a KTX2 se vždy ponechávají (ikona okna / komprimované textury). Zapíná se automaticky podle obrazových souborů v projektu, takže hra bez textur nebo s jediným formátem vynechá dekodéry, které nikdy nepoužije."
"export.cap.sky.help" = "Atmosféra, skybox, mraky, noční hvězdy, mapy prostředí. Pro 2D hru vynechte."
"export.cap.particles.help" = "Částicové efekty: částicový systém .vfx, který přehrává i staré efekty .particle. Vynechte, pokud vaše hra nemá žádné částicové efekty."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, rozmazání pohybem, mlha, OIT atd. (Tone mapping zůstává.)"
"export.cap.water.help" = "Subsystém vodní hladiny."
"export.cap.terrain.help" = "Subsystém terénu."
"export.cap.spline.help" = "Subsystém splinů."
"export.cap.navmesh.help" = "Generování navigačních meshů a hledání cest (polyanya/vleue)."
"export.cap.physics.help" = "Fyzikální engine tuhých těles avian (~6,5 MiB). Pohání také vztlak ve vodě a překážky navmeshe z koliderů, které se odstraní s ním. Pro hru bez fyzikální simulace vynechte."
"export.cap.render_3d.help" = "Celá 3D pipeline: bevy_pbr (StandardMaterial, stíny, deferred/forward renderer), načítání modelů glTF a systém grafových materiálů renzora_shader (~10 MiB). VYPNUTO = čistě 2D hra (sprity + UI). Světla a atmosféra stále fungují (bevy_light zůstává). Vyžaduje, aby byly vypnuty i 3D subsystémy (Terén/Voda/Obloha/Post-FX), protože stavějí na bevy_pbr."
"export.cap.audio.help" = "Zvukový subsystém. Pro tichou hru vynechte."
"export.cap.animation.help" = "Subsystém skeletální animace a animace vlastností."
"export.cap.blueprint.help" = "Runtime vizuálního skriptování pomocí grafu uzlů (~0,2 MiB). Zapíná se automaticky, když projekt obsahuje grafy .blueprint/.bp."
"export.cap.rhai.help" = "Skriptovací backend Rhai (~2,3 MiB). Lua je zahrnuta vždy; Rhai se zapíná automaticky jen tehdy, když projekt obsahuje skripty .rhai."
"export.cap.script_http.help" = "HTTP příkazy pro skripty: přitáhnou TLS stack ureq + rustls/ring (~1 MiB). Zapíná se automaticky, když skript volá http_get/http_post."
"export.cap.game_ui.help" = "Subsystém herního UI."
