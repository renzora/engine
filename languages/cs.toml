"settings.hint.rail_sweep" = "Tažením po spodní liště číselného pole rychle projedete od minima k maximu; číselná oblast stále slouží k jemnému relativnímu posunu."
"settings.hint.bottom_drag" = "Přetažení assetu ze spodního panelu panel zasune, abyste viděli, kam míříte. Toto nastavení určuje, co se stane po puštění. Tažení zahájené při již zavřeném panelu jej nikdy neotevře."
"settings.hint.toggle_on_click" = "Kliknutí na řádek hierarchie rozbalí i jeho podstrom a znovu jej sbalí, když kliknutí výběr zruší. Vypnuto: větev lze sbalit jen šipkou (a klávesami Vlevo/Vpravo)."
"settings.hint.autosave" = "Pravidelně znovu ukládá otevřenou scénu. Stavový řádek místo \"Připraveno\" odpočítává."
"settings.hint.console_log_limit" = "Kolik záznamů konzole uchovává, než začne zahazovat nejstarší. Nižší hodnoty vykreslí méně řádků a stojí méně snímků; výchozí je 100."
"settings.hint.restart_editor" = "Projeví se po restartu editoru."
"settings.hint.splash_effects" = "3D animace spouštěče a animovaný opar za obrazovkou načítání. Obojí vyplňuje okno, takže je nejnáročnější na ultraširokých a 4K a větších displejích, kde je režim Automaticky vypíná."
"settings.hint.throttle_unfocused" = "Když má fokus jiné okno, editor běží zhruba na 60 snímcích za sekundu kvůli úspoře energie. Vypněte, pokud má běžet na plný výkon i na pozadí, například při profilování."
"settings.hint.render_thumbnails" = "Vykresluje náhledy modelů a materiálů, které ještě žádný nemají. Vypnutím se zobrazí jen již vykreslené miniatury a zastaví se vykreslovací proces companionu, čímž se uvolní jeho paměť, například v projektu s tisíci importovaných materiálů."
"settings.hint.external_scene_edits" = "Co se stane, když se soubor otevřené scény změní na disku A ZÁROVEŇ v ní máte neuložené změny. Bez neuložených změn se scéna vždy znovu načte. Opětovné načtení zahodí vaše neuložené změny; ponechání vašich nechá soubor být, takže jej uložení přepíše."
"settings.hint.drag_opacity" = "Jak neprůhledné zůstane gizmo transformace při tažení úchytu. Nižší hodnoty jej zprůhlední, aby byl objekt pod ním vidět; 1,0 jej ponechá zcela neprůhledné."
"settings.hint.gizmos_all_viewports" = "Při více otevřených pohledech zobrazí gizmo transformace a obrys výběru ve všech najednou. Ve výchozím stavu vypnuto: sledují pohled, ve kterém je kurzor, a ostatní pohledy zůstávají čisté."
"settings.hint.gizmo_pivot_bottom" = "Umístí úchyty transformace do středu spodku výběru místo středu ohraničujícího kvádru, takže sedí tam, kde se objekt dotýká země. Rotace a měřítko se otáčí kolem stejného bodu, takže objekt zůstane stát na povrchu a neprobořuje se."
"settings.hint.input_actions" = "Pojmenované akce mapují fyzické vstupy (klávesy, myš, gamepad) na hratelnost. Skripty je čtou podle názvu."
