# ─── export_help ───
"export.cap.solari.help" = "Bevy Solari hardware-raytracet direkte og indirekte belysning (DI + GI). Kun slået til, når Solari-pluginet bruges."
"export.cap.meshlets.help" = "Eksperimentel meshlet-rendering og dens metis-baserede processor. Sjældent brugt; stor."
"export.cap.feathers.help" = "Bevys widget-værktøjssæt; bruges ikke af Renzoras egen UI."
"export.cap.remote_assets.help" = "Indlæsning af assets over http/https under kørsel; trækker hele rustls/ring/ureq-TLS-stakken ind (flere MB). Slået fra for et spil, der leveres med lokale (rpak) assets."
"export.cap.asset_pipeline.help" = "Offline asset-behandling og lagring af komprimerede billeder; editor-/udviklerværktøjer, som et udgivet spil ikke har brug for."
"export.cap.extra_shader_langs.help" = "Understøttelse af GLSL- og SPIR-V-shadere. Renzoras shadere er WGSL/WESL, så disse bruges ikke."
"export.cap.editor_helpers.help" = "Fri-/panoreringskamerastyring og systeminfo-diagnostik; kun til editor/udvikling."
"export.cap.dev_extras.help" = "Filovervågning til hot reload, reflection-dokumentationsstrenge (værktøjstip i inspektøren), adgang til udklipsholderen, opdagelse af systemskrifttyper og Bevys indstillingssystem; alt sammen kun til editor/udvikling og ubrugt i et udgivet spil. (Udklipsholderens `arboard`-backend trækkes ind separat af motoren og kræver sin egen gate for den fulde besparelse.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: immediate-mode-tegning af fejlfindingslinjer (~1,3 MiB). Kun til editor/fejlfinding; et udgivet spil bruger det sjældent. (Kan nu fjernes, fordi vi ejer det eksplicitte Bevy-manifest; det var tidligere svejset fast i 2d/3d-metapakkerne.) Editorens transformationsgizmo er et separat crate, renzora_gizmo, og påvirkes ikke."
"export.cap.image_extra.help" = "Alle valgfrie teksturdekodere: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (+ dens zlib) og KTX2 beholdes altid (vinduesikon / komprimerede teksturer). Aktiveres automatisk ud fra de billedfiler, der faktisk findes i projektet, så et spil uden teksturer eller med ét format udelader de dekodere, det aldrig bruger."
"export.cap.sky.help" = "Atmosfære, skybox, skyer, nattestjerner, miljøkort. Udelad til et 2D-spil."
"export.cap.particles.help" = "Partikeleffekter: .vfx-partikelsystemet, som også afspiller gamle .particle-effekter. Udelad det, hvis dit spil ikke har partikeleffekter."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, bevægelsessløring, tåge, OIT osv. (Tonemapping bevares.)"
"export.cap.water.help" = "Vandoverfladesystemet."
"export.cap.terrain.help" = "Terrænsystemet."
"export.cap.spline.help" = "Spline-systemet."
"export.cap.navmesh.help" = "Generering af navigationsmesh og stifinding (polyanya/vleue)."
"export.cap.physics.help" = "Avian-fysikmotoren til stive legemer (~6,5 MiB). Driver også vandopdrift og navmesh-kolliderforhindringer, som fjernes sammen med den. Udelad til et spil uden fysiksimulering."
"export.cap.render_3d.help" = "Hele 3D-pipelinen: bevy_pbr (StandardMaterial, skygger, deferred/forward-renderer), indlæsning af glTF-modeller og renzora_shaders graf-materialesystem (~10 MiB). FRA = et rent 2D-spil (sprites + UI). Lys/atmosfære virker stadig (bevy_light bevares). Kræver, at 3D-systemerne (Terræn/Vand/Himmel/Efterbehandling) også er slået fra; de bygger på bevy_pbr."
"export.cap.audio.help" = "Lydsystemet. Udelad til et spil uden lyd."
