"settings.hint.rail_sweep" = "Træk i den nederste skyderskinne i et talfelt for hurtigt at feje det fra min. til maks.; talområdet laver stadig den fine relative justering."
"settings.hint.bottom_drag" = "Når du trækker en asset ud af bundpanelet, glider det i, så du kan se, hvad du sigter mod. Dette er, hvad der sker, når du slipper. Et træk, der starter med panelet allerede lukket, åbner det aldrig."
"settings.hint.toggle_on_click" = "Et klik på en hierarkirække folder også dens undertræ ud og ind igen, når klikket fravælger den. Slået fra er pilen (og venstre/højre piletast) den eneste måde at folde en gren på."
"settings.hint.autosave" = "Gemmer den åbne scene igen med faste mellemrum. Statuslinjen tæller ned i stedet for \"Klar\"."
"settings.hint.console_log_limit" = "Hvor mange poster konsollen beholder, før de ældste fjernes. Lavere værdier viser færre rækker og koster færre billeder; 100 er standard."
"settings.hint.restart_editor" = "Træder i kraft, når editoren genstartes."
"settings.hint.splash_effects" = "Startprogrammets 3D-filmsekvens og det animerede dis bag indlæsningsskærmen. Begge fylder vinduet, så de koster mest på ultrabrede skærme og 4K eller større, hvor Auto slår dem fra."
"settings.hint.throttle_unfocused" = "Mens et andet vindue har fokus, kører editoren med cirka 60 billeder i sekundet for at spare strøm. Slå dette fra for at holde fuld hastighed i baggrunden, f.eks. under profilering."
"settings.hint.render_thumbnails" = "Render forhåndsvisninger for modeller og materialer, der endnu ikke har nogen. Slå dette fra for kun at vise allerede renderede miniaturer og stoppe companion-appens render-worker og frigøre dens hukommelse, f.eks. i et projekt med tusindvis af importerede materialer."
"settings.hint.external_scene_edits" = "Hvad der sker, når den åbne scenes fil ændres på disken, OG du har ikke-gemte ændringer i den. Uden ikke-gemte ændringer genindlæses scenen altid. Genindlæsning kasserer dine ikke-gemte ændringer; beholder du dine, røres filen ikke, så lagring overskriver den."
"settings.hint.drag_opacity" = "Hvor uigennemsigtig transformationsgizmoen forbliver, mens du trækker i et håndtag. Lavere værdier toner den ud, så objektet nedenunder forbliver synligt; 1,0 holder den helt uigennemsigtig."
"settings.hint.gizmos_all_viewports" = "Når flere viewports er åbne, vises transformationsgizmoen og markeringsomridset i dem alle på én gang. Slået fra som standard; de følger den viewport, markøren er i, så de andre visninger forbliver rene."
"settings.hint.gizmo_pivot_bottom" = "Placér transformationshåndtagene nederst i midten af markeringen i stedet for midt i dens afgrænsningsboks, så de sidder, hvor objektet møder jorden. Rotation og skalering drejer også om dette punkt, så et objekt bliver stående på overfladen i stedet for at synke igennem den."
"settings.hint.input_actions" = "Navngivne handlinger knytter fysiske input (taster, mus, gamepad) til gameplay. Scripts læser dem ved navn."
"settings.hint.no_plugins" = "Ingen plugin-indstillinger registreret. Plugins tilføjer sektioner her via `register_settings_section`."
"settings.hint.no_installed_plugins" = "Ingen plugins installeret. Læg et i plugin-mappen ved siden af editoren."
"settings.hint.plugins_restart" = "Ændringer træder i kraft, næste gang editoren starter. Et plugin tilføjer systemer og ressourcer, mens appen samles, og de kan ikke trækkes tilbage, når den kører."
