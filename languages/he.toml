"settings.hint.external_scene_edits" = "מה קורה כשקובץ הסצנה הפתוחה משתנה בדיסק וגם יש לך בה שינויים שלא נשמרו. כשאין שינויים שלא נשמרו, הסצנה תמיד נטענת מחדש. טעינה מחדש מבטלת את השינויים שלא נשמרו; שמירת השינויים שלך משאירה את הקובץ כמו שהוא, כך ששמירה תדרוס אותו."
"settings.hint.drag_opacity" = "עד כמה גיזמו הטרנספורמציה נשאר אטום בזמן גרירת ידית. ערכים נמוכים מעמעמים אותו כך שהאובייקט שמתחתיו נשאר גלוי; 1.0 משאיר אותו אטום לגמרי."
