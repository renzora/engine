"export.cap.solari.help" = "תאורה ישירה ועקיפה במעקב קרניים בחומרה של Bevy Solari (DI + GI). פועל רק כשמשתמשים בתוסף Solari."
"export.cap.meshlets.help" = "רינדור meshlet ניסיוני והמעבד שלו המבוסס על metis. בשימוש נדיר; גדול."
"export.cap.feathers.help" = "ערכת הפקדים של Bevy: לא בשימוש בממשק של Renzora עצמו."
"export.cap.remote_assets.help" = "טעינת נכסים דרך http/https בזמן ריצה: מושכת את כל מחסנית ה-TLS של rustls/ring/ureq (כמה MB). כבוי למשחק שמפיץ נכסים מקומיים (rpak)."
"export.cap.asset_pipeline.help" = "עיבוד נכסים לא מקוון ושמירת תמונות דחוסות: כלי עורך/פיתוח, אין בהם צורך במשחק מופץ."
"export.cap.extra_shader_langs.help" = "תמיכה בשיידרים של GLSL ו-SPIR-V. השיידרים של Renzora הם WGSL/WESL, ולכן אלה אינם בשימוש."
"export.cap.editor_helpers.help" = "בקרי מצלמה חופשית/הזזה ואבחון מידע מערכת: לעורך/פיתוח בלבד."
"export.cap.dev_extras.help" = "מעקב קבצים לטעינה חמה, מחרוזות תיעוד של reflection (תיאורי כלים במפקח), גישה ללוח, איתור גופני מערכת ומערכת ההגדרות של bevy: כולם לעורך/פיתוח בלבד, ללא שום שימוש במשחק מופץ. (מנוע `arboard` של הלוח נמשך בנפרד על ידי המנוע וזקוק לשער משלו לחיסכון המלא.)"
"export.cap.gizmos.help" = "bevy_gizmos + bevy_gizmos_render: ציור קווי ניפוי באגים במצב מיידי (כ-1.3 MiB). לעורך/ניפוי באגים בלבד; משחק מופץ משתמש בזה לעיתים רחוקות. (כעת ניתן להסרה כי מניפסט ה-bevy המפורש בבעלותנו; בעבר הוא היה מולחם לתוך מטא־החבילות של 2d/3d.) גיזמו הטרנספורמציה של העורך הוא crate נפרד, renzora_gizmo, ואינו מושפע."
"export.cap.image_extra.help" = "כל מפענחי הטקסטורות האופציונליים: DDS, JPEG, WebP, basis-universal, EXR/HDR, TIFF, GIF, BMP, TGA, PNM, QOI. PNG (וה-zlib שלו) ו-KTX2 תמיד נשמרים (סמל החלון / טקסטורות דחוסות). מופעל אוטומטית לפי קובצי התמונה שבפועל נמצאים בפרויקט, כך שמשחק ללא טקסטורות או עם פורמט יחיד משמיט את המפענחים שהוא אף פעם לא משתמש בהם."
"export.cap.sky.help" = "אטמוספרה, כיפת שמיים, עננים, כוכבי לילה, מפות סביבה. אפשר להשמיט במשחק 2D."
"export.cap.particles.help" = "אפקטי חלקיקים: מערכת החלקיקים .vfx, שמנגנת גם אפקטי .particle ישנים. אפשר להשמיט אם אין במשחק שלך אפקטי חלקיקים."
"export.cap.postfx.help" = "Bloom, SSAO, SSR, DoF, טשטוש תנועה, ערפל, OIT וכו׳. (מיפוי הטונים נשאר.)"
"export.cap.water.help" = "תת־מערכת משטח המים."
"export.cap.terrain.help" = "תת־מערכת פני השטח."
"export.cap.spline.help" = "תת־מערכת הספליינים."
"export.cap.navmesh.help" = "יצירת רשת ניווט ומציאת מסלולים (polyanya/vleue)."
"export.cap.physics.help" = "מנוע הפיזיקה לגופים קשיחים avian (כ-6.5 MiB). מפעיל גם את הציפה במים ואת מכשולי גופי ההתנגשות של רשת הניווט, שמוסרים יחד איתו. אפשר להשמיט במשחק ללא סימולציית פיזיקה."
"export.cap.render_3d.help" = "כל צינור ה-3D: bevy_pbr (StandardMaterial, צללים, מרנדר deferred/forward), טעינת מודלי glTF ומערכת חומרי הגרף renzora_shader (כ-10 MiB). כבוי = משחק 2D בלבד (ספרייטים + UI). אורות/אטמוספרה עדיין עובדים (bevy_light נשמר). דורש שגם תת־המערכות התלת־ממדיות (פני שטח/מים/שמיים/Post-FX) יהיו כבויות, כי הן בנויות על bevy_pbr."
"export.cap.audio.help" = "תת־מערכת השמע. אפשר להשמיט במשחק ללא קול."
"export.cap.animation.help" = "תת־מערכת אנימציית השלד/המאפיינים."
"export.cap.blueprint.help" = "סביבת הריצה של סקריפטים ויזואליים מבוססי גרף צמתים (כ-0.2 MiB). מופעלת אוטומטית כשהפרויקט מכיל גרפים מסוג .blueprint/.bp."
"export.cap.rhai.help" = "מנוע הסקריפטים Rhai (כ-2.3 MiB). Lua תמיד כלול; Rhai מופעל אוטומטית רק כשהפרויקט מכיל סקריפטי .rhai."
"export.cap.script_http.help" = "פעולות ה-HTTP של סקריפטים: מושכות את ureq ואת מחסנית ה-TLS של rustls/ring (כ-1 MiB). מופעל אוטומטית כשסקריפט קורא ל-http_get/http_post."
"export.cap.game_ui.help" = "תת־מערכת הממשק בתוך המשחק."
