name: Build Engine

# Cross-compile of the engine (editor + runtime) for every platform, using the
# same Docker toolchain images the `renzora` CLI drives — and, when asked,
# publishing the result as a GitHub release.
#
# ── What it produces ─────────────────────────────────────────────────────────
# Per desktop platform, two assets (see `scripts/package-release.sh`):
#   <platform>.zip                  the ENGINE (editor + runtime together)
#   renzora-runtime-<platform>.zip  the EXPORT TEMPLATE the editor downloads to
#                                   build a game for a platform it isn't running
#                                   on (`renzora_export::download`)
# Plus `manifest.json` — the editor resolves and checksums a template from this
# one file, by its deterministic download URL, so it needs no GitHub API call.
#
# ── Three ways in ────────────────────────────────────────────────────────────
#   schedule            a nightly, tagged `<version>-nightly-<ddmonyy>`
#                       (`r1-alpha7-nightly-16aug26`), published as a PRERELEASE.
#                       One release per night; the 14 most recent are kept.
#                       Skipped when nothing landed on `main` that day.
#   push (tag r1-*)     a real release, tagged with the version itself.
#   workflow_dispatch   build only, or build + publish as either kind.
#
# The version string is NOT written here — it is read out of
# `crates/renzora/src/version.rs`, which is also what the running binary reports
# and what the export downloader asks GitHub for. One source, three consumers.
#
# ── Arch coverage ────────────────────────────────────────────────────────────
#   linux    x86_64 + aarch64  native, one runner each  (`desktop` job)
#   macos    x86_64 + aarch64  native, one runner each  (`desktop` job)
#   windows  x86_64 + aarch64  native, one runner each  (`desktop` job)
#   wasm     wasm32            container                (`build` job)
#
# ── Why every desktop slice is native ────────────────────────────────────────
# Because an editor cannot be cross-built. It ships a plugin SDK so the machine
# it runs on can compile native plugins and Rust scripts, and an SDK's
# proc-macro dylibs are artifacts of whatever ran the compiler — build it in the
# Linux container and the Windows user gets Linux `.so` proc macros, which their
# `rustc` cannot load: `can't find crate for bevy_derive`, and with it every name
# behind `bevy::prelude`. Nor can it be patched afterwards, since each `.rmeta`
# records the hash of what it was compiled against. `docker/build-all.sh` staged
# such an SDK for months before anyone ran a cross-built editor's script tier.
#
# So the container now stages runtimes only, and the desktop lanes here build
# the published editors on their own operating systems. Each `cargo renzora dist`
# tree yields BOTH release assets — the engine zip, and the export template
# `package-release.sh` cuts from the same directory by excluding
# `renzora-editor` — so nothing is built twice.
#
# Windows arm64 could never have ridden the container anyway: the only MSVC
# pieces Microsoft lets you redistribute (so xwin can bake them into a public
# image) are the CRT + SDK, leaving clang as the C compiler, and clang cannot
# stand in for MSVC on ARM64 (it emits MSVC NEON intrinsics as undefined
# externals no redistributable lib provides). See docker/windows/Dockerfile.
#
# None of these lanes has a build cache and each takes hours, which makes them
# the long pole on every publishing run — so `publish` treats them as
# best-effort and ships whichever slices arrived rather than waiting on a
# failure.

on:
  schedule:
    # 02:00 UTC daily. The nightly's own build time is added on top, and the
    # windows-arm64 slice alone can run for hours.
    - cron: "0 2 * * *"
  push:
    tags:
      - "r1-alpha*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform(s) to build"
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos
          - wasm
      publish:
        description: "Publish the result as a release"
        type: choice
        default: none
        options:
          - none
          - nightly
          - release

env:
  REGISTRY: ghcr.io/renzora
  # How many dated nightly releases to keep. Older ones (and their tags) are
  # deleted after a successful publish so the releases page stays readable.
  KEEP_NIGHTLIES: 14

jobs:
  # ── Decide what to build, what to call it, and whether to publish ───────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      desktop: ${{ steps.plan.outputs.desktop }}
      containers: ${{ steps.plan.outputs.containers }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history for the "did anything land today?" check below.
          fetch-depth: 100

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ── Version: single source of truth ──────────────────────────────
          version=$(grep -oP 'ENGINE_VERSION: &str = "\K[^"]+' crates/renzora/src/version.rs)
          if [ -z "$version" ]; then
            echo "::error::could not read ENGINE_VERSION from crates/renzora/src/version.rs"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # ── Which platforms, and whether we publish ──────────────────────
          # A schedule or a tag push has no inputs, so both default to the full
          # platform set; only a manual run can narrow it.
          platform="${{ inputs.platform || 'all' }}"
          case "${{ github.event_name }}" in
            schedule) publish=nightly ;;
            push)     publish=release ;;
            *)        publish="${{ inputs.publish || 'none' }}" ;;
          esac

          # ── The tag ──────────────────────────────────────────────────────
          # A release is tagged with the version itself; a nightly appends the
          # date as `16aug26`, which is what `renzora::version::channel()` keys
          # off (tag == version → Release, anything else → Nightly).
          case "$publish" in
            release)
              if [ "${{ github.event_name }}" = "push" ]; then
                tag="${GITHUB_REF#refs/tags/}"
              else
                tag="$version"
              fi
              ;;
            nightly)
              tag="$version-nightly-$(date -u +%d%b%y | tr '[:upper:]' '[:lower:]')"
              ;;
            *)
              tag=""
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # ── Nothing new? Don't build a nightly. ──────────────────────────
          # A daily cron on a quiet week would otherwise publish 7 identical
          # releases and burn ~6 runner-hours each.
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(git rev-list --count --since='24 hours ago' HEAD)" = "0" ]; then
              echo "::notice::no commits in the last 24h — skipping tonight's nightly"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

          # ── The two matrices ─────────────────────────────────────────────
          # Desktop platforms build NATIVELY, one runner each; the containers
          # keep only what has no native runner.
          #
          # This is not a preference. An editor ships a plugin SDK, and an SDK
          # cannot be cross-built: its proc-macro dylibs are artifacts of the
          # machine that ran the compiler, so a Linux container produces Linux
          # ones whatever `--target` says. Handing those to a Windows user gives
          # `can't find crate for bevy_derive` and, behind it, every name in
          # `bevy::prelude`. `docker/build-all.sh` therefore stages no editor at
          # all, which leaves the published editors to these lanes.
          #
          # Desktop containers are gone rather than kept for the runtimes,
          # because a native tree already yields both release assets — the
          # engine zip, and the export template that `package-release.sh` cuts
          # from the same directory by excluding `renzora-editor`. Keeping them
          # would compile every runtime twice to produce one artifact.
          wasm='{"platform":"wasm","arches":"wasm32"}'
          case "$platform" in
            all|wasm) inc="$wasm" ;;
            *)        inc="" ;;
          esac
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          # An empty include runs zero jobs and reports `skipped`, which the
          # publish gate has to tell apart from a real failure.
          [ -n "$inc" ] && echo "containers=true" >> "$GITHUB_OUTPUT" \
                        || echo "containers=false" >> "$GITHUB_OUTPUT"

          # `dist_dir` is the directory xtask stages into, and the name
          # `package-release.sh` matches on. `runner` pins an image rather than
          # a floating `-latest` where the label has recently moved: macos-latest
          # became macOS 26 (arm64) in mid-2026, so Intel has to be asked for by
          # name — `macos-26-intel`, which is GA and supported to Aug 2027.
          lx64='{"dist_dir":"linux-x64","runner":"ubuntu-latest"}'
          larm='{"dist_dir":"linux-arm64","runner":"ubuntu-24.04-arm"}'
          wx64='{"dist_dir":"windows-x64","runner":"windows-latest"}'
          warm='{"dist_dir":"windows-arm64","runner":"windows-11-arm"}'
          mx64='{"dist_dir":"macos-x64","runner":"macos-26-intel"}'
          marm='{"dist_dir":"macos-arm64","runner":"macos-latest"}'
          case "$platform" in
            all)     dinc="$lx64,$larm,$wx64,$warm,$mx64,$marm" ;;
            linux)   dinc="$lx64,$larm" ;;
            windows) dinc="$wx64,$warm" ;;
            macos)   dinc="$mx64,$marm" ;;
            wasm)    dinc="" ;;
          esac
          echo "desktop={\"include\":[$dinc]}" >> "$GITHUB_OUTPUT"

          echo "### Build Engine" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- platforms: \`$platform\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- publish: \`$publish\`${tag:+ as \`$tag\`}" >> "$GITHUB_STEP_SUMMARY"
          echo "- skipped: \`$skip\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: setup
    # Gated on `containers`, not on the matrix being empty: an empty `include`
    # is a matrix-expansion error, not zero jobs. Every desktop-only run leaves
    # nothing for a container to build, which is now the common case.
    if: needs.setup.outputs.skip != 'true' && needs.setup.outputs.containers == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # bevy + the full plugin set across multiple target triples needs more than
      # the runner's default free space; reclaim the preinstalled SDKs we don't
      # use before the build fills the disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` (not the content-hash tag) for the same reason test.yml does:
      # this workflow and docker-image.yml are independent, so the hash-tagged
      # image for the current Dockerfile may not be published yet; `:latest` with
      # eventual consistency is fine for an on-demand build.
      #
      # RENZORA_RELEASE_TAG / RENZORA_BUILD_COMMIT are read by `option_env!` in
      # `renzora::version` when the contract crate compiles, so a published
      # binary knows its own tag and doesn't have to guess which release matches
      # it. Empty on a non-publishing run, which `version.rs` reads as "dev".
      #
      # RENZORA_PROFILE names the shipping profile and nothing more. It used to
      # read `platform == 'windows' && 'dist' || 'release'`, because Windows
      # cannot link `bevy_dylib` at `opt-level = "s"` (the PE export table is
      # 16-bit). That put a property of the TARGET in the caller, so it held only
      # for callers that knew — and `renzora build windows`, which runs this same
      # script from the CLI, did not: it took the `release` default and failed to
      # link. `build_one` in docker/build-all.sh now forces `dist` for a
      # windows-* platform itself, so every caller gets it and this line stays
      # one value.
      - name: Build ${{ matrix.platform }} (${{ matrix.arches }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app/src" \
            -w /app/src \
            -e RENZORA_RELEASE_TAG="${{ needs.setup.outputs.tag }}" \
            -e RENZORA_BUILD_COMMIT="${{ github.sha }}" \
            -e RENZORA_PROFILE="release" \
            "${REGISTRY}/${{ matrix.platform }}:latest" \
            bash docker/build-all.sh dist ${{ matrix.platform }}

      # docker runs as root, so the dist tree is root-owned; hand it back to the
      # runner user before upload-artifact reads it.
      - name: Reclaim ownership of build output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dist || true

      - name: Upload ${{ matrix.platform }} build
        uses: actions/upload-artifact@v4
        with:
          name: renzora-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Desktop — native, one runner per platform, no container ──────────────────
  # These lanes build the published EDITORS, and they are native because an
  # editor cannot be cross-built. It carries a plugin SDK so the machine it runs
  # on can compile native plugins and Rust scripts, and an SDK's proc-macro
  # dylibs are artifacts of whatever ran the compiler — cross-compiling in the
  # Linux container yields Linux ones no matter what `--target` says. The user
  # then gets `can't find crate for bevy_derive` and every name behind
  # `bevy::prelude` with it. So `docker/build-all.sh` stages no editor, and the
  # editors are built here instead, each on its own operating system.
  #
  # Every lane runs `cargo renzora dist` — the same xtask a contributor uses
  # locally — which compiles the workspace on the `dist` profile and stages
  # `dist/<platform>/` with the layout the loader expects. One tree yields BOTH
  # release assets: `package-release.sh` zips it whole as the engine, and cuts
  # the export template from the same directory by excluding `renzora-editor`.
  # That is why the desktop containers were retired rather than kept for the
  # runtimes — they would compile every runtime a second time to produce an
  # artifact this already contains.
  #
  # `windows-11-arm`, `macos-26-intel` and `ubuntu-24.04-arm` are GitHub-hosted
  # and free on a public repository, which this is. `macos-26-intel` is named
  # explicitly because `macos-latest` moved to macOS 26 on Apple Silicon in mid
  # 2026, so Intel is no longer reachable through a floating label.
  desktop:
    needs: setup
    # Same reason the container job checks a flag rather than the matrix: a
    # wasm-only run leaves this empty, and an empty `include` fails expansion.
    if: needs.setup.outputs.skip != 'true' && needs.setup.outputs.desktop != '{"include":[]}'
    strategy:
      # One platform failing must not cancel five hours of work on the other
      # five. `publish` takes whichever slices arrived.
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    # A cold full-workspace bevy build on these runners is measured in hours,
    # well past the 360-minute job default it would otherwise silently inherit.
    timeout-minutes: 350
    env:
      # No cache is restored here, so incremental artifacts are pure disk cost —
      # and disk, not time, is the tighter budget on a Windows runner.
      CARGO_INCREMENTAL: 0
      RENZORA_RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      RENZORA_BUILD_COMMIT: ${{ github.sha }}
      # Build the profile that ships, by NAME. These lanes run `cargo renzora`
      # (xtask), which defaults to the fast-link `dist` profile a contributor
      # iterates with; `RENZORA_PROFILE` is the same variable
      # `docker/build-all.sh` reads, so both entry points name one profile
      # instead of each holding an idea of what the shipping build is.
      #
      # It used to reconstruct `release` by overriding two keys on `dist`, with a
      # comment asking whoever edits `[profile.release]` to keep them in step.
      # Nothing enforced that, and the drift was invisible until it wasn't:
      # `bevy_dylib` exceeds the PE 65,535-symbol export cap at `opt-level = "s"`
      # (269,482 against 41,958 at `2`), and because no local build ever used that
      # configuration it could only surface here, after a full cross-compile.
      #
      # `dist` rather than `release`, for that same cap — Windows cannot ship a
      # size-optimised build while Bevy is a dylib. See `[profile.dist]` in the
      # root Cargo.toml.
      RENZORA_PROFILE: dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The container image installs these for the Linux lanes; a hosted Ubuntu
      # runner has none of them. The list mirrors docker/base/Dockerfile — alsa
      # and udev are linked at build, the X11/Wayland/Vulkan/xkbcommon headers
      # are there so the build stays honest about what it compiles against.
      # zstd packs the SDK further down.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            libudev-dev libvulkan-dev libssl-dev zstd

      # appimagetool turns the AppDir that `--bundle` builds into a `.AppImage`.
      # Optional to the bundler — the AppDir alone already satisfies
      # `TemplateManager::scan` and `package-release.sh` — but the published
      # Linux asset has always been an AppImage, so install it here rather than
      # let the release quietly change shape.
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          arch=$(uname -m)
          url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage"
          curl -fsSL "$url" -o appimagetool
          sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          rm -f appimagetool
          # A hosted runner has no FUSE, which an AppImage needs to mount itself.
          # `--appimage-extract-and-run` is the documented way round it.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # The arm64 Windows image is leaner than windows-latest and doesn't
      # preinstall Rust. Guarded so this is a no-op on every other runner, all of
      # which ship rustup — which is also why the installer URL can name aarch64
      # unconditionally: nothing else ever reaches it.
      - name: Install rustup
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # rust-toolchain.toml pins the channel; `rustup show` is what installs it
      # up front rather than mid-build, where the download would be buried in
      # cargo's output and its failure mode much less obvious.
      #
      # `shell: bash` from here down. It is available on all three runner
      # operating systems, and one script per step beats three dialects of the
      # same three lines.
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup show
          cargo --version
          rustc --version --verbose

      # `--bundle` wraps the staged tree the way it ships — AppImage on Linux,
      # `.app` on macOS, a no-op on Windows. Not the default, because wrapping
      # moves the binary out from under `cargo renzora`'s launch step and makes
      # every local build pay for mksquashfs. It matters here because
      # `TemplateManager::scan` and `package-release.sh` both read the Linux and
      # macOS runtime from *inside* the bundle, so a flat tree is invisible to
      # them. See `xtask/src/bundle.rs`.
      - name: Build + stage
        shell: bash
        run: cargo renzora dist --bundle

      # The one check that needs a staged macOS tree, which is why it lives here
      # and not in test.yml: a native plugin is compiled against the SDK *after*
      # the engine is built, so nothing cheaper than a full build can produce one
      # to look at.
      #
      # What it catches: dyld keys images by the path a load command resolves to,
      # unlike `ld.so` (SONAME) and Windows (module name). The SDK stages the
      # shared dylibs as hardlinks carrying the build tree's absolute install
      # name, so a plugin that links them asks for `/…/target/dist/deps/…` while
      # the host asks for `@rpath/…` beside the executable — two paths, two
      # images, and two of every process-global static in 118 MB of Bevy. The
      # plugin then gets the half nobody initialised, which surfaced as
      # `IoTaskPool has not been initialized` from inside `Plugin::finish`.
      #
      # `rustc::fixup_install_names` rewrites those to `@rpath` after each link.
      # This asserts it actually ran, on the real artifact, rather than trusting
      # that both build paths remembered to call it. An absolute dependency
      # outside `/usr/lib` and `/System` is wrong here whatever produced it — it
      # names a directory on the machine that did the build.
      - name: Audit plugin install names
        if: runner.os == 'macOS'
        shell: bash
        run: |
          out=dist/${{ matrix.dist_dir }}
          bad=""
          while IFS= read -r lib; do
            deps=$(otool -L "$lib" | tail -n +3 \
                   | awk '{print $1}' \
                   | grep '^/' | grep -v '^/usr/lib' | grep -v '^/System' || true)
            if [ -n "$deps" ]; then
              echo "::group::$lib"
              echo "$deps"
              echo "::endgroup::"
              bad="$bad $lib"
            fi
          done < <(find "$out/plugins" -name '*.dylib')
          if [ -n "$bad" ]; then
            echo "::error::plugins link absolute build-tree paths:$bad"
            exit 1
          fi
          echo "every staged plugin resolves its dependencies through @rpath"

      # Packed here because this is now the only kind of lane that has an SDK to
      # pack: the container lanes stage no editor and therefore no SDK, since an
      # SDK's proc macros are artifacts of the machine that compiled them and a
      # Linux container can only produce Linux ones. The staged tree is ~1.9 GB
      # of loose crate metadata, and uploading it extracted makes this artifact
      # several times larger for no benefit. xtask needs the tree in place while
      # it builds the native plugins, so packing happens after rather than
      # instead.
      #
      # Skipped without zstd rather than failed — the artifact is then merely
      # fat, and `package-release.sh` compresses it later.
      - name: Pack the plugin SDK
        shell: bash
        run: |
          out=dist/${{ matrix.dist_dir }}
          [ -d "$out/sdk" ] || exit 0
          if ! command -v zstd >/dev/null 2>&1; then
            echo "zstd unavailable — shipping sdk/ extracted (packaging will compress it)"
            exit 0
          fi
          ( cd "$out" && tar -cf - sdk | zstd -19 --long=27 -T0 -q -o sdk.tar.zst -f )
          rm -rf "$out/sdk"
          ls -lh "$out/sdk.tar.zst"

      # Disk exhaustion is the likeliest failure on these runners, and cargo's
      # error for it is unhelpful; report free space either way so a failed run
      # says so directly instead of needing a second run to diagnose.
      - name: Report disk usage
        if: always()
        shell: bash
        run: df -h

      # `dist/` (not `dist/<platform>/`) so the artifact has the same
      # <artifact>/<platform>/… shape as the container lane — which is what
      # `package-release.sh` walks.
      - name: Upload ${{ matrix.dist_dir }} build
        uses: actions/upload-artifact@v4
        with:
          name: renzora-${{ matrix.dist_dir }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Publish ─────────────────────────────────────────────────────────────────
  # `if: always()` because the desktop lanes are best-effort: each is measured in
  # hours and none has a build cache, so a release waits for them but does not
  # depend on them. Whatever slices arrived get published; the rest are simply
  # absent from `manifest.json`, which the editor reads as "no template for that
  # platform".
  #
  # `build` is checked with `!= 'failure'` rather than `== 'success'`, because it
  # now reports `skipped` whenever the run has no container platform to build —
  # every narrowed desktop run, since only wasm goes through a container. A
  # skipped container job is a normal outcome; a failed one is not.
  publish:
    needs: [setup, build, desktop]
    if: always() && needs.setup.outputs.publish != 'none' && needs.setup.outputs.skip != 'true' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Every desktop slice now arrives unpacked. They are built by xtask, which
      # does no packing — deliberately, since xtask is also the local dev path
      # and nobody wants to iterate on a packed binary. (The container lane packs
      # its own output via `compress_binaries`, which has to happen there so
      # macOS is packed BEFORE it is signed; that only applies to the platforms
      # it still builds.)
      #
      # So this catches whatever arrived unpacked. `upx -t` succeeds only on an
      # already-packed file, which makes the pass idempotent and safe to run over
      # every artifact rather than special-casing a lane.
      #
      # macOS is pruned, and has to be. Packing rewrites the executable, which
      # invalidates the ad-hoc signature `fixup_macos` applied — and arm64 macOS
      # refuses to launch a binary whose signature does not match, so a packed
      # slice would be smaller and dead. The container got this order right by
      # packing before signing; a native lane signs during staging, so the only
      # correct choice left here is not to pack. macOS ships uncompressed.
      - name: Compress any unpacked executables
        run: |
          set -euo pipefail
          UPX_VERSION=5.1.1
          curl -sSL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" -o /tmp/upx.tar.xz
          tar -xJf /tmp/upx.tar.xz -C /tmp
          UPX=/tmp/upx-${UPX_VERSION}-amd64_linux/upx
          while IFS= read -r -d '' f; do
            if "$UPX" -t "$f" >/dev/null 2>&1; then continue; fi
            before=$(stat -c %s "$f")
            if "$UPX" --best --lzma -q "$f" >/dev/null 2>&1; then
              after=$(stat -c %s "$f")
              awk -v b="$before" -v a="$after" -v n="$f" \
                'BEGIN { printf "packed %s: %.1f MB -> %.1f MB (%.0f%% saved)\n", n, b/1048576, a/1048576, (1-a/b)*100 }'
            else
              echo "WARN: upx declined $f — shipping it uncompressed"
            fi
          done < <(find artifacts -path '*macos*' -prune -o \
                     \( -name 'renzora' -o -name 'renzora.exe' \
                        -o -name 'renzora-editor' -o -name 'renzora-editor.exe' \) -type f -print0)

      - name: Package release assets
        run: |
          bash scripts/package-release.sh artifacts release-assets \
            "${{ needs.setup.outputs.tag }}" "${{ github.sha }}"

      # A nightly re-run on the same day would collide with its own tag, and a
      # nightly is disposable by definition — replace it rather than inventing a
      # `-2` suffix nobody could predict the name of.
      - name: Replace an existing nightly with the same tag
        if: needs.setup.outputs.publish == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.setup.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::replacing existing nightly $tag"
            gh release delete "$tag" --yes --cleanup-tag
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.setup.outputs.tag }}"
          version="${{ needs.setup.outputs.version }}"
          prerelease=""
          title="Renzora Engine $tag"
          if [ "${{ needs.setup.outputs.publish }}" = "nightly" ]; then
            prerelease="--prerelease"
            title="Renzora Engine $tag (nightly)"
          fi

          {
            if [ "${{ needs.setup.outputs.publish }}" = "nightly" ]; then
              echo "Automated nightly build of \`$version\` from [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
              echo
              echo "> Nightlies are unreviewed builds of \`main\`. They are the right thing to run if you are developing *against* the engine and want the latest fixes; they are not the right thing to ship a game on."
            else
              echo "Renzora Engine \`$version\`."
            fi
            echo
            echo "### Engine"
            echo "\`<platform>.zip\` — the editor and the game runtime together. Unzip and run \`renzora-editor\` (Linux: the \`.AppImage\`; macOS: \`Renzora Engine.app\`)."
            echo
            echo "It also carries \`sdk.tar.zst\` — the Rust SDK. The first time you launch after installing or updating, the editor shows a short setup window while it unpacks that (a few seconds) and compiles any native plugins, then restarts straight into the editor. After that the archive is deleted and startup is normal."
            echo
            echo "The SDK is what lets Rust scripts and native plugins be compiled on your machine rather than shipped prebuilt, so they keep working when the engine updates instead of going stale. Compiling also needs the Rust toolchain, which the editor offers to install at that point."
            echo
            echo "### Export templates"
            echo "\`renzora-runtime-<platform>.zip\` — the game runtime for one platform, with no editor. You do not download these by hand: the editor fetches the ones it needs from **Export → Packaging → Runtime template**, which is how you export for a platform you are not running on."
            echo
            echo "\`manifest.json\` lists every asset with its size and SHA-256; \`SHA256SUMS\` is the same digests in \`sha256sum -c\` form."
          } > notes.md

          # Nightlies are cut from whatever `main` is at build time; a tag push
          # already has its own commit, and --target on an existing tag is a
          # no-op, so passing the sha is right in both cases.
          gh release create "$tag" \
            --title "$title" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $prerelease \
            release-assets/*

      # Keep the releases page navigable. Only dated nightlies are ever removed —
      # `r1-alpha*` releases are permanent.
      - name: Prune old nightlies
        if: needs.setup.outputs.publish == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="${{ needs.setup.outputs.version }}-nightly-"
          # `gh release list` is newest-first, so everything past KEEP_NIGHTLIES
          # is the tail to drop.
          gh release list --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"$prefix\"))] | sort_by(.createdAt) | reverse | .[${KEEP_NIGHTLIES}:] | .[].tagName" \
            > stale.txt || true
          while read -r stale; do
            [ -n "$stale" ] || continue
            echo "pruning $stale"
            gh release delete "$stale" --yes --cleanup-tag || true
          done < stale.txt

      - name: Summary
        run: |
          echo "### Published \`${{ needs.setup.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
