# Third-party plugins: compile every marketplace plugin that is not in
# renzora/plugins against an official engine build, give the ones that compile a
# signed prebuilt binary, and record every result (with the compiler's output
# for the failures) on the marketplace, where each plugin's creator sees it.
#
# Always against an OFFICIAL build: the SDK comes from the engine's own GitHub
# release, never from a creator, whose engine could be anything.
#
# Run by:
#   - `build-engine.yml`, after every nightly and stable release is published:
#     every third-party plugin against that build;
#   - `plugin-release.yml`, when a creator publishes a release: just that
#     plugin, against the latest nightly and the latest stable build;
#   - by hand, for a given release tag and optionally one listing.
#
# ── Trust ────────────────────────────────────────────────────────────────────
# Compiling a crate runs its code (`build.rs`, proc macros, its dependencies'
# build scripts). So the jobs that compile third-party code hold NOTHING worth
# stealing and can change nothing:
#
#   - `build` references no secret (GitHub gives a job only the secrets it
#     names) and runs with `permissions: {}`, so even the automatic repository
#     token can do nothing;
#   - one job per plugin per platform, each on a fresh machine, so one plugin's
#     build script cannot tamper with another plugin's binary before it is
#     signed (on a shared machine it could, and a malicious plugin could then
#     poison a popular plugin's signed binary for all of its users);
#   - `publish` signs, but compiles nothing third-party, and it signs only from
#     facts it trusts: the plugin id and version the marketplace listed, the
#     platform of the job, the official SDK's stamp, and a hash it measures.
#     Nothing a build job wrote about its own output is signed, so a library
#     cannot relabel itself as another plugin.
#
# The signature then means "Renzora's CI built this from the source the creator
# uploaded, against this official build": the same trust as compiling it
# yourself, which is what installing from source already is.
name: Third-party plugins

on:
  workflow_call:
    inputs:
      tag:
        description: Engine release whose SDKs to build against
        type: string
        required: true
      asset_id:
        description: Only this listing (empty means every third-party plugin)
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Engine release tag to build against (e.g. r1-alpha8-nightly-20nov26)
        type: string
        required: true
      asset_id:
        description: Only this listing's id (blank = every third-party plugin)
        type: string
        required: false
        default: ""

permissions: {}

env:
  # renzora.com is behind Cloudflare, which blocks curl's default User-Agent.
  UA: renzora-engine-ci/third-party-plugins

jobs:
  # ── What to build ─────────────────────────────────────────────────────────
  # Asks the marketplace which release of each plugin this engine version
  # installs, leaves out renzora/plugins (built and signed by `build-engine.yml`
  # already), and fetches each one's source, so no build job needs a token.
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.list.outputs.any }}
      matrix: ${{ steps.list.outputs.matrix }}
      engine_version: ${{ steps.list.outputs.engine_version }}
    steps:
      - name: List and fetch the plugins
        id: list
        env:
          TOKEN: ${{ secrets.RENZORA_MARKETPLACE_TOKEN }}
          TAG: ${{ inputs.tag }}
          ONLY: ${{ inputs.asset_id }}
        run: |
          set -euo pipefail
          # `r1-alpha8-nightly-20nov26` and `r1-alpha8` are both engine r1-alpha8.
          version="${TAG%%-nightly-*}"
          echo "engine_version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::RENZORA_MARKETPLACE_TOKEN is not set; no third-party plugins were built"
            echo "any=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          curl -sSf -A "$UA" -H "Authorization: Bearer $TOKEN" \
            "https://renzora.com/api/prebuilt-plugins/build-list?engine_version=$version" > list.json

          # Official plugins are renzora/plugins'; they have their own job.
          git clone -q --depth 1 https://github.com/renzora/plugins official
          grep -h '^marketplace_id' official/*/Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/' | jq -R . | jq -s . > official.json
          jq --slurpfile off official.json --arg only "$ONLY" '
            [ .[] | select(.marketplace_id as $m | ($off[0] | index($m)) | not)
                  | select($only == "" or .asset_id == $only) ]' list.json > candidates.json
          # A prebuilt is filed under, and an editor matches it by, the listing's
          # marketplace id, so a listing that never claimed one cannot have one.
          # Said in the summary rather than skipped silently.
          jq '[ .[] | select(.marketplace_id != "") ]' candidates.json > expect.json
          jq -r '.[] | select(.marketplace_id == "") | "- \(.name): no marketplace id, so it cannot have a prebuilt"' \
            candidates.json >> "$GITHUB_STEP_SUMMARY"
          count=$(jq length expect.json)
          echo "$count third-party plugin(s) to build for $version"

          mkdir -p sources
          for row in $(jq -r '.[] | "\(.asset_id)/\(.release_id)"' expect.json); do
            asset="${row%/*}"
            curl -sSf -A "$UA" -H "Authorization: Bearer $TOKEN" \
              "https://renzora.com/api/prebuilt-plugins/source/$row" -o "sources/$asset.zip"
          done
          cp expect.json sources/

          # One job per plugin per platform, for the reason at the top. GitHub
          # caps a matrix at 256 jobs, 42 plugins on 6 platforms.
          platforms='[
            {"platform":"linux-x64","runner":"ubuntu-24.04","container":"almalinux:8"},
            {"platform":"linux-arm64","runner":"ubuntu-24.04-arm","container":"almalinux:8"},
            {"platform":"windows-x64","runner":"windows-latest"},
            {"platform":"windows-arm64","runner":"windows-11-arm"},
            {"platform":"macos-x64","runner":"macos-26-intel"},
            {"platform":"macos-arm64","runner":"macos-latest"}]'
          matrix=$(jq -c --argjson p "$platforms" \
            '{include: [ .[] as $a | $p[] | {asset_id: $a.asset_id, marketplace_id: $a.marketplace_id} + . ]}' expect.json)
          if [ "$(echo "$matrix" | jq '.include | length')" -gt 256 ]; then
            echo "::error::more than 256 plugin builds; the matrix needs splitting"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          [ "$count" -gt 0 ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

      - name: Keep the sources
        if: steps.list.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tp-sources
          path: sources
          retention-days: 3

  # ── The official SDK, once per platform ──────────────────────────────────
  # Out of the engine's own release asset, with the tools the build and publish
  # jobs run (compiled from this repository, so trusted). Per platform because
  # an SDK's proc macros only run on the machine kind that built them.
  sdk:
    needs: list
    if: needs.list.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux in the same AlmaLinux 8 container the engine's Linux lanes
          # build in (build-engine.yml, `slice`): the tools built here run in
          # the `build` job's container, and a plugin linked against a newer
          # glibc than the editor's floor would not load where the editor runs.
          - { platform: linux-x64, runner: ubuntu-24.04, container: "almalinux:8", asset: linux-x64.zip }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, container: "almalinux:8", asset: linux-arm64.zip }
          - { platform: windows-x64, runner: windows-latest, asset: windows-x64.zip }
          - { platform: windows-arm64, runner: windows-11-arm, asset: windows-arm64.zip }
          - { platform: macos-x64, runner: macos-26-intel, asset: macos-x64.zip }
          - { platform: macos-arm64, runner: macos-latest, asset: macos-arm64.zip }
    runs-on: ${{ matrix.runner }}
    # Empty, so no container, everywhere but Linux.
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      # git first, so checkout is a real clone; then the engine's own Linux
      # toolchain script, plus gh for the release download below.
      - name: git for checkout
        if: matrix.container != ''
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Linux container toolchain
        if: matrix.container != ''
        shell: bash
        run: bash .github/scripts/el8-toolchain.sh --gh

      - name: Install rustup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Fetch the release's SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${{ matrix.asset }}" -D release
          # The engine's shared images (`bevy_dylib`, `renzora_dylib`) as well as
          # the archive: a release leaves them out of `sdk.tar.zst`, because the
          # engine already ships them, and the unpacker links them back in from
          # beside the executable or from its `--root`. This job runs neither
          # inside the engine nor beside it, so it hands them over in `work/`.
          mkdir -p out/images
          case "$RUNNER_OS" in
            macOS)
              # macOS ships a `ditto` zip of the signed `.app`; the SDK and the
              # shared images live inside it at `Contents/MacOS`. `ditto -x -k`
              # unpacks it faithfully (see
              # `renzora_update::install::unwrap_download`).
              ditto -x -k "release/${{ matrix.asset }}" release/app
              macos="release/app/Renzora Engine.app/Contents/MacOS"
              cp "$macos/sdk.tar.zst" out/
              # Whichever the `.app` ships: if `librenzora_dylib` is folded into
              # `sdk.tar.zst` rather than sitting beside the exe, the `[ -f ]`
              # simply skips it here.
              for f in libbevy_dylib.dylib librenzora_dylib.dylib; do
                if [ -f "$macos/$f" ]; then cp "$macos/$f" out/images/; fi
              done
              ;;
            *)
              py=$(command -v python3 || command -v python)
              "$py" - "release/${{ matrix.asset }}" out <<'PY'
          import os, sys, zipfile, shutil
          z = zipfile.ZipFile(sys.argv[1])
          out = sys.argv[2]
          images = {"bevy_dylib.dll", "renzora_dylib.dll", "libbevy_dylib.so", "librenzora_dylib.so"}
          def copy(member, dest):
              with z.open(member) as src, open(dest, "wb") as dst:
                  shutil.copyfileobj(src, dst)
          names = z.namelist()
          copy(next(n for n in names if n.endswith("sdk.tar.zst")), os.path.join(out, "sdk.tar.zst"))
          # Windows: the images sit beside the executable in the zip itself.
          for n in names:
              if os.path.basename(n) in images and "plugins/" not in n:
                  copy(n, os.path.join(out, "images", os.path.basename(n)))
          # Linux: the binaries live only inside the AppImage. Hand it to the
          # shell, which extracts the images from it.
          appimage = next((n for n in names if n.endswith(".AppImage")), None)
          if appimage and not os.listdir(os.path.join(out, "images")):
              copy(appimage, os.path.join("release", "engine.AppImage"))
          PY
              if [ -f release/engine.AppImage ]; then
                # `--appimage-extract` unpacks the squashfs without mounting it,
                # so it needs no FUSE on the runner.
                chmod +x release/engine.AppImage
                ( cd release && ./engine.AppImage --appimage-extract >/dev/null )
                for f in libbevy_dylib.so librenzora_dylib.so; do
                  if [ -f "release/squashfs-root/$f" ]; then cp "release/squashfs-root/$f" out/images/; fi
                done
              fi
              ;;
          esac
          # Not a fixed count: a platform ships whichever images its executable
          # imports, and any the archive left out but this download lacks are
          # named by the unpacker below, which is the one that knows.
          ls -lh out/sdk.tar.zst out/images

      # `.cargo/config.toml` links x86_64 Linux with clang + mold, and the
      # hosted runner ships clang but not mold.
      - name: Install mold
        if: matrix.platform == 'linux-x64' && matrix.container == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold

      - name: Build the tools
        shell: bash
        run: |
          set -euo pipefail
          rustup show >/dev/null
          cargo build -q --profile dist -p renzora_plugin_build \
            --example unpack_sdk --example check_plugins
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          cp "target/dist/examples/unpack_sdk$exe" "target/dist/examples/check_plugins$exe" out/
          # The `build` job never checks out this repository (it runs untrusted
          # code), so the Linux toolchain script travels with the tools.
          cp .github/scripts/el8-toolchain.sh out/
          # The stamp, for the publish job, which never unpacks a 1.9 GB SDK.
          # The images go in `work/`, the root the unpacker links them from.
          mkdir -p work && cp out/images/* work/
          out/unpack_sdk$exe --archive out/sdk.tar.zst --root work >/dev/null
          # `tr -d '\r'`: jq on Windows ends its output with CRLF, `$(cat)`
          # strips only the LF, and a stamp ending in a carriage return
          # matches no plugin's ABI record, so the signer refused every
          # Windows binary.
          jq -r '.build_id + "+rustc-" + .rustc' work/sdk/manifest.json | tr -d '\r' > stamp.txt
          jq -r '.rustc' work/sdk/manifest.json | tr -d '\r' > out/rustc.txt
          cat stamp.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tp-sdk-${{ matrix.platform }}
          path: out
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: tp-stamp-${{ matrix.platform }}
          path: stamp.txt
          retention-days: 3

  # ── Compile: untrusted code, no secrets, nothing writable ─────────────────
  build:
    needs: [list, sdk]
    if: always() && needs.list.outputs.any == 'true' && needs.sdk.result != 'cancelled'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Linux compiles in the AlmaLinux 8 container, so a prebuilt plugin needs no
    # newer glibc than the editor it loads into. Empty elsewhere.
    container: ${{ matrix.container }}
    permissions: {}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tp-sdk-${{ matrix.platform }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          name: tp-sources
          path: sources

      # The engine's Linux toolchain, from the `sdk` job's artifact rather than
      # a checkout (this job has none). The same GCC toolset and `cc` the engine
      # was built with, which is what keeps a plugin's floor at the engine's.
      - name: Linux container toolchain
        if: matrix.container != ''
        shell: bash
        run: bash tools/el8-toolchain.sh

      - name: Install rustup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Compile ${{ matrix.marketplace_id }}
        shell: bash
        run: |
          set -uo pipefail
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          chmod +x tools/* 2>/dev/null || true
          # The toolchain the SDK was built with; a plugin must match it.
          rustc_version=$(tr -d '\r\n' < tools/rustc.txt)
          rustup toolchain install "$rustc_version" --profile minimal >/dev/null
          export RUSTUP_TOOLCHAIN="$rustc_version"
          mkdir -p work && cp tools/images/* work/
          "tools/unpack_sdk$exe" --archive tools/sdk.tar.zst --root work >/dev/null

          # The source zip, at its crate's root (the manifest may sit one
          # directory down, as the editor's installer also allows).
          id="${{ matrix.marketplace_id }}"
          py=$(command -v python3 || command -v python)
          "$py" - "sources/${{ matrix.asset_id }}.zip" "plugins/$id" <<'PY'
          import sys, zipfile, os
          z = zipfile.ZipFile(sys.argv[1])
          manifests = sorted((n for n in z.namelist() if n.endswith("Cargo.toml")), key=lambda n: n.count("/"))
          prefix = manifests[0][: -len("Cargo.toml")] if manifests else ""
          for n in z.namelist():
              if not n.startswith(prefix) or n.endswith("/"):
                  continue
              rel = n[len(prefix):]
              if rel.startswith("/") or ".." in rel.split("/"):
                  continue
              dest = os.path.join(sys.argv[2], rel)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              with z.open(n) as src, open(dest, "wb") as dst:
                  dst.write(src.read())
          PY

          mkdir -p result
          RENZORA_PLUGIN_CHECK_DIR="$PWD/built" "tools/check_plugins$exe" \
            --sdk work/sdk --plugins plugins --results result/results.json
          status=$?
          # Whatever the build left, under a fixed name: the publish job decides
          # what it is, from facts of its own, not from this job.
          lib=$(find built -maxdepth 2 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) | head -1)
          [ -n "$lib" ] && cp "$lib" "result/library.bin"
          ls -l result
          # Red when the plugin does not compile, so the Actions page says so.
          # The results are still kept (the upload below runs regardless) and
          # the publish job still records the failure on the listing.
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tp-out-${{ matrix.platform }}-${{ matrix.asset_id }}
          path: result
          retention-days: 3

  # ── Sign and publish: secrets, no third-party code ────────────────────────
  publish:
    needs: [list, sdk, build]
    if: always() && needs.list.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the signer
        run: |
          # The same clang + mold linker setting as the sdk job's.
          sudo apt-get update -qq && sudo apt-get install -y -qq mold
          cargo build -q --profile dist -p renzora_plugin_build --example sign_prebuilt

      - uses: actions/download-artifact@v4
        with:
          name: tp-sources
          path: sources
      - uses: actions/download-artifact@v4
        with:
          pattern: tp-stamp-*
          path: stamps
      - uses: actions/download-artifact@v4
        with:
          pattern: tp-out-*
          path: out

      - name: Sign, upload and record
        env:
          PREBUILT_SIGNING_KEY: ${{ secrets.PREBUILT_SIGNING_KEY }}
          TOKEN: ${{ secrets.RENZORA_MARKETPLACE_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.list.outputs.engine_version }}
        run: |
          set -uo pipefail
          api=https://renzora.com/api/prebuilt-plugins
          ext() { case "$1" in windows-*) echo dll ;; macos-*) echo dylib ;; *) echo so ;; esac; }
          prefix() { case "$1" in windows-*) echo "" ;; *) echo lib ;; esac; }
          built=0; skipped=0; failed=0
          echo "### Third-party plugins on \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plugin | Platform | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for platform in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-x64 macos-arm64; do
            stamp=$(tr -d '\r\n' < "stamps/tp-stamp-$platform/stamp.txt" 2>/dev/null || echo "")
            # Trusted facts: what the marketplace listed, never what a build wrote.
            while IFS=$'\t' read -r asset id version; do
              dir="out/tp-out-$platform-$asset"
              ok=false; summary=""; log=""
              if [ -z "$stamp" ]; then
                summary="the official SDK for this platform could not be prepared"
              elif [ ! -f "$dir/results.json" ]; then
                summary="the build job did not finish"
              else
                ok=$(jq -r '.[0].ok // false' "$dir/results.json")
                summary=$(jq -r '.[0].detail // ""' "$dir/results.json")
                log=$(jq -r '.[0].log // ""' "$dir/results.json")
              fi
              # `ok` is whether the plugin COMPILED, which is what its creator
              # and the listing are told. Not getting a prebuilt out of a good
              # compile (signing or upload failing) is this pipeline's problem,
              # not the plugin's, so it is reported here as `unpublished` and
              # never recorded as "does not compile".
              unpublished=""
              if [ "$ok" = "true" ] && [ -f "$dir/library.bin" ]; then
                crate=$(echo "$id" | tr '-' '_')
                lib="$RUNNER_TEMP/$(prefix "$platform")$crate.$(ext "$platform")"
                cp "$dir/library.bin" "$lib"
                if target/dist/examples/sign_prebuilt --library "$lib" --id "$id" --version "$version" \
                     --platform "$platform" --stamp "$stamp" > statement.json 2> sign.err; then
                  # Gzipped, with a raw retry for a site that predates
                  # `library_gz`: see the same upload in build-engine.yml for
                  # why (Cloudflare's firewall matches strings in raw bodies).
                  gzip -9 -c "$lib" > library.gz
                  upload() {
                    curl -sS -o response.json -w '%{http_code}' -A "$UA" \
                      -H "Authorization: Bearer $TOKEN" \
                      -F "statement=<statement.json" -F "engine_tag=$TAG" -F "engine_version=$VERSION" \
                      -F "$1" "$api/upload"
                  }
                  code=$(upload "library_gz=@library.gz")
                  if [ "$code" = "400" ] && grep -q 'missing library' response.json; then
                    code=$(upload "library=@$lib")
                  fi
                  [ "$code" = "200" ] || unpublished="the upload failed (HTTP $code)"
                else
                  # The usual cause: an engine build older than prebuilts, whose
                  # SDK writes no build record into a plugin for the signer to
                  # check (and whose editor could not install a prebuilt anyway).
                  unpublished="not signed: $(cat sign.err)"
                fi
                summary="compiled"
                [ -n "$unpublished" ] && summary="compiled; no prebuilt for this engine build"
              elif [ "$ok" = "true" ]; then
                ok=false; summary="the build reported success but left no library"
              fi
              jq -n --arg id "$id" --arg v "$version" --arg p "$platform" --arg s "$stamp" --arg t "$TAG" \
                    --argjson ok "$ok" --arg sum "$summary" --arg log "$log" \
                '{marketplace_id:$id, version:$v, platform:$p, engine_stamp:$s, engine_tag:$t, ok:$ok, summary:$sum, log:$log}' \
                > result.json
              if [ -n "$stamp" ]; then
                curl -sS -o /dev/null -A "$UA" -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" --data @result.json "$api/build-result" || true
              fi
              if [ "$ok" != "true" ]; then
                failed=$((failed + 1))
                echo "| \`$id\` $version | $platform | ${summary//|/\\|} |" >> "$GITHUB_STEP_SUMMARY"
              elif [ -n "$unpublished" ]; then
                skipped=$((skipped + 1))
                echo "| \`$id\` $version | $platform | compiled, but no prebuilt: ${unpublished//|/\\|} |" >> "$GITHUB_STEP_SUMMARY"
              else
                built=$((built + 1))
              fi
            done < <(jq -r '.[] | [.asset_id, .marketplace_id, .version] | @tsv' sources/expect.json)
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$built compiled and published, $skipped compiled without a prebuilt, $failed failed to compile.**" >> "$GITHUB_STEP_SUMMARY"
